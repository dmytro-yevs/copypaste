name: hotkey_manager_macos
description: CopyPaste-maintained macOS implementation of hotkey_manager with Swift Package Manager support.
version: 0.2.0+copypaste.1
publish_to: none
repository: https://github.com/leanflutter/hotkey_manager/tree/main/packages/hotkey_manager_macos

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hotkey_manager_platform_interface: ^0.2.0

flutter:
  plugin:
    implements: hotkey_manager
    platforms:
      macos:
        pluginClass: HotkeyManagerMacosPlugin
