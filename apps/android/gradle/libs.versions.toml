# Version catalogue.
#
# NOTHING IN THIS FILE HAS BEEN RESOLVED. The machine this project was written
# on cannot reach `dl.google.com`, so neither the Android Gradle Plugin nor the
# Android SDK could be downloaded and no Gradle task has ever run here. Treat
# every version below as a starting point a reviewer must confirm against the
# real toolchain, not as a tested combination. See ../README.md.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coroutines = "1.9.0"
# Compose BOM pins every androidx.compose.* artifact, so those have no version
# of their own below. One number to move.
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
# UniFFI's Kotlin backend calls the `.so` through JNA, not through hand-written
# JNI. The `@aar` classifier matters: the plain jar has no Android native
# libraries and fails at runtime with UnsatisfiedLinkError.
jna = "5.15.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin itself and is turned
# on by this plugin. There is no separate `composeOptions { kotlinCompilerExtensionVersion }`
# block any more, and adding one is the most common way to get a version-skew
# error on a modern toolchain.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
