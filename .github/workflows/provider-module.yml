name: Fedora compositor closure diagnostic

on:
  workflow_dispatch:
    inputs:
      module:
        description: Required provider-workflow compatibility input; unused by this diagnostic
        required: true
        type: choice
        options: [supabase, semantic-search]
      publish:
        description: Must remain false; this diagnostic never publishes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fedora-closure-smoke:
    if: inputs.publish == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build disposable Fedora 40 RPM inspection image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg KWIN_FAMILY=6.0 \
            --file packaging/linux/desktop-integrations/kde-native-clipboard/Dockerfile.fedora40-build \
            --tag copypaste-fedora-closure-smoke:6.0 .
      - name: Smoke the private closure against installed Fedora KWin RPMs
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            copypaste-fedora-closure-smoke:6.0 bash -lc '
              set -euxo pipefail
              runtime=/tmp/kwin-runtime
              stage=/tmp/kwin-stage
              mkdir -p "$runtime" "$stage"
              rpm -q kwin kwin-wayland
              while IFS= read -r source; do
                [[ -f "$source" || -L "$source" ]] || continue
                target="$runtime$source"
                mkdir -p "$(dirname "$target")"
                cp -a --no-dereference "$source" "$target"
              done < <(rpm -ql kwin kwin-wayland | sort -u)
              test -x "$runtime/usr/bin/kwin_wayland"
              license_file=/workspace/packaging/linux/desktop-integrations/kde-native-clipboard/src/copypasteclipboardbridge.cpp
              test -f "$license_file"
          python3 - "$runtime" <<"PYTHON"
          import importlib.util
          import subprocess
          import sys
          from collections import deque
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("closure", "/workspace/packaging/linux/compositor-runtime/private_elf_closure.py")
          closure = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(closure)
          root = Path(sys.argv[1])
          initial = closure.exported_elfs(root)
          private = {value for path in initial if (value := closure.provided_soname(path)) is not None}
          cache = closure.library_cache()
          queue = deque((name, cache[name]) for path in initial for name in sorted(closure.needed(path)) if name not in closure.GLIBC_SONAMES and name not in private)
          seen = set()
          while queue:
              requested, candidate = queue.popleft()
              source = closure.trusted_library(candidate)
              if source in seen:
                  continue
              seen.add(source)
              try:
                  closure.rpm_owner(source)
              except closure.ClosureError:
                  raw = subprocess.run(["rpm", "-qf", "--qf", "%{NAME}\\n%{EVR}\\n%{LICENSE}\\n", str(source)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
                  print(f"invalid_owner_path={source}")
                  print(f"invalid_owner_rpm_exit={raw.returncode}")
                  print(f"invalid_owner_rpm_fields={raw.stdout!r}")
                  fields = raw.stdout.splitlines()
                  if fields:
                      licenses = subprocess.run(["rpm", "-ql", fields[0]], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
                      paths = [item for item in licenses.stdout.splitlines() if item.startswith("/usr/share/licenses/")]
                      print(f"invalid_owner_license_list_exit={licenses.returncode}")
                      print(f"invalid_owner_license_paths={paths!r}")
                  raise
              for name in sorted(closure.needed(source)):
                  if name not in closure.GLIBC_SONAMES and name not in private:
                      queue.append((name, cache[name]))
          print(f"rpm_owner_preflight_libraries={len(seen)}")
          PYTHON
              python3 /workspace/packaging/linux/compositor-runtime/private_elf_closure.py \
                --runtime-dir "$runtime" --entrypoint usr/bin/kwin_wayland
              python3 /workspace/packaging/linux/compositor-runtime/emit_runtime_receipt.py \
                --runtime-dir "$runtime" --output /tmp/runtime-receipt.json \
                --runtime-id kwin-6.0-fedora40-smoke --desktop KDE \
                --source-revision 1ddcb4e288c4f7dcecdc94efccd655b7e3666d30 \
                --patch /workspace/packaging/linux/desktop-integrations/kde-native-clipboard/patches/kwin-6.0.patch \
                --glibc-floor 2.39 --private-entrypoint usr/bin/kwin_wayland \
                --qualification-entrypoint usr/bin/kwin_wayland --license-file "$license_file"
              python3 /workspace/packaging/linux/compositor-runtime/stage_runtime.py \
                --receipt /tmp/runtime-receipt.json --runtime-dir "$runtime" \
                --stage-root "$stage" --expected-architecture x86_64
              python3 /workspace/packaging/linux/compositor-runtime/verify_runtime_package.py \
                --root "$stage" --runtime-id kwin-6.0-fedora40-smoke
              python3 /workspace/packaging/linux/compositor-runtime/build_companion_package.py \
                --receipt /tmp/runtime-receipt.json --runtime-dir "$runtime" \
                --version 1.0.0 --format rpm --output /tmp/kwin-closure-smoke.rpm
              printf '%s\n' '--- private RPM requires ---'
              rpm -qp --requires /tmp/kwin-closure-smoke.rpm | sort
              printf '%s\n' '--- private RPM provides ---'
              rpm -qp --provides /tmp/kwin-closure-smoke.rpm | sort
              printf '%s\n' '--- private RPM obsoletes/conflicts ---'
              rpm -qp --obsoletes /tmp/kwin-closure-smoke.rpm | sort
              rpm -qp --conflicts /tmp/kwin-closure-smoke.rpm | sort
          python3 - /tmp/kwin-runtime/usr/share/copypaste/compositor-runtime-private-closure.json <<"PY"
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"closure_libraries={len(value['libraries'])}")
          print(f"closure_rpms={len(value['packages'])}")
          print(f"closure_license_files={len(value['licenses'])}")
          PY
            '
