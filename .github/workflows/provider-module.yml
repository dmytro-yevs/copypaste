name: V4L2 loopback hosted diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Diagnose exact-kernel V4L2 loopback load
        run: |
          set -euo pipefail
          kernel="$(uname -r)"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "linux-headers-$kernel" v4l2loopback-dkms v4l-utils
          dkms status
          modinfo v4l2loopback
          dpkg-query -W -f='${binary:Package} ${Version}\n' "linux-headers-$kernel" "linux-modules-$kernel" "linux-modules-extra-$kernel" || true
          apt-cache policy linux-azure linux-modules-extra-azure "linux-modules-extra-$kernel"
          apt-cache search '^linux-modules-extra.*azure$'
          apt-cache search "^linux-modules-extra-${kernel%%-*}"
          apt-cache depends "linux-modules-$kernel" || true
          find "/lib/modules/$kernel" -type f \( -name 'v4l2loopback.ko*' -o -name 'videodev.ko*' \) -print
          if sudo modprobe v4l2loopback video_nr=42 card_label=CopyPasteQualification exclusive_caps=1; then
            sudo modprobe -r v4l2loopback
            exit 0
          fi
          sudo dmesg | tail -n 200
          exit 1
