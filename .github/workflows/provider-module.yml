name: V4L2 loopback hosted diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prove exact-kernel V4L2 loopback feed
        run: |
          set -euo pipefail
          export COPYPASTE_QUALIFICATION_HEADLESS=1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          state="$RUNNER_TEMP/copypaste-v4l2loopback.json"
          producer=""
          cleanup() {
            status=$?
            if [[ -n "$producer" ]]; then
              kill "$producer" 2>/dev/null || true
              wait "$producer" || true
            fi
            python3 scripts/release/provision-linux-v4l2loopback.py cleanup --state "$state" --missing-ok
            exit "$status"
          }
          trap cleanup EXIT
          python3 scripts/release/provision-linux-v4l2loopback.py provision --state "$state" --environment "$GITHUB_ENV"
          test "$(stat -c '%a' /dev/video42)" = 600
          ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=64x48:rate=10 -pix_fmt yuyv422 -f v4l2 /dev/video42 &
          producer=$!
          ffmpeg -hide_banner -loglevel error -f v4l2 -input_format yuyv422 -video_size 64x48 -i /dev/video42 -frames:v 1 -f rawvideo "$RUNNER_TEMP/copypaste-v4l2-frame.raw"
          test -s "$RUNNER_TEMP/copypaste-v4l2-frame.raw"
          v4l2-ctl --device /dev/video42 --all
