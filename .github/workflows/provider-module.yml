name: Fedora compositor closure diagnostic

on:
  workflow_dispatch:
    inputs:
      module:
        description: Required provider-workflow compatibility input; unused by this diagnostic
        required: true
        type: choice
        options: [supabase, semantic-search]
      publish:
        description: Must remain false; this diagnostic never publishes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fedora-closure-smoke:
    if: inputs.publish == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Smoke Fedora 40 KWin RPM closure metadata
        run: bash scripts/release/diagnostics/fedora-closure-smoke.sh
