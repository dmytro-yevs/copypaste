name: Linux Qt wire diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare Qt D-Bus fixture connection modes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install diagnostic dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build qt6-base-dev strace
      - name: Build and trace the exact fixture and disposable controls
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/packaging/linux/desktop-integrations/kde-native-clipboard/test-wire"
          evidence="$RUNNER_TEMP/qt-wire-evidence"
          mkdir -p "$evidence"
          phase() { printf 'PHASE %s %s\n' "$1" "$(date --iso-8601=seconds)" | tee -a "$evidence/phases.log" >&2; }
          phase source
          git rev-parse HEAD | tee "$evidence/source-commit.txt"
          sha256sum "$source_root/main.cpp" "$source_root/CMakeLists.txt" | tee "$evidence/source-sha256.txt"
          qmake6 -v | tee "$evidence/qt-version.txt"
          cmake --version | sed -n '1p' | tee "$evidence/cmake-version.txt"
          printf 'runner=%s\narch=%s\n' "$(uname -srvmo)" "$(uname -m)" | tee "$evidence/environment.txt"

          build_variant() {
            local name="$1"
            local mode="$2"
            local directory="$RUNNER_TEMP/qt-wire-$name"
            phase "build-$name"
            rm -rf "$directory"
            mkdir -p "$directory"
            cp "$source_root/CMakeLists.txt" "$directory/CMakeLists.txt"
            cp "$source_root/main.cpp" "$directory/main.cpp"
            if [[ "$mode" == peer ]]; then
              python3 - "$directory/main.cpp" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old_connect = 'QDBusConnection::connectToBus(server.address(), connectionName)'
          old_disconnect = 'QDBusConnection::disconnectFromBus(connectionName);'
          if source.count(old_connect) != 1 or source.count(old_disconnect) != 1:
              raise SystemExit('unexpected exact fixture connection shape')
          source = source.replace(old_connect, 'QDBusConnection::connectToPeer(server.address(), connectionName)')
          source = source.replace(old_disconnect, 'QDBusConnection::disconnectFromPeer(connectionName);')
          marker = 'qDBusRegisterMetaType<WriterIdentity>();'
          if source.count(marker) != 1:
              raise SystemExit('unexpected exact fixture metatype registration shape')
          source = source.replace(marker, marker + '\n    qRegisterMetaType<QMap<QString, QByteArray>>("QMap<QString,QByteArray>");')
          path.write_text(source)
          PY
            fi
            sha256sum "$directory/main.cpp" > "$evidence/$name-source-sha256.txt"
            cmake -S "$directory" -B "$directory/build" -G Ninja -DCMAKE_BUILD_TYPE=Release >"$evidence/$name-configure.log" 2>&1
            cmake --build "$directory/build" --parallel 2 >"$evidence/$name-build.log" 2>&1
            printf '%s' "$directory/build/copypaste-kwin-clipboard-wire-fixture"
          }

          run_fixture() {
            local name="$1" executable="$2"
            phase "run-$name"
            set +e
            timeout --signal=TERM --kill-after=2s 10s strace -ff -tt -s 256 -o "$evidence/$name.strace" "$executable" >"$evidence/$name.log" 2>&1
            local status=$?
            set -e
            printf '%s\n' "$status" > "$evidence/$name-exit-status.txt"
            printf 'RESULT %s exit=%s\n' "$name" "$status" | tee -a "$evidence/phases.log"
          }

          baseline="$(build_variant same-process-bus bus)"
          run_fixture same-process-bus "$baseline"
          peer="$(build_variant same-process-peer peer)"
          run_fixture same-process-peer "$peer"

          phase build-split-control
          split="$RUNNER_TEMP/qt-wire-split"
          rm -rf "$split"
          mkdir -p "$split"
          cat > "$split/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.21)
          project(copypaste_qt_wire_split_control LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Core DBus)
          set(CMAKE_AUTOMOC ON)
          qt_add_executable(copypaste-qt-wire-server server.cpp)
          qt_add_executable(copypaste-qt-wire-client client.cpp)
          target_link_libraries(copypaste-qt-wire-server PRIVATE Qt6::Core Qt6::DBus)
          target_link_libraries(copypaste-qt-wire-client PRIVATE Qt6::Core Qt6::DBus)
          target_compile_features(copypaste-qt-wire-server PRIVATE cxx_std_17)
          target_compile_features(copypaste-qt-wire-client PRIVATE cxx_std_17)
          CMAKE
          cat > "$split/server.cpp" <<'CPP'
          #include <QCoreApplication>
          #include <QDBusArgument>
          #include <QDBusConnection>
          #include <QDBusMetaType>
          #include <QDBusServer>
          #include <QDir>
          #include <QFile>
          #include <QMap>
          #include <QTextStream>
          #include <QTimer>
          #include <optional>
          struct WriterIdentity { QString status; quint32 pid = 0; quint32 uid = 0; QString appId; };
          Q_DECLARE_METATYPE(WriterIdentity)
          QDBusArgument &operator<<(QDBusArgument &a, const WriterIdentity &i) { a.beginStructure(); a << i.status << i.pid << i.uid << i.appId; a.endStructure(); return a; }
          const QDBusArgument &operator>>(const QDBusArgument &a, WriterIdentity &i) { a.beginStructure(); a >> i.status >> i.pid >> i.uid >> i.appId; a.endStructure(); return a; }
          class ClipboardFixture final : public QObject {
              Q_OBJECT
              Q_CLASSINFO("D-Bus Interface", "app.copypaste.Clipboard")
          public Q_SLOTS:
              Q_SCRIPTABLE void Version(uint &version) { version = 2; }
              Q_SCRIPTABLE void Snapshot(qulonglong &generation, QStringList &mimes, WriterIdentity &identity) { generation = 7; mimes = {QStringLiteral("text/plain")}; identity = {QStringLiteral("verified"), 101, 1000, QStringLiteral("org.example.Writer")}; }
              Q_SCRIPTABLE QByteArray Read(qulonglong, const QString &, uint) { return {}; }
              Q_SCRIPTABLE qulonglong Write(const QMap<QString, QByteArray> &) { return 8; }
          Q_SIGNALS:
              Q_SCRIPTABLE void OwnerChanged(qulonglong generation, const QStringList &mimes, const WriterIdentity &identity);
          };
          int main(int argc, char **argv) {
              QCoreApplication app(argc, argv);
              if (argc != 2) return 64;
              qDBusRegisterMetaType<WriterIdentity>();
              qRegisterMetaType<QMap<QString, QByteArray>>("QMap<QString,QByteArray>");
              ClipboardFixture fixture;
              QDBusServer server(QStringLiteral("unix:tmpdir=%1").arg(QDir::tempPath()));
              if (!server.isConnected()) return 1;
              std::optional<QDBusConnection> connection;
              QObject::connect(&server, &QDBusServer::newConnection, &app, [&fixture, &connection](const QDBusConnection &accepted) { connection.emplace(accepted); connection->registerObject(QStringLiteral("/app/copypaste/Clipboard"), &fixture, QDBusConnection::ExportScriptableSlots | QDBusConnection::ExportScriptableSignals); });
              QTimer::singleShot(0, &app, [&server, path = QString::fromLocal8Bit(argv[1])] { QFile file(path); if (file.open(QIODevice::WriteOnly | QIODevice::Text)) QTextStream(&file) << server.address() << Qt::endl; });
              return app.exec();
          }
          #include "server.moc"
          CPP
          cat > "$split/client.cpp" <<'CPP'
          #include <QCoreApplication>
          #include <QDBusArgument>
          #include <QDBusConnection>
          #include <QDBusMessage>
          #include <QDBusMetaType>
          #include <QDBusPendingCallWatcher>
          #include <QEventLoop>
          #include <QTimer>
          struct WriterIdentity { QString status; quint32 pid = 0; quint32 uid = 0; QString appId; };
          Q_DECLARE_METATYPE(WriterIdentity)
          QDBusArgument &operator<<(QDBusArgument &a, const WriterIdentity &i) { a.beginStructure(); a << i.status << i.pid << i.uid << i.appId; a.endStructure(); return a; }
          const QDBusArgument &operator>>(const QDBusArgument &a, WriterIdentity &i) { a.beginStructure(); a >> i.status >> i.pid >> i.uid >> i.appId; a.endStructure(); return a; }
          QDBusMessage request(const QString &method) { return QDBusMessage::createMethodCall(QString(), QStringLiteral("/app/copypaste/Clipboard"), QStringLiteral("app.copypaste.Clipboard"), method); }
          QDBusMessage wait(QDBusPendingCall call) { QDBusPendingCallWatcher watcher(call); QEventLoop loop; QObject::connect(&watcher, &QDBusPendingCallWatcher::finished, &loop, &QEventLoop::quit); QTimer::singleShot(1000, &loop, &QEventLoop::quit); loop.exec(); return watcher.reply(); }
          int main(int argc, char **argv) {
              QCoreApplication app(argc, argv);
              if (argc != 3) return 64;
              qDBusRegisterMetaType<WriterIdentity>();
              const QString name = QStringLiteral("copypaste-qt-wire-split-client");
              const bool peer = QByteArray(argv[1]) == "peer";
              const QString address = QString::fromLocal8Bit(argv[2]);
              const auto client = peer ? QDBusConnection::connectToPeer(address, name) : QDBusConnection::connectToBus(address, name);
              if (!client.isConnected()) return 2;
              const auto version = wait(client.asyncCall(request(QStringLiteral("Version")), 1000));
              if (version.type() == QDBusMessage::ErrorMessage || version.signature() != QLatin1String("u") || version.arguments().size() != 1 || version.arguments().constFirst().toUInt() != 2) return 4;
              const auto snapshot = wait(client.asyncCall(request(QStringLiteral("Snapshot")), 1000));
              if (snapshot.type() == QDBusMessage::ErrorMessage || snapshot.signature() != QLatin1String("tas(suus)") || snapshot.arguments().size() != 3 || snapshot.arguments().at(0).toULongLong() != 7 || snapshot.arguments().at(1).toStringList() != QStringList{QStringLiteral("text/plain")}) return 5;
              const auto identity = qdbus_cast<WriterIdentity>(snapshot.arguments().at(2));
              if (identity.status != QLatin1String("verified") || identity.pid != 101 || identity.uid != 1000 || identity.appId != QLatin1String("org.example.Writer")) return 6;
              const auto introspection = wait(client.asyncCall(QDBusMessage::createMethodCall(QString(), QStringLiteral("/app/copypaste/Clipboard"), QStringLiteral("org.freedesktop.DBus.Introspectable"), QStringLiteral("Introspect")), 1000));
              if (introspection.type() == QDBusMessage::ErrorMessage || introspection.arguments().size() != 1) return 8;
              const auto xml = introspection.arguments().constFirst().toString();
              for (const auto &member : {QStringLiteral("Version"), QStringLiteral("Snapshot"), QStringLiteral("Read"), QStringLiteral("Write"), QStringLiteral("OwnerChanged")}) if (!xml.contains(QStringLiteral("\"") + member + QStringLiteral("\""))) return 9;
              if (peer) QDBusConnection::disconnectFromPeer(name); else QDBusConnection::disconnectFromBus(name);
              return 0;
          }
          CPP
          sha256sum "$split/CMakeLists.txt" "$split/server.cpp" "$split/client.cpp" > "$evidence/split-control-sha256.txt"
          cmake -S "$split" -B "$split/build" -G Ninja -DCMAKE_BUILD_TYPE=Release >"$evidence/split-configure.log" 2>&1
          cmake --build "$split/build" --parallel 2 >"$evidence/split-build.log" 2>&1

          run_split() {
            local mode="$1"
            local address="$RUNNER_TEMP/qt-wire-$mode.address"
            rm -f "$address"
            phase "run-split-$mode-server"
            timeout --signal=TERM --kill-after=2s 20s strace -ff -tt -s 256 -o "$evidence/split-$mode-server.strace" "$split/build/copypaste-qt-wire-server" "$address" >"$evidence/split-$mode-server.log" 2>&1 &
            local server_pid=$!
            for _ in $(seq 1 50); do [[ -s "$address" ]] && break; sleep 0.1; done
            if [[ ! -s "$address" ]]; then
              printf '%s\n' 125 > "$evidence/split-$mode-client-exit-status.txt"
              printf 'RESULT split-%s exit=125 address-unavailable\n' "$mode" | tee -a "$evidence/phases.log"
            else
              phase "run-split-$mode-client"
              set +e
              timeout --signal=TERM --kill-after=2s 10s strace -ff -tt -s 256 -o "$evidence/split-$mode-client.strace" "$split/build/copypaste-qt-wire-client" "$mode" "$(<"$address")" >"$evidence/split-$mode-client.log" 2>&1
              local status=$?
              set -e
              printf '%s\n' "$status" > "$evidence/split-$mode-client-exit-status.txt"
              printf 'RESULT split-%s exit=%s\n' "$mode" "$status" | tee -a "$evidence/phases.log"
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          run_split bus
          run_split peer
          phase complete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-qt-wire-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/qt-wire-evidence
