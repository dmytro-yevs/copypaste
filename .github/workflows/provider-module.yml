name: Linux XDG GIO diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gio-private-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Record diagnostic source
        run: git rev-parse HEAD
      - name: Install GIO diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev desktop-file-utils
      - name: Run existing URI fixture and preserve its failure
        id: uri-fixture
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./scripts/test-linux-xdg-startup.sh -p /linux/xdg_startup/uri_private_xdg 2>&1 | tee "$RUNNER_TEMP/xdg-uri-fixture.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Dump serialized entry and inspect the GIO loader
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root=$(mktemp -d "$RUNNER_TEMP/copypaste-xdg-diagnostic.XXXXXX")
          trap 'rm -rf "$diagnostic_root"' EXIT
          cat > "$diagnostic_root/entry.cc" <<'CPP'
          #include "linux_xdg_startup.h"
          #include <gio/gdesktopappinfo.h>
          #include <gio/gio.h>
          #include <glib.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <string>

          int inspect(const std::string& root, const std::string& label) {
            const std::string executable = root + "/" + label;
            const int fd = open(executable.c_str(), O_WRONLY | O_CREAT | O_EXCL, 0700);
            if (fd < 0 || close(fd) != 0) return 65;
            const std::string entry = LinuxXdgStartup::DesktopEntryForExecutable(executable, false);
            const std::string path = root + "/" + label + ".desktop";
            g_autoptr(GError) error = nullptr;
            if (!g_file_set_contents(path.c_str(), entry.c_str(), entry.size(), &error)) {
              g_printerr("ENTRY_WRITE_ERROR %s %s\n", label.c_str(), error->message);
              return 66;
            }
            g_print("SERIALIZED_ENTRY_BEGIN %s\n%sSERIALIZED_ENTRY_END %s\n", label.c_str(), entry.c_str(), label.c_str());
            g_autoptr(GKeyFile) key_file = g_key_file_new();
            if (!g_key_file_load_from_data(key_file, entry.c_str(), entry.size(), G_KEY_FILE_NONE, &error)) {
              g_printerr("KEYFILE_ERROR %s %s\n", label.c_str(), error->message);
              return 67;
            }
            for (const char* key : {"Exec", "TryExec", "MimeType"}) {
              g_autofree gchar* value = g_key_file_get_string(key_file, "Desktop Entry", key, &error);
              if (value == nullptr) {
                g_printerr("KEY_VALUE_ERROR %s %s %s\n", label.c_str(), key, error->message);
                return 68;
              }
              g_print("KEY_%s_%s=%s\n", label.c_str(), key, value);
            }
            g_autoptr(GDesktopAppInfo) app = g_desktop_app_info_new_from_filename(path.c_str());
            g_print("DESKTOP_APP_INFO_%s=%s\n", label.c_str(), app == nullptr ? "null" : "loaded");
            if (app != nullptr) {
              g_print("SUPPORTS_URIS_%s=%s\n", label.c_str(), g_app_info_supports_uris(G_APP_INFO(app)) ? "true" : "false");
            }
            return app == nullptr ? 69 : 0;
          }
          int main(int argc, char** argv) {
            if (argc != 2) return 64;
            const std::string root(argv[1]);
            int result = 0;
            for (const char* label : {"plain-handler", "space handler", "percent%handler", "quote\"handler", "backslash\\handler", "space percent%handler"}) {
              result = inspect(root, label) == 0 ? result : 69;
            }
            return result;
          }
          CPP
          read -r -a gio_flags <<< "$(pkg-config --cflags --libs gio-unix-2.0 gio-2.0 glib-2.0)"
          c++ -std=c++17 -Wall -Wextra -Werror -Iapps/copypaste_flutter/linux/runner \
            "$diagnostic_root/entry.cc" apps/copypaste_flutter/linux/runner/linux_xdg_startup.cc \
            "${gio_flags[@]}" -o "$diagnostic_root/entry"
          set +e
          "$diagnostic_root/entry" "$diagnostic_root" 2>&1 | tee "$RUNNER_TEMP/xdg-entry-loader.log"
          loader_status=${PIPESTATUS[0]}
          set -e
          set +e
          validate_status=0
          for desktop in "$diagnostic_root"/*.desktop; do
            desktop-file-validate "$desktop" || validate_status=1
          done
          set -e
          echo "LOADER_STATUS=$loader_status"
          echo "DESKTOP_FILE_VALIDATE_STATUS=$validate_status"
          glib_version=$(pkg-config --modversion glib-2.0)
          echo "GLIB_VERSION=$glib_version"
          curl --fail --location --retry 2 \
            "https://gitlab.gnome.org/GNOME/glib/-/raw/$glib_version/gio/gdesktopappinfo.c" \
            --output "$RUNNER_TEMP/gdesktopappinfo.c"
          grep -n -E 'try_exec|g_shell_parse_argv|g_find_program_for_path' \
            "$RUNNER_TEMP/gdesktopappinfo.c" > "$RUNNER_TEMP/gdesktopappinfo-excerpts.log"
          sed -n '1,240p' "$RUNNER_TEMP/gdesktopappinfo-excerpts.log"
          test "$loader_status" -eq 0
          test "$validate_status" -eq 0
      - name: Fail after collecting the first URI fixture evidence
        if: steps.uri-fixture.outputs.status != '0'
        run: exit 1
