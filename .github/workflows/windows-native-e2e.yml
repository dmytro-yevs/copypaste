name: Windows native desktop E2E

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: windows-native-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_name) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  COPYPASTE_WINDOWS_SHELL_E2E: 1
  MSEDGEDRIVER_TELEMETRY_OPTOUT: 1
  OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: "1.96"

jobs:
  native-desktop:
    name: WebView2, native bridge and Windows shell settings (${{ matrix.shard }}/2)
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Define the native E2E run root
        shell: pwsh
        run: |
          # Node's os.tmpdir() and runner temp differ on hosted Windows runners.
          "COPYPASTE_E2E_RUN_ROOT=$env:RUNNER_TEMP\cp-e2e" >> $env:GITHUB_ENV

      - name: Capture Windows WebView2 host diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logDirectory = Join-Path $env:COPYPASTE_E2E_RUN_ROOT "logs"
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $log = Join-Path $logDirectory "windows-host.log"
          try {
            $edgeDriver = Get-Command msedgedriver.exe -ErrorAction SilentlyContinue
            @(
              "ImageOS=$env:ImageOS"
              "WindowsVersion=$([Environment]::OSVersion.Version)"
              "EdgeDriverCommand=$($edgeDriver.Source)"
              "EdgeDriverDirectory=$env:EDGEWEBDRIVER"
            ) | Set-Content -LiteralPath $log
          } catch {
            "Windows host diagnostic capture failed: $($_.Exception.Message)" | Set-Content -LiteralPath $log
          }

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-2022-1.96-native-e2e-${{ matrix.shard }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            crates/copypaste-ui/package-lock.json
            e2e/package-lock.json

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Build the native app and sidecars
        run: cargo build -p copypaste-ui -p copypaste-daemon -p copypaste-cli --locked

      - name: Install frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm audit

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      - name: Audit harness dependencies
        working-directory: e2e
        run: npm audit

      - name: Install the WebView2-matched Edge driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:COPYPASTE_E2E_RUN_ROOT "logs\webview2-driver-install.log"
          Start-Transcript -LiteralPath $log -Force | Out-Null
          try {
            $product = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
            $keys = @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$product"
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$product"
            )
            $versions = @($keys | ForEach-Object {
              (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
            } | Where-Object { $_ -and $_ -ne "0.0.0.0" } | Sort-Object -Unique)
            if ($versions.Count -ne 1) {
              throw "expected one installed WebView2 Runtime version, found $($versions.Count)"
            }
            $runtimeVersion = $versions[0]
            $driverDirectory = Join-Path $env:RUNNER_TEMP "webview2-edgedriver"
            $archive = Join-Path $env:RUNNER_TEMP "webview2-edgedriver.zip"
            $uri = "https://msedgedriver.microsoft.com/$runtimeVersion/edgedriver_win64.zip"
            Invoke-WebRequest -Uri $uri -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $driverDirectory -Force

            $driver = Join-Path $driverDirectory "msedgedriver.exe"
            Write-Host "Downloaded Edge WebDriver for WebView2 Runtime $runtimeVersion"
            "EDGEWEBDRIVER=$driverDirectory" >> $env:GITHUB_ENV
            "COPYPASTE_WEBVIEW2_RUNTIME_VERSION=$runtimeVersion" >> $env:GITHUB_ENV
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Run Windows native desktop E2E
        id: native-e2e
        working-directory: e2e
        run: npm run test:windows -- --shard=${{ matrix.shard }}/2

      - name: Upload native E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-e2e-diagnostics-${{ matrix.shard }}
          path: ${{ env.COPYPASTE_E2E_RUN_ROOT }}/logs/**
          if-no-files-found: error
          retention-days: 7
