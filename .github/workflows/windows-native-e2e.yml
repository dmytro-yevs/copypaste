name: Windows native desktop E2E

on:
  push:
    branches: [main, v2-main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-native-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  COPYPASTE_WINDOWS_SHELL_E2E: 1
  MSEDGEDRIVER_TELEMETRY_OPTOUT: 1
  OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: "1.96"

jobs:
  native-desktop:
    name: WebView2, native bridge and Windows shell settings
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Define the native E2E run root
        shell: pwsh
        run: |
          # Node's os.tmpdir() and runner temp differ on hosted Windows runners.
          "COPYPASTE_E2E_RUN_ROOT=$env:RUNNER_TEMP\cp-e2e" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-2022-1.96-native-e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            crates/copypaste-ui/package-lock.json
            e2e/package-lock.json

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Build the native app and sidecars
        run: cargo build -p copypaste-ui -p copypaste-daemon -p copypaste-cli --locked

      - name: Install frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm audit

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      - name: Audit harness dependencies
        working-directory: e2e
        run: npm audit

      - name: Install the WebView2-matched Edge driver
        shell: pwsh
        run: |
          $product = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$product"
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$product"
          )
          $versions = @($keys | ForEach-Object {
            (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ -and $_ -ne "0.0.0.0" } | Sort-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "expected one installed WebView2 Runtime version, found $($versions.Count)"
          }
          $runtimeVersion = $versions[0]
          if ($runtimeVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "the WebView2 Runtime reported an invalid version"
          }

          $driverDirectory = Join-Path $env:RUNNER_TEMP "webview2-edgedriver"
          $archive = Join-Path $env:RUNNER_TEMP "webview2-edgedriver.zip"
          $uri = "https://msedgedriver.microsoft.com/$runtimeVersion/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDirectory -Force

          $driver = Join-Path $driverDirectory "msedgedriver.exe"
          $reported = (& $driver --version | Out-String)
          $versionMatch = [regex]::Match($reported, 'Microsoft Edge WebDriver (\d+\.\d+\.\d+\.\d+)')
          if ($LASTEXITCODE -ne 0 -or -not $versionMatch.Success) {
            throw "the downloaded Edge WebDriver did not report a valid version"
          }
          $driverVersion = $versionMatch.Groups[1].Value
          $runtimeMajor = ([version]$runtimeVersion).Major
          $driverMajor = ([version]$driverVersion).Major
          if ($driverMajor -ne $runtimeMajor -or $driverVersion -ne $runtimeVersion) {
            throw "Edge WebDriver does not exactly match the WebView2 Runtime"
          }
          Write-Host "WebView2 Runtime and Edge WebDriver: $runtimeVersion"
          "EDGEWEBDRIVER=$driverDirectory" >> $env:GITHUB_ENV

      - name: Run Windows native desktop E2E
        id: native-e2e
        working-directory: e2e
        run: npm run test:windows

      # Global setup writes a run manifest before anything else can fail, so an
      # empty directory here means the harness lost its own diagnostics. That is
      # the defect this step exists to report, not a condition to ignore.
      - name: Upload native E2E logs on failure
        if: failure() && steps.native-e2e.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-e2e-logs
          path: ${{ env.COPYPASTE_E2E_RUN_ROOT }}/logs/**
          if-no-files-found: error
          retention-days: 7
