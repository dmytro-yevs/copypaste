name: CI configuration

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      retry_probe:
        description: Exercise artifact and job identity across a failed-job rerun
        type: boolean
        default: false

concurrency:
  group: ci-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: CI Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
          components: rustfmt
      - name: Install pinned CI policy tools
        run: |
          python3 -m pip install -r scripts/ci/requirements.txt
          bash scripts/ci/install-actionlint.sh "$RUNNER_TEMP/ci-tools"
      - name: Validate workflows and embedded shell
        run: '"$RUNNER_TEMP/ci-tools/actionlint" -color=false'
      - name: Reject high confidence security findings
        run: zizmor --offline --min-severity high --min-confidence high .github
      - name: Validate repository CI policy
        run: python3 scripts/ci/policy.py
      - name: Test policy, selection, metrics and release contracts
        run: |
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 -m unittest scripts/test_release_safety.py scripts/test_linux_qualification_bootstrap.py scripts/test_linux_compositor_runtime.py
          python3 -m unittest discover -s scripts/release/tests -p 'test_*.py'
      - run: python3 scripts/ci/run-gates.py --check
      - run: python3 scripts/ci/run-gates.py --gate rustfmt
      - run: python3 scripts/check-docs.py

  retry-probe:
    name: Retry contract probe
    if: inputs.retry_probe == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: printf 'immutable retry probe\n' > payload.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retry-contract-probe
          path: payload.txt
          if-no-files-found: error
      - name: Deliberately fail the first fixture attempt
        if: github.run_attempt == 1
        run: exit 1
