name: Linux release diagnostics
on:
  push:
    branches: [codex/release-1-0-31]
    paths: [.github/workflows/linux-release-diagnostics.yml]
permissions:
  actions: read
  contents: read
concurrency:
  group: linux-release-diagnostics
  cancel-in-progress: false
  queue: max
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install disposable desktop scenario dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-user-session gjs gnome-shell gnome-session gnome-keyring gnome-shell-extension-appindicator \
            libsecret-tools wl-clipboard wtype x11-utils xdotool wmctrl xdg-desktop-portal \
            xdg-desktop-portal-gnome xvfb rpm cpio xclip python3-gi build-essential pkg-config libgtk-3-dev libxres-dev \
            at-spi2-core python3-pyatspi ffmpeg qrencode v4l-utils
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: copypaste-compositor-runtime-gnome-46-ubuntu24.04-x86_64
          path: compositor-runtime
          run-id: 39419483475
          github-token: ${{ github.token }}
          expected-commit: c16dcb5d23e56283c5f17377f1e7335cfc6498ad
      - name: Bind the exact compositor sidecar runtime
        env:
          CI_INPUT_COMPOSITOR_RUNTIME_RUN_ID: 39419483475
        run: |
          set -euo pipefail
          python3 scripts/release/compositor-runtime-archive.py extract \
            --archive compositor-runtime/runtime.tar --output compositor-runtime/runtime
          python3 scripts/release/verify-linux-compositor-runtime.py artifact \
            --root compositor-runtime --desktop "GNOME" --architecture "x86_64" \
            --commit "c16dcb5d23e56283c5f17377f1e7335cfc6498ad" --producer-run-id "${CI_INPUT_COMPOSITOR_RUNTIME_RUN_ID}" \
            --output compositor-runtime/binding.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: production-linux-x86_64
          path: current
          run-id: 39419483475
          github-token: ${{ github.token }}
          expected-commit: c16dcb5d23e56283c5f17377f1e7335cfc6498ad
      - name: Diagnose immutable package without producing qualification evidence
        run: |
          set -euo pipefail
          appimage="$PWD/current/CopyPaste-v1.0.31-linux-x86_64.AppImage"
          chmod u+x "$appimage"
          mkdir companion
          (cd companion && APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null)
          cat > "$RUNNER_TEMP/diagnose-quick-paste.py" <<'PY'
          import contextlib
          import json
          import os
          import runpy
          import sys
          from pathlib import Path
          
          driver_path = Path('scripts/release/linux-native-fixture-driver.py')
          driver_source = driver_path.read_text().replace('marker = "copypaste-x11-quick-paste-fixture"', 'marker = f"copypaste-x11-quick-paste-fixture-{time.monotonic_ns()}"')
          namespace = {'__file__': str(driver_path), '__name__': 'diagnostic'}
          exec(compile(driver_source, str(driver_path), 'exec'), namespace)
          g = namespace['require_x11_quick_paste'].__globals__
          original_run = g['run']
          original_target = g['x11_input_target']
          
          def run(argv, **kwargs):
              if argv == ['xdotool', 'mousemove', '--sync', '16', '16']:
                  original_run(['xdotool', 'mousemove', '32', '32'], **kwargs)
              print('DIAGNOSTIC COMMAND', [str(v) for v in argv], flush=True)
              result = original_run(argv, **kwargs)
              print('DIAGNOSTIC COMMAND DONE', result.returncode, flush=True)
              return result
          
          g['run'] = run
          
          @contextlib.contextmanager
          def target(workspace, environment):
              with original_target(workspace, environment) as value:
                  try:
                      yield value
                  except BaseException:
                      window, result = value
                      print('DIAGNOSTIC target', window, 'result', repr(result.read_text() if result.is_file() else None), flush=True)
                      for argv in (['xdotool', 'getwindowfocus'], ['xprop', '-root', '_NET_ACTIVE_WINDOW'], ['xclip', '-selection', 'clipboard', '-o']):
                          probe = original_run(argv, env=environment)
                          print('DIAGNOSTIC observation', argv, repr(probe.stdout.decode('utf-8', 'replace')), flush=True)
                      for process in Path('/proc').iterdir():
                          if not process.name.isdigit():
                              continue
                          try:
                              args = (process / 'cmdline').read_bytes().split(b'\0')
                          except OSError:
                              continue
                          if b'--copypaste-quick-paste' in args:
                              print('DIAGNOSTIC popup', process.name, [v.decode() for v in args if v.startswith(b'--copypaste-x11-')], flush=True)
                      raise
          
          g['x11_input_target'] = target
          workspace = Path(os.environ['RUNNER_TEMP']) / 'quick-paste-diagnostic'
          workspace.mkdir(mode=0o700)
          runtime = workspace / 'runtime'
          runtime.mkdir(mode=0o700)
          environment = {**os.environ, 'COPYPASTE_QUALIFICATION': '1', 'COPYPASTE_QUALIFICATION_CAPABILITY': os.urandom(32).hex(), 'XDG_DATA_HOME': str(workspace / 'data-home'), 'TMPDIR': str(runtime)}
          prefix = Path('companion/squashfs-root/usr/lib/copypaste').resolve()
          entrypoint = namespace['runtime_gui_entrypoint'](prefix, 'AppImage')
          app, socket = namespace['start_gui_runtime'](entrypoint, environment, runtime, set())
          try:
              cli_environment = {**environment, 'COPYPASTE_SOCKET': str(socket)}
              cli = prefix / 'copypaste-cli'
              namespace['wait_for_startup_status'](cli, cli_environment, require_native_clipboard=True)
              original_run([str(cli), '--json', 'config', 'set', '--notify-on-copy', 'true', '--notification-preview', 'false'], env=cli_environment)
              for iteration in range(40):
                  print('DIAGNOSTIC ITERATION', iteration, flush=True)
                  namespace['require_x11_quick_paste'](cli, cli_environment, workspace)
          finally:
              app.terminate()
              app.wait(timeout=10)
          PY
          scripts/release/run-linux-native-desktop-session.sh \
            --desktop GNOME --session x11 \
            --companion-source "$PWD/companion/squashfs-root/usr/share/copypaste/desktop-integrations" \
            --compositor-runtime compositor-runtime --compositor-runtime-binding compositor-runtime/binding.json \
            -- python3 "$RUNNER_TEMP/diagnose-quick-paste.py"
