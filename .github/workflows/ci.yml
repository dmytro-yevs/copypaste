name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  rust-and-supabase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ./scripts/ci/install-postgresql-server.sh
      - run: python3 -m unittest scripts/test_release_safety.py
      - run: python3 -m unittest discover -s scripts/modules/tests -p 'test_*.py'
      - run: cargo +1.96 test --workspace --locked
      - name: SMS module recognition contracts
        run: |
          cargo +1.96 test --manifest-path modules/sms-codes/Cargo.toml --locked
          cargo +1.96 clippy --manifest-path modules/sms-codes/Cargo.toml --locked --all-targets -- -D warnings
      - name: Supabase module contracts
        run: |
          cargo +1.96 test --manifest-path modules/supabase/Cargo.toml --locked
          cargo +1.96 clippy --manifest-path modules/supabase/Cargo.toml --locked --all-targets -- -D warnings
      - run: ./supabase/dev/verify-schema.sh

  macos-core:
    name: macOS Rust capabilities
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Create isolated keychain
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/copypaste-ci.keychain-db"
          state="$RUNNER_TEMP/copypaste-ci-keychain-state"
          password="$(openssl rand -base64 24)"
          mkdir -p "$state"
          security default-keychain -d user > "$state/default"
          security list-keychains -d user > "$state/search-list"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security add-generic-password -s copypaste-ci-probe -a probe -w "hunter2" "$keychain"
          [[ "$(security find-generic-password -s copypaste-ci-probe -a probe -w "$keychain")" == "hunter2" ]]
          security delete-generic-password -s copypaste-ci-probe -a probe "$keychain"
          echo "COPYPASTE_KEYCHAIN_TEST=1" >> "$GITHUB_ENV"
          echo "COPYPASTE_KEYCHAIN_TEST_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Keychain and pasteboard Rust tests
        run: |
          set -euo pipefail
          out="$(cargo +1.96 test -p copypaste-core --locked --release --target aarch64-apple-darwin -- --ignored --nocapture --test-threads=1 2>&1)" || { status=$?; printf '%s\n' "$out"; exit "$status"; }
          printf '%s\n' "$out"
          grep -qE 'test result: ok\. [1-9][0-9]* passed' <<<"$out"
          if grep -q 'SKIPPED' <<<"$out"; then exit 1; fi
          if security find-generic-password -s com.copypaste.daemon -a device-secret-key -w "$RUNNER_TEMP/copypaste-ci.keychain-db" >/dev/null 2>&1; then exit 1; fi
          out="$(cargo +1.96 test -p copypaste-daemon --locked --target aarch64-apple-darwin -- --ignored --nocapture --test-threads=1 2>&1)" || { status=$?; printf '%s\n' "$out"; exit "$status"; }
          printf '%s\n' "$out"
          grep -qE 'test result: ok\. [1-9][0-9]* passed' <<<"$out"
          if grep -q 'SKIPPED' <<<"$out"; then exit 1; fi
      - name: Restore keychain state
        if: always()
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/copypaste-ci-keychain-state"
          keychain="$RUNNER_TEMP/copypaste-ci.keychain-db"
          restore=0
          if [[ -f "$state/default" && -f "$state/search-list" ]]; then
            if ! python3 - "$state/default" "$state/search-list" <<'PY'
          from pathlib import Path
          import shlex
          import subprocess
          import sys
          default = shlex.split(Path(sys.argv[1]).read_text(encoding="utf-8"), posix=True)
          search = shlex.split(Path(sys.argv[2]).read_text(encoding="utf-8"), posix=True)
          if len(default) != 1 or not search:
              raise RuntimeError("saved keychain state is invalid")
          subprocess.run(["security", "default-keychain", "-d", "user", "-s", default[0]], check=True)
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *search], check=True)
          PY
            then restore=1; fi
          else
            restore=1
          fi
          security delete-keychain "$keychain" || restore=1
          exit "$restore"

  windows-core:
    name: Windows Rust capabilities
    runs-on: windows-2022
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - shell: bash
        run: |
          set -euo pipefail
          checked() {
            out="$("$@" 2>&1)" || { status=$?; printf '%s\n' "$out"; exit "$status"; }
            printf '%s\n' "$out"
            grep -qE 'test result: ok\. [1-9][0-9]* passed' <<<"$out"
            ! grep -q 'SKIPPED' <<<"$out"
          }
          checked cargo +1.96 test -p copypaste-daemon --locked clipboard::windows:: -- --include-ignored --test-threads=1 --nocapture
          checked cargo +1.96 test -p copypaste-source-app --locked -- --include-ignored --test-threads=1 --nocapture
          checked cargo +1.96 test -p copypaste-core --locked crypto::keystore:: -- --nocapture

  optional-modules:
    name: Optional modules (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, platform: macos, runner: macos-14 }
          - { name: windows, platform: windows, runner: windows-2022 }
          - { name: Linux x86_64, platform: linux, runner: ubuntu-24.04 }
          - { name: Linux aarch64, platform: linux, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            modules/ocr
      - name: Module lifecycle and OCR contracts
        env:
          OPENSSL_SRC_PERL: ${{ matrix.platform == 'windows' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
        run: |
          cargo test -p copypaste-modules --locked
          cargo test --manifest-path modules/ocr/Cargo.toml --locked
          cargo clippy --manifest-path modules/ocr/Cargo.toml --locked --all-targets -- -D warnings
          rustc +1.96 --test modules/ocr/vendor/paddle-ocr-rs/src/dictionary.rs -o "$RUNNER_TEMP/ocr-dictionary-tests.exe"
          "$RUNNER_TEMP/ocr-dictionary-tests.exe"

  flutter-foundation:
    name: Flutter foundation (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, platform: macos, runner: macos-14, target: macos }
          - { name: android, platform: android, runner: ubuntu-24.04, target: apk }
          - { name: windows, platform: windows, runner: windows-2022, target: windows }
          - { name: Linux x86_64, platform: linux, runner: ubuntu-24.04, target: linux }
          - { name: Linux aarch64, platform: linux, runner: ubuntu-24.04-arm, target: linux }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: flutter
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .flutter-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: ${{ matrix.platform }}
          profile: debug
      - name: Install Linux Flutter build dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-dev libsecret-1-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libkeybinder-3.0-dev libxtst-dev libxi-dev ninja-build pkg-config
      - run: ./scripts/ci/verify-flutter-foundation.sh
        env:
          COPYPASTE_FLUTTER_BUILD_TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"

  linux-native-fixtures:
    name: Linux native fixtures (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: x86_64, runner: ubuntu-24.04 }
          - { architecture: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install native fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core build-essential dbus-x11 gobject-introspection libgirepository1.0-dev \
            libgtk-3-dev libmutter-14-dev libsecret-1-dev libssl-dev \
            libx11-dev libxi-dev libxtst-dev nodejs pkg-config ripgrep sway \
            x11-utils xvfb wl-clipboard
      - name: Run X11, GNOME bridge, portal, PackageKit, restart, companion, and Wayland fixtures
        run: ./scripts/ci/test-linux-native-fixtures.sh

  linux-pr-release-candidate:
    name: Linux release candidate (${{ matrix.architecture }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            appimagetool_sha256: 95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
            appimagetool_sha256: a595ea34cd6136c7f595e9dcbb16f3e9725d7610efb9e43b38c3c6e86cafc270
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: linux
          profile: release
      - name: Install Linux release build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cpio desktop-file-utils gobject-introspection libgirepository1.0-dev \
            libgtk-3-dev libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libkeybinder-3.0-dev libmutter-14-dev libsecret-1-dev libssl-dev \
            libxi-dev libxtst-dev ninja-build pkg-config rpm
      - name: Fetch the pinned AppImageTool
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-${{ matrix.architecture }}.AppImage"
          curl --fail --location --output "$tool" "${{ matrix.appimagetool_url }}"
          printf '%s  %s\n' "${{ matrix.appimagetool_sha256 }}" "$tool" | sha256sum --check --status
          chmod 755 "$tool"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --version
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build the unsigned native Flutter bundle and every package format
        run: |
          set -euo pipefail
          version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' apps/copypaste_flutter/pubspec.yaml)"
          build_number="${version#*+}"
          version="${version%%+*}"
          chmod +x scripts/release/build-linux-flutter.sh scripts/release/build-linux-packages.sh
          scripts/release/build-linux-flutter.sh "$version" "$build_number" "${{ matrix.architecture }}"
          python3 scripts/release/verify-linux-runtime-baseline.py \
            --bundle "dist/linux-${{ matrix.architecture }}/bundle" \
            --architecture "${{ matrix.architecture }}" \
            --maximum 2.39 \
            --output "dist/CopyPaste-v$version-linux-${{ matrix.architecture }}.runtime-baseline.json"
          scripts/release/build-linux-packages.sh "$version" "${{ matrix.architecture }}"
          for extension in AppImage deb rpm; do
            test -s "dist/CopyPaste-v$version-linux-${{ matrix.architecture }}.$extension"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-pr-release-candidate-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            dist/CopyPaste-v*-linux-${{ matrix.architecture }}.AppImage
            dist/CopyPaste-v*-linux-${{ matrix.architecture }}.deb
            dist/CopyPaste-v*-linux-${{ matrix.architecture }}.rpm
            dist/CopyPaste-v*-linux-${{ matrix.architecture }}.runtime-baseline.json

  linux-package-fixtures:
    name: Linux package fixtures (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: x86_64, runner: ubuntu-24.04 }
          - { architecture: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and extract every Linux package format
        env:
          COPYPASTE_LINUX_PACKAGE_TEST_ARCHITECTURES: ${{ matrix.architecture }}
        run: scripts/release/test-linux-packages.sh
