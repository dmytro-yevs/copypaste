name: Mutation gate

on:
  schedule:
    - cron: "11 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/mutation-gate/run.py --self-test
      - run: python3 scripts/mutation-gate/run.py --platforms-covered linux
      - run: python3 scripts/mutation-gate/run.py --platform linux --require-all
