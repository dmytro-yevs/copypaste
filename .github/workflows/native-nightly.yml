name: Nightly native matrix

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      windows_evidence:
        description: "Run the Windows native contract evidence gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/check-feature-ledger.py

  # The `github` context inside a called workflow reflects the CALLER's event,
  # not the call itself — so android-emulator.yml's own `emulator` job matrix
  # already sees `github.event_name == 'schedule'` here and expands to the full
  # [24,29,33,34,36] sweep on its own, ignoring whatever `api-level` a matrixed
  # call passes it. Calling it twice (api-level 34 and 36) ran that five-API
  # sweep twice a night. Call it once; the sweep is already complete.
  android-nightly:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/android-emulator.yml
    with:
      target: google_apis

  # A manual dispatch of this workflow is not `schedule`, so the callee trusts
  # `api-level` instead of sweeping — spot-check two levels here.
  android-dispatch:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    uses: ./.github/workflows/android-emulator.yml
    with:
      api-level: ${{ matrix.api-level }}
      target: google_apis

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          # tools/sensitive-rules' regeneration tests spawn `rustfmt`, so the
          # component belongs to `test --workspace` and not only to the fmt
          # gate. Run 31671766432 failed here on macos-14 and macos-15 at once.
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: cargo +1.96 test --workspace --locked
      - run: npm ci
        working-directory: crates/copypaste-ui
      - run: npm run build
        working-directory: crates/copypaste-ui

  windows:
    name: Windows installed-release evidence (requested)
    if: github.event_name == 'workflow_dispatch' && inputs.windows_evidence
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-2022-1.96-native-nightly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - name: Install native evidence Python dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-ci.txt
      - name: Exercise Windows package failure fixtures
        shell: pwsh
        run: |
          ./scripts/release/test-package-windows.ps1
          ./scripts/release/windows-native-evidence.ps1 -SelfTest
          ./scripts/release/build-windows.ps1 -SelfTest
          ./scripts/release/windows-sign.ps1 -Operation SelfTest
      - name: Build unsigned Windows release package
        shell: pwsh
        run: ./scripts/release/build-windows.ps1 -Unsigned -OutputDirectory artifacts/windows-nightly-package
      - name: Capture installed-release evidence
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem artifacts/windows-nightly-package/*-setup.exe)
          if ($installer.Count -ne 1) { throw "expected one NSIS installer, found $($installer.Count)" }
          ./scripts/release/windows-native-evidence.ps1 `
            -Installer $installer[0].FullName `
            -PackageDirectory artifacts/windows-nightly-package `
            -EvidenceDirectory artifacts/native-windows `
            -ExpectedSignature NotSigned `
            -Commit '${{ github.sha }}' `
            -RunId '${{ github.run_id }}'
      - run: npm ci
        working-directory: crates/copypaste-ui
      - name: Validate requested Windows evidence
        working-directory: crates/copypaste-ui
        run: >-
          npm run check:native-parity --
          --require windows
          --commit ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --evidence ${{ github.workspace }}/artifacts/native-windows/native-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-native-evidence
          path: artifacts/native-windows
          if-no-files-found: error
          retention-days: 14
