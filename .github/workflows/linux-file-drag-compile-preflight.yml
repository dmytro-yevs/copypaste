name: Linux file-drag compile preflight

on:
  push:
    branches:
      - codex/linux-file-drag-compile-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.architecture }} GTK source compile
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compile the GTK source on Ubuntu 24.04
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-3-dev xdotool xvfb
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            scripts/release/linux-gtk-file-drop-source.c \
            -o /tmp/copypaste-gtk-file-drop-source \
            $(pkg-config --cflags --libs gtk+-3.0)
      - name: Prove source-to-sink X11 URI-list transport
        run: |
          set -euo pipefail
          source_file="scripts/release/linux-gtk-file-drop-source.c"
          sink_file="$(mktemp --suffix=.c)"
          cat >"$sink_file" <<'EOF'
          #include <gtk/gtk.h>

          struct State { const char* ready; const char* result; };

          static void receive(GtkWidget* widget, GdkDragContext* context, gint x, gint y,
                              GtkSelectionData* selection, guint info, guint time, gpointer data) {
            (void)widget; (void)x; (void)y; (void)info;
            struct State* state = data;
            gchar** uris = gtk_selection_data_get_uris(selection);
            gboolean accepted = uris != NULL && uris[0] != NULL && g_str_has_prefix(uris[0], "file://");
            if (accepted) g_file_set_contents(state->result, "received\n", -1, NULL);
            g_strfreev(uris);
            gtk_drag_finish(context, accepted, FALSE, time);
          }

          static void activate(GtkApplication* app, gpointer data) {
            struct State* state = data;
            GtkWidget* window = gtk_application_window_new(app);
            gtk_window_set_title(GTK_WINDOW(window), "CopyPaste Qualification File Drop Sink");
            gtk_window_set_default_size(GTK_WINDOW(window), 320, 160);
            GtkTargetEntry target = {(gchar*)"text/uri-list", 0, 0};
            gtk_drag_dest_set(window, GTK_DEST_DEFAULT_ALL, &target, 1, GDK_ACTION_COPY);
            g_signal_connect(window, "drag-data-received", G_CALLBACK(receive), state);
            gtk_widget_show_all(window);
            g_file_set_contents(state->ready, "ready\n", -1, NULL);
          }

          int main(int argc, char** argv) {
            if (argc != 5 || g_strcmp0(argv[1], "--ready-file") != 0 || g_strcmp0(argv[3], "--result-file") != 0) return 2;
            struct State state = {argv[2], argv[4]};
            GtkApplication* app = gtk_application_new("org.copypaste.QualificationFileDropSink", G_APPLICATION_NON_UNIQUE);
            g_signal_connect(app, "activate", G_CALLBACK(activate), &state);
            int result = g_application_run(G_APPLICATION(app), 1, argv);
            g_object_unref(app);
            return result;
          }
          EOF
          cc -std=c11 -O2 -Wall -Wextra -Werror "$source_file" -o /tmp/copypaste-gtk-file-drop-source $(pkg-config --cflags --libs gtk+-3.0)
          cc -std=c11 -O2 -Wall -Wextra -Werror "$sink_file" -o /tmp/copypaste-gtk-file-drop-sink $(pkg-config --cflags --libs gtk+-3.0)
          work="$(mktemp -d)"
          source_pid=""
          sink_pid=""
          Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          cleanup() {
            kill "$source_pid" "$sink_pid" "$xvfb_pid" 2>/dev/null || true
            wait "$source_pid" "$sink_pid" "$xvfb_pid" 2>/dev/null || true
            rm -rf "$work" "$sink_file"
          }
          trap cleanup EXIT
          /tmp/copypaste-gtk-file-drop-sink --ready-file "$work/sink-ready" --result-file "$work/result" >/dev/null 2>&1 &
          sink_pid=$!
          touch "$work/fixture"
          printf 'file://%s\r\n' "$work/fixture" >"$work/uris"
          /tmp/copypaste-gtk-file-drop-source --ready-file "$work/source-ready" --start-file "$work/start" --activity-log "$work/activity" --uri-list-file "$work/uris" >/dev/null 2>&1 &
          source_pid=$!
          for _ in $(seq 1 100); do
            [[ -f "$work/sink-ready" && -f "$work/source-ready" ]] && break
            sleep 0.05
          done
          [[ -f "$work/sink-ready" && -f "$work/source-ready" ]]
          source_window="$(xdotool search --name '^CopyPaste Qualification File Drop Source$')"
          sink_window="$(xdotool search --name '^CopyPaste Qualification File Drop Sink$')"
          xdotool windowmove "$source_window" 100 150
          xdotool windowmove "$sink_window" 760 150
          window_center() {
            xdotool getwindowgeometry --shell "$1" | awk -F= '
              /^X=/{x=$2} /^Y=/{y=$2} /^WIDTH=/{width=$2} /^HEIGHT=/{height=$2}
              END {print x + width / 2, y + height / 2}
            '
          }
          read -r source_x source_y <<<"$(window_center "$source_window")"
          read -r sink_x sink_y <<<"$(window_center "$sink_window")"
          xdotool windowfocus "$source_window"
          xdotool mousemove --sync "$source_x" "$source_y"
          xdotool mousedown 1
          : >"$work/start"
          for _ in $(seq 1 100); do
            grep -Fqx '{"event":"drag_started"}' "$work/activity" 2>/dev/null && break
            sleep 0.05
          done
          grep -Fqx '{"event":"drag_started"}' "$work/activity"
          xdotool mousemove --sync "$sink_x" "$sink_y"
          xdotool mouseup 1
          for _ in $(seq 1 100); do
            [[ "$(cat "$work/result" 2>/dev/null || true)" == "received" ]] && break
            sleep 0.05
          done
          cat "$work/activity"
          [[ "$(cat "$work/result")" == "received" ]]
      - name: Compile the GTK source in pinned Fedora 40
        run: |
          set -euo pipefail
          docker build --platform "${{ matrix.platform }}" \
            --file packaging/linux/Dockerfile.fedora-native-qualification \
            --tag "copypaste-file-drag-preflight:${{ matrix.architecture }}" .
          docker run --rm --platform "${{ matrix.platform }}" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "copypaste-file-drag-preflight:${{ matrix.architecture }}" \
            bash -ceu '
              cc -std=c11 -O2 -Wall -Wextra -Werror \
                /workspace/scripts/release/linux-gtk-file-drop-source.c \
                -o /tmp/copypaste-gtk-file-drop-source \
                $(pkg-config --cflags --libs gtk+-3.0)
            '
