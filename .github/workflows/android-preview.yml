name: Android preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.96"
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-36"
  BUILD_TOOLS_VERSION: "36.0.0"
  CARGO_TERM_COLOR: always

jobs:
  preview:
    name: Build installable ARM64 preview
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-preview-arm64
          save-if: "true"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the pinned SDK components
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is unset — the runner image has no Android SDK}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || { echo "::error::$sdkmanager not found"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          [[ -d "$ndk" ]] || { echo "::error::sdkmanager did not install ndk;${NDK_VERSION}"; exit 1; }
          [[ -x "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2" ]] \
            || { echo "::error::aapt2 is missing from build-tools;${BUILD_TOOLS_VERSION}"; exit 1; }
          for tool in perl make; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is required for the Android preview build"; exit 1; }
          done
          echo "NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Point the Android build at the NDK's llvm-ar and llvm-ranlib
        run: ./scripts/release/android-ndk-env.sh "$NDK_HOME" | tee -a "$GITHUB_ENV"

      - name: Build an installable preview APK
        run: |
          set -euo pipefail
          cd crates/copypaste-ui
          npm ci
          npm run tauri -- android build --debug --apk --target aarch64

      - name: Verify the ARM64 preview
        run: |
          set -euo pipefail
          outputs="crates/copypaste-ui/src-tauri/gen/android/app/build/outputs/apk"
          apk="$(find "$outputs" -name '*debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "::error::no debug APK under $outputs"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libcopypaste_ui_lib.so' \
            || { echo "::error::the preview APK carries no ARM64 native library"; exit 1; }
          mkdir -p dist
          cp "$apk" dist/copypaste-preview-arm64-debug.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copypaste-preview-arm64-debug
          path: dist/copypaste-preview-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
