name: Linux GNOME bridge diagnostic

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gnome-read-recovery:
    name: GNOME and KWin D-Bus read recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install D-Bus fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential dbus-x11 libsecret-1-dev libssl-dev libx11-dev pkg-config
      - name: Run the compositor clipboard D-Bus fixture
        run: ./scripts/test-linux-clipboard-gnome.sh
