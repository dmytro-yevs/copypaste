name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_name) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan secrets
        run: ./scripts/check-secret-scan.sh --scan ${{ github.event_name == 'schedule' && '--history' || '' }}
      - name: Review changed dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - name: Check Rust dependency policy
        run: cargo deny --manifest-path Cargo.toml --config deny.toml --all-features --locked check advisories bans licenses sources --show-stats
      - name: Advisory DB cache key
        id: stamp
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"
      - name: Cache advisory database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ steps.stamp.outputs.week }}
          restore-keys: advisory-db-
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-audit
          checksum: true
          fallback: none
      - name: Audit Rust dependencies
        run: python3 scripts/check_rustsec_policy.py
