name: Advanced CodeQL

# Default setup disables advanced-workflow uploads. This workflow is staged
# without a push or PR trigger; enable its scheduled/manual analysis only after
# the coordinator switches repository CodeQL from default to advanced setup.
on:
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby, rust]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # No custom query suite or threat model is supplied: this retains
      # CodeQL's default suite and its default remote-source threat model.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
