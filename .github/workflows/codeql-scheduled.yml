name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  actions: read

jobs:
  analyze-no-build:
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby, rust]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - name: Prepare macOS project
        working-directory: apps/copypaste_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release --config-only --no-pub
      # Dart AOT, the Rust bridge and the runtime daemon contain no Swift.
      # Build them before tracing starts; the traced build below shares the
      # products directory, so Flutter and Cargo reuse these outputs while
      # its fresh derived data recompiles every Swift target under tracing.
      - name: Build Dart and Rust outputs before CodeQL tracing
        run: scripts/ci/xcodebuild-macos-release.sh "$RUNNER_TEMP/macos-prebuild" "$RUNNER_TEMP/macos-products"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
      - name: Build Swift sources for CodeQL
        run: scripts/ci/xcodebuild-macos-release.sh "$RUNNER_TEMP/codeql-macos" "$RUNNER_TEMP/macos-products"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift

  analyze-cpp:
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - id: flutter
        shell: bash
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
      - shell: pwsh
        run: |
          Set-Location apps/copypaste_flutter
          flutter pub get --enforce-lockfile
          flutter build windows --release --no-pub
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp

  analyze-java-kotlin:
    name: Android Java/Kotlin
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: android
          profile: debug
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android Java and Kotlin sources for CodeQL
        working-directory: apps/copypaste_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --config-only --no-pub
          cd android
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache --rerun-tasks :app:assembleDebug
        env:
          CARGO_BUILD_JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
