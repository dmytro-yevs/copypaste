name: Browser (WebKitGTK, Linux)

# The browser layer of docs/rewrite/testing-policy.md. It drives the built app
# through tauri-driver -> WebKitWebDriver against a real daemon, and it is the
# only job that executes the frontend in a browser engine at all; `npm test` in
# the frontend job is jsdom, which has no layout and therefore cannot see a
# virtualiser, a scroll clamp or a collapsed row.
#
# The engine is WebKitGTK on Linux. It is neither WKWebView nor the Android
# WebView, so nothing here is evidence about a shipping platform, a Tauri
# command as shipped, or any native surface. The policy names the layer that
# owns each of those.
#
# It runs under Xvfb with no GPU and no software-rendering flags. WebKitGTK
# 2.52 executes JavaScript and computes layout in that configuration; the EGL
# DRI3 warnings on stderr are cosmetic. Do not add LIBGL_ALWAYS_SOFTWARE or the
# WEBKIT_DISABLE_* variables — they were tried, and they are not what makes
# this work.

on:
  push:
    branches: [main, v2-main]
  # No branch filter: this layer owns shared React behaviour, and a pull
  # request onto a stacked or release branch changes the same code.
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  MSRV: "1.96"
  # `dtolnay/rust-toolchain` below sets 1.96 with `rustup default`, which
  # rust-toolchain.toml (channel = "stable") outranks — so without this the
  # bare `cargo` calls in this job silently build on stable and the declared
  # pin means nothing.
  RUSTUP_TOOLCHAIN: "1.96"

jobs:
  browser:
    name: shared frontend in WebKitGTK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: System dependencies
        # webkit2gtk-driver supplies /usr/bin/WebKitWebDriver, which
        # tauri-driver proxies to. It is a separate package from the webkit
        # runtime and is not installed by default on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libwebkit2gtk-4.1-dev webkit2gtk-driver \
            libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: linux-1.96
          key: e2e-profile

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            crates/copypaste-ui/package-lock.json
            e2e/package-lock.json

      - name: Build the app, the daemon and the CLI
        # Debug rather than release: a Tauri debug build loads `devUrl`, and the
        # harness starts the Vite dev server that serves it. A release build
        # would need `npm run build` and the bundled frontendDist instead.
        run: cargo build -p copypaste-ui -p copypaste-daemon -p copypaste-cli --locked

      - name: Install frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm ci

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      - name: Run the suite
        working-directory: e2e
        run: npm test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-webkitgtk-logs
          path: /tmp/cp-e2e/**
          if-no-files-found: ignore
          retention-days: 7
