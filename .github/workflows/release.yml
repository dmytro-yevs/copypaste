name: Production release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already-tagged, qualified stable release
        required: true
        type: boolean
        default: false
      qualified_run_id:
        description: Complete publication from a successful qualified run at the stable tag
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      publish: ${{ steps.version.outputs.publish }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      artifact_run_id: ${{ steps.version.outputs.artifact_run_id }}
      reuse_qualified: ${{ steps.version.outputs.reuse_qualified }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: version
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{inside=1; next} inside && /^version[[:space:]]*=/{gsub(/["[:space:]]/, "", $3); print $3; exit}' Cargo.toml)"
          pubspec_version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' apps/copypaste_flutter/pubspec.yaml)"
          version="${pubspec_version%%+*}"
          build_number="${pubspec_version#*+}"
          android_version_code="$(awk -F'= *' '/android-release-version-code/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Cargo.toml)"
          [[ "$version" == "$cargo_version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$android_version_code" =~ ^[1-9][0-9]*$ ]]
          (( android_version_code > 200000038 && android_version_code <= 2100000000 ))
          publish=false
          release_commit="$GITHUB_SHA"
          artifact_run_id="$GITHUB_RUN_ID"
          reuse_qualified=false
          if [[ -n "${QUALIFIED_RUN_ID:-}" ]]; then
            [[ "$QUALIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "${REQUESTED_PUBLISH:-false}" == true ]]
            git fetch origin "refs/tags/v$version:refs/tags/v$version"
            release_commit="$(git rev-list -n 1 "v$version")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID" > "$RUNNER_TEMP/source-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
            python3 scripts/release/verify-qualified-run.py --run "$RUNNER_TEMP/source-run.json" --jobs "$RUNNER_TEMP/source-jobs.json" --artifacts "$RUNNER_TEMP/source-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$release_commit"
            artifact_run_id="$QUALIFIED_RUN_ID"
            reuse_qualified=true
            publish=true
          elif [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            publish=true
          elif [[ "${REQUESTED_PUBLISH:-false}" == true ]]; then
            git fetch origin "refs/tags/v$version:refs/tags/v$version"
            [[ "$(git rev-list -n 1 "v$version")" == "$GITHUB_SHA" ]]
            publish=true
          fi
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "android_version_code=$android_version_code"
            echo "publish=$publish"
            echo "release_commit=$release_commit"
            echo "artifact_run_id=$artifact_run_id"
            echo "reuse_qualified=$reuse_qualified"
          } >> "$GITHUB_OUTPUT"

  macos:
    needs: preflight
    if: needs.preflight.outputs.reuse_qualified != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
      - name: Create disposable release keychain
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/copypaste-release-keychain-state"
          keychain="$RUNNER_TEMP/copypaste-release.keychain-db"
          password="$(openssl rand -base64 24)"
          mkdir -p "$state"
          security default-keychain -d user > "$state/default"
          security list-keychains -d user > "$state/search-list"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          echo "COPYPASTE_KEYCHAIN_TEST=1" >> "$GITHUB_ENV"
          echo "COPYPASTE_KEYCHAIN_TEST_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Build production macOS artifacts
        run: |
          chmod +x packaging/macos/selfsign.sh scripts/release/*.sh
          scripts/release/build-macos-flutter.sh "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.build_number }}"
          scripts/release/build-cli-tarball.sh "${{ needs.preflight.outputs.version }}" arm64 --reuse-build
      - name: Install and run exact macOS artifact
        run: scripts/release/smoke-macos-production.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-macos-arm64.dmg" "${{ needs.preflight.outputs.version }}"
      - name: Write exact-artifact receipt
        run: python3 scripts/release/write-artifact-receipt.py --platform macos --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-macos-arm64.dmg" --version "${{ needs.preflight.outputs.version }}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output dist/production-receipt.json
      - name: Restore keychain state
        if: always()
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/copypaste-release-keychain-state"
          keychain="$RUNNER_TEMP/copypaste-release.keychain-db"
          python3 - "$state/default" "$state/search-list" <<'PY'
          from pathlib import Path
          import shlex
          import subprocess
          import sys
          default = shlex.split(Path(sys.argv[1]).read_text(encoding="utf-8"), posix=True)
          search = shlex.split(Path(sys.argv[2]).read_text(encoding="utf-8"), posix=True)
          if len(default) != 1 or not search:
              raise SystemExit("saved Keychain state is invalid")
          subprocess.run(["security", "default-keychain", "-d", "user", "-s", default[0]], check=True)
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *search], check=True)
          PY
          security delete-keychain "$keychain"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/production-receipt.json

  android:
    needs: preflight
    if: needs.preflight.outputs.reuse_qualified != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build signed production Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?missing Android keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing Android keystore password}"
          : "${ANDROID_KEY_ALIAS:?missing Android key alias}"
          : "${ANDROID_KEY_PASSWORD:?missing Android key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/copypaste-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          expected="$(awk -F'"' '/android-release-certificate-sha256/{print $2; exit}' Cargo.toml)"
          actual="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | openssl dgst -sha256 | awk '{print $NF}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Android release keystore certificate mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cd apps/copypaste_flutter
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-name "${{ needs.preflight.outputs.version }}" --build-number "${{ needs.preflight.outputs.android_version_code }}"
          "$tools/apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD build/app/outputs/flutter-apk/app-release.apk
          cd ../..
          mkdir -p dist
          cp apps/copypaste_flutter/build/app/outputs/flutter-apk/app-release.apk "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk"
          chmod +x scripts/release/*.sh
          AAPT2="$tools/aapt2" APKSIGNER="$tools/apksigner" scripts/release/verify-android-release.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk" "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.android_version_code }}" "$expected"
          scripts/release/sign-update-artifact.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk"
          (cd apps/copypaste_flutter && dart run tool/verify_update_signature.dart "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk" "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk.sig")
      - name: Write exact-artifact receipt
        run: python3 scripts/release/write-artifact-receipt.py --platform android --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk" --version "${{ needs.preflight.outputs.version }}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output dist/production-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-android
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.apk.sig
            dist/*.apk.sha256
            dist/production-receipt.json

  windows:
    needs: preflight
    if: needs.preflight.outputs.reuse_qualified != 'true'
    runs-on: windows-2022
    env:
      OPENSSL_NO_VENDOR: "1"
      OPENSSL_STATIC: "1"
      OPENSSL_INCLUDE_DIR: 'C:\Program Files\OpenSSL\include'
      OPENSSL_LIB_DIR: 'C:\Program Files\OpenSSL\lib\VC\x64\MT'
      OPENSSL_LIBS: 'libssl_static:libcrypto_static'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
      - id: flutter
        shell: bash
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Verify Windows OpenSSL SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:OPENSSL_INCLUDE_DIR\openssl\ssl.h") -or
              -not (Test-Path "$env:OPENSSL_LIB_DIR\libssl_static.lib") -or
              -not (Test-Path "$env:OPENSSL_LIB_DIR\libcrypto_static.lib")) {
            throw "Windows OpenSSL SDK is incomplete"
          }
      - name: Prepare Windows signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/release/windows-sign.ps1 -Operation Prepare -OutputPfxPath "$env:RUNNER_TEMP\copypaste-release.pfx" -PersistEnvironment
      - name: Build signed Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/build-windows-flutter.ps1 -Version '${{ needs.preflight.outputs.version }}' -BuildNumber ${{ needs.preflight.outputs.build_number }}
      - name: Sign updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/release/sign-update-artifact.sh
          scripts/release/sign-update-artifact.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe"
          (cd apps/copypaste_flutter && dart run tool/verify_update_signature.dart "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe.sig")
      - name: Install and run exact Windows artifact
        shell: pwsh
        run: ./scripts/release/smoke-windows-production.ps1 -Installer "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" -Version '${{ needs.preflight.outputs.version }}'
      - name: Write exact-artifact receipt
        shell: pwsh
        run: python scripts/release/write-artifact-receipt.py --platform windows --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" --version '${{ needs.preflight.outputs.version }}' --commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --output dist/production-receipt.json
      - name: Clean signing key
        if: always()
        shell: pwsh
        run: ./scripts/release/windows-sign.ps1 -Operation Cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.sig
            dist/*.exe.sha256
            dist/production-receipt.json

  qualify:
    needs: [preflight, macos, android, windows]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.preflight.outputs.reuse_qualified == 'true' || (needs.macos.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download previously qualified artifacts
        if: needs.preflight.outputs.reuse_qualified == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-qualified
          path: qualified
          run-id: ${{ needs.preflight.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-macos
          path: qualified/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-android
          path: qualified/android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-windows
          path: qualified/windows
      - name: Verify exact qualified artifacts
        run: python3 scripts/release/verify-artifact-receipts.py --root qualified --version "${{ needs.preflight.outputs.version }}" --commit "${{ needs.preflight.outputs.release_commit }}" --run-id "${{ needs.preflight.outputs.artifact_run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-qualified
          if-no-files-found: error
          path: qualified

  publish:
    needs: [preflight, qualify]
    if: ${{ always() && needs.preflight.result == 'success' && needs.qualify.result == 'success' && needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-qualified
          path: qualified
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find qualified -type f ! -name production-receipt.json -exec cp {} dist/ \;
          git show "$RELEASE_COMMIT:packaging/release-notes.md" > packaging/release-notes.md
          git show "$RELEASE_COMMIT:packaging/release-template.md" > packaging/release-template.md
          python3 scripts/release/render-release-notes.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --artifacts dist --output "$RUNNER_TEMP/release-notes.md"
          python3 scripts/release/publish-release.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --artifacts dist --notes "$RUNNER_TEMP/release-notes.md"
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          : "${TAP_TOKEN:?missing Homebrew tap token}"
          dmg="dist/CopyPaste-v${VERSION}-macos-arm64.dmg"
          tarball="dist/copypaste-cli-v${VERSION}-macos-arm64.tar.gz"
          chmod +x scripts/release/gen-cask.sh scripts/release/gen-formula.sh
          scripts/release/gen-cask.sh "$VERSION" "$(sha256sum "$dmg" | cut -d' ' -f1)" --out tap
          scripts/release/gen-formula.sh "$VERSION" "$(sha256sum "$tarball" | cut -d' ' -f1)" --out tap
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dmytro-yevs/homebrew-copypaste.git" homebrew-tap
          mkdir -p homebrew-tap/Casks homebrew-tap/Formula
          cp tap/Casks/copypaste.rb homebrew-tap/Casks/copypaste.rb
          cp tap/Formula/copypaste-cli.rb homebrew-tap/Formula/copypaste-cli.rb
          cd homebrew-tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Casks/copypaste.rb Formula/copypaste-cli.rb
          if ! git diff --cached --quiet; then
            git commit -m "Release CopyPaste $VERSION"
            git push origin HEAD:main
          fi
