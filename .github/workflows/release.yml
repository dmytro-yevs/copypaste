              exit 1
            fi
            tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
            keystore="${RUNNER_TEMP}/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            "${tools}/zipalign" -p -f 4 "$unsigned" "${out}.aligned"
            "${tools}/apksigner" sign \
              --ks "$keystore" \
