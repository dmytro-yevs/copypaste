name: Production release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already-tagged, qualified stable release
        required: true
        type: boolean
        default: false
      qualified_run_id:
        description: Optional exact-tag publication recovery source; qualified runs are discovered automatically
        required: false
        type: string
        default: ""
      linux_evidence_run_id:
        description: Run containing exact-artifact Linux native qualification evidence
        required: false
        type: string
        default: ""
      linux_artifact_run_id:
        description: Prior release run with exact signed Linux artifacts for this tag
        required: false
        type: string
        default: ""
      compositor_runtime_run_id:
        description: Completed exact-source compositor runtime producer run for an explicit staging release
        required: false
        type: string
        default: ""
      linux_qualification_only:
        description: Run only the exact Linux native qualification against completed staging inputs
        required: false
        type: boolean
        default: false
      supabase_module_run_id:
        description: Completed exact-source unpublished Supabase module run
        required: false
        type: string
        default: ""
      semantic_search_module_run_id:
        description: Completed exact-source unpublished Semantic Search module run
        required: false
        type: string
        default: ""
      ocr_module_run_id:
        description: Completed exact-source unpublished OCR module run
        required: false
        type: string
        default: ""
      previous_linux_artifact_run_id:
        description: Completed earlier Linux staging run used by prior-release qualification evidence
        required: false
        type: string
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: production-release-${{ github.sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      previous_linux_artifact_run_id: ${{ steps.sources.outputs.previous_linux_artifact_run_id }}
      linux_evidence_run_id: ${{ inputs.linux_evidence_run_id || github.run_id }}
      supabase_module_run_id: ${{ inputs.supabase_module_run_id || github.run_id }}
      semantic_search_module_run_id: ${{ inputs.semantic_search_module_run_id || github.run_id }}
      ocr_module_run_id: ${{ inputs.ocr_module_run_id || github.run_id }}
      compositor_runtime_run_id: ${{ inputs.compositor_runtime_run_id || github.run_id }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      publish: ${{ steps.version.outputs.publish }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      artifact_run_id: ${{ steps.version.outputs.artifact_run_id }}
      reuse_qualified: ${{ steps.version.outputs.reuse_qualified }}
      linux_required: ${{ steps.version.outputs.linux_required }}
      linux_artifact_run_id: ${{ steps.version.outputs.linux_artifact_run_id }}
      compositor_runtime_required: ${{ steps.version.outputs.compositor_runtime_required }}
      linux_qualification_only: ${{ steps.version.outputs.linux_qualification_only }}
      linux_build_matrix: ${{ steps.platform.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Discover already-qualified exact-source artifacts
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          EXPLICIT_QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
        run: python3 scripts/release/qualified_source.py
      - id: version
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          QUALIFIED_RUN_ID: ${{ steps.existing.outputs.qualified_run_id }}
          LINUX_ARTIFACT_RUN_ID: ${{ inputs.linux_artifact_run_id }}
          COMPOSITOR_RUNTIME_RUN_ID: ${{ inputs.compositor_runtime_run_id }}
          LINUX_QUALIFICATION_ONLY: ${{ inputs.linux_qualification_only }}
          SUPABASE_MODULE_RUN_ID: ${{ inputs.supabase_module_run_id }}
          SEMANTIC_SEARCH_MODULE_RUN_ID: ${{ inputs.semantic_search_module_run_id }}
          OCR_MODULE_RUN_ID: ${{ inputs.ocr_module_run_id }}
          LINUX_EVIDENCE_RUN_ID: ${{ inputs.linux_evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{inside=1; next} inside && /^version[[:space:]]*=/{gsub(/["[:space:]]/, "", $3); print $3; exit}' Cargo.toml)"
          pubspec_version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' apps/copypaste_flutter/pubspec.yaml)"
          version="${pubspec_version%%+*}"
          build_number="${pubspec_version#*+}"
          android_version_code="$(awk -F'= *' '/android-release-version-code/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Cargo.toml)"
          [[ "$version" == "$cargo_version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$android_version_code" =~ ^[1-9][0-9]*$ ]]
          (( android_version_code > 200000038 && android_version_code <= 2100000000 ))
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then [[ "$GITHUB_REF_NAME" == "v$version" ]]; fi
          publish=false
          release_commit="$GITHUB_SHA"
          artifact_run_id="$GITHUB_RUN_ID"
          reuse_qualified=false
          linux_artifact_run_id="$GITHUB_RUN_ID"
          compositor_runtime_required=false
          linux_qualification_only=false
          if [[ "${LINUX_QUALIFICATION_ONLY:-false}" == true ]]; then
            [[ "${REQUESTED_PUBLISH:-false}" == false ]]
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "${QUALIFIED_RUN_ID:-}" && -z "${LINUX_EVIDENCE_RUN_ID:-}" ]]
            for value in "$LINUX_ARTIFACT_RUN_ID" "$COMPOSITOR_RUNTIME_RUN_ID" "$SUPABASE_MODULE_RUN_ID" "$SEMANTIC_SEARCH_MODULE_RUN_ID" "$OCR_MODULE_RUN_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
            linux_qualification_only=true
          fi
          if [[ -n "${QUALIFIED_RUN_ID:-}" ]]; then
            [[ "$QUALIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "${REQUESTED_PUBLISH:-false}" == true || "${GITHUB_REF_TYPE:-}" == tag ]]
            git fetch --no-tags origin "refs/tags/v$version"
            release_commit="$(git rev-list -n 1 FETCH_HEAD)"
            linux_required=false
            compositor_runtime_required=false
            if git cat-file -e "$release_commit:packaging/linux/release-contract.json" 2>/dev/null; then
              linux_required=true
            fi
            if git cat-file -e "$release_commit:.github/workflows/compositor-runtime.yml" 2>/dev/null; then
              compositor_runtime_required=true
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID" > "$RUNNER_TEMP/source-run.json"
            python3 scripts/release/github_inventory.py --run-id "$QUALIFIED_RUN_ID" --kind jobs > "$RUNNER_TEMP/source-jobs.json"
            python3 scripts/release/github_inventory.py --run-id "$QUALIFIED_RUN_ID" --kind artifacts > "$RUNNER_TEMP/source-artifacts.json"
            # Authenticate the source envelope before extracting any archive.
            # Linux origin bytes are checked after reading its bound receipt.
            python3 scripts/release/verify-qualified-run.py --run "$RUNNER_TEMP/source-run.json" --jobs "$RUNNER_TEMP/source-jobs.json" --artifacts "$RUNNER_TEMP/source-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$release_commit" --require-sms
            linux_required=false
            if git cat-file -e "$release_commit:packaging/linux/release-contract.json" 2>/dev/null; then
              linux_required=true
              qualified_artifact_id="$(jq -r '[.artifacts[] | select(.name == "production-qualified" and .expired == false)] | if length == 1 then .[0].id else empty end' "$RUNNER_TEMP/source-artifacts.json")"
              [[ "$qualified_artifact_id" =~ ^[1-9][0-9]*$ ]]
              python3 scripts/release/download_artifact.py --run-id "$QUALIFIED_RUN_ID" --artifact-id "$qualified_artifact_id" --commit "$release_commit" --path "$RUNNER_TEMP/qualified-source"
              cp "$RUNNER_TEMP/qualified-source/linux/production-receipt.json" "$RUNNER_TEMP/linux-origin-receipt.json"
              linux_artifact_run_id="$(jq -r '.run_id' "$RUNNER_TEMP/linux-origin-receipt.json")"
              [[ "$linux_artifact_run_id" =~ ^[1-9][0-9]*$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$linux_artifact_run_id" > "$RUNNER_TEMP/linux-origin-run.json"
              python3 scripts/release/github_inventory.py --run-id "$linux_artifact_run_id" --kind jobs > "$RUNNER_TEMP/linux-origin-jobs.json"
              python3 scripts/release/github_inventory.py --run-id "$linux_artifact_run_id" --kind artifacts > "$RUNNER_TEMP/linux-origin-artifacts.json"
            fi
            qualified_args=(--run "$RUNNER_TEMP/source-run.json" --jobs "$RUNNER_TEMP/source-jobs.json" --artifacts "$RUNNER_TEMP/source-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$release_commit" --require-sms)
            if [[ "$linux_required" == true ]]; then qualified_args+=(--require-linux); fi
            if [[ "$compositor_runtime_required" == true ]]; then qualified_args+=(--require-compositor-runtime); fi
            if [[ "$linux_required" == true ]]; then qualified_args+=(--linux-origin-run "$RUNNER_TEMP/linux-origin-run.json" --linux-origin-jobs "$RUNNER_TEMP/linux-origin-jobs.json" --linux-origin-artifacts "$RUNNER_TEMP/linux-origin-artifacts.json" --linux-receipt "$RUNNER_TEMP/linux-origin-receipt.json"); fi
            python3 scripts/release/verify-qualified-run.py "${qualified_args[@]}"
            artifact_run_id="$QUALIFIED_RUN_ID"
            reuse_qualified=true
            publish=true
          elif [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            publish=true
          elif [[ "${REQUESTED_PUBLISH:-false}" == true ]]; then
            git fetch --no-tags origin "refs/tags/v$version"
            [[ "$(git rev-list -n 1 FETCH_HEAD)" == "$GITHUB_SHA" ]]
            publish=true
          fi
          if [[ -z "${linux_required+x}" ]]; then
            linux_required=false
            if git cat-file -e "$release_commit:packaging/linux/release-contract.json" 2>/dev/null; then
              linux_required=true
            fi
          fi
          if git cat-file -e "$release_commit:.github/workflows/compositor-runtime.yml" 2>/dev/null; then
            compositor_runtime_required=true
            [[ "$linux_required" == true ]] || {
              echo "ERROR: compositor runtime contract requires Linux release artifacts" >&2
              exit 1
            }
          fi
          if [[ -n "${COMPOSITOR_RUNTIME_RUN_ID:-}" ]]; then
            [[ "$COMPOSITOR_RUNTIME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$compositor_runtime_required" == true ]] || {
              echo "ERROR: compositor_runtime_run_id is only valid for a compositor runtime release contract" >&2
              exit 1
            }
            [[ "$reuse_qualified" != true ]] || {
              echo "ERROR: a previously qualified release already binds its compositor runtime companions" >&2
              exit 1
            }
          fi
          if [[ -n "${LINUX_ARTIFACT_RUN_ID:-}" ]]; then
            [[ "$LINUX_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$linux_required" == true ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINUX_ARTIFACT_RUN_ID" > "$RUNNER_TEMP/linux-source-run.json"
            python3 scripts/release/github_inventory.py --run-id "$LINUX_ARTIFACT_RUN_ID" --kind jobs > "$RUNNER_TEMP/linux-source-jobs.json"
            python3 scripts/release/github_inventory.py --run-id "$LINUX_ARTIFACT_RUN_ID" --kind artifacts > "$RUNNER_TEMP/linux-source-artifacts.json"
            python3 scripts/release/verify-linux-artifact-source-run.py --run "$RUNNER_TEMP/linux-source-run.json" --jobs "$RUNNER_TEMP/linux-source-jobs.json" --artifacts "$RUNNER_TEMP/linux-source-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$release_commit"
            linux_artifact_run_id="$LINUX_ARTIFACT_RUN_ID"
          fi
          if [[ "$linux_qualification_only" == true ]]; then
            [[ "$publish" == false && "$GITHUB_REF_TYPE" != tag ]] || {
              echo "ERROR: qualification-only staging must be an unpublished branch dispatch" >&2
              exit 1
            }
          fi
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "android_version_code=$android_version_code"
            echo "publish=$publish"
            echo "release_commit=$release_commit"
            echo "artifact_run_id=$artifact_run_id"
            echo "reuse_qualified=$reuse_qualified"
            echo "linux_required=$linux_required"
            echo "linux_artifact_run_id=$linux_artifact_run_id"
            echo "compositor_runtime_required=$compositor_runtime_required"
            echo "linux_qualification_only=$linux_qualification_only"
          } >> "$GITHUB_OUTPUT"
      - name: Validate external dependencies and signing configuration
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          LINUX_REQUIRED: ${{ steps.version.outputs.linux_required }}
          LINUX_ARTIFACT_RUN_ID: ${{ inputs.linux_artifact_run_id }}
          PREVIOUS_LINUX_ARTIFACT_RUN_ID: ${{ inputs.previous_linux_artifact_run_id || (github.ref_type == 'tag' && vars.PREVIOUS_LINUX_ARTIFACT_RUN_ID) || '' }}
          COMPOSITOR_RUNTIME_RUN_ID: ${{ inputs.compositor_runtime_run_id }}
          BUILD: ${{ steps.version.outputs.reuse_qualified != 'true' && steps.version.outputs.linux_qualification_only != 'true' }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          SUPABASE_MODULE_RUN_ID: ${{ inputs.supabase_module_run_id }}
          SEMANTIC_SEARCH_MODULE_RUN_ID: ${{ inputs.semantic_search_module_run_id }}
          OCR_MODULE_RUN_ID: ${{ inputs.ocr_module_run_id }}
          LINUX_EVIDENCE_RUN_ID: ${{ inputs.linux_evidence_run_id }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/release/preflight-sources.py
      - id: platform
        run: echo "matrix=$(python3 scripts/release/platform_manifest.py matrix --tier stable --purpose build)" >> "$GITHUB_OUTPUT"

  policy:
    name: Release CI policy
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-policy

  linux-native-bootstrap:
    name: Run exact staged Linux native qualification
    needs: [preflight, policy]
    if: needs.preflight.outputs.linux_qualification_only == 'true'
    uses: ./.github/workflows/linux-native-qualification.yml
    with:
      artifact_run_id: ${{ inputs.linux_artifact_run_id }}
      previous_artifact_run_id: ${{ inputs.previous_linux_artifact_run_id }}
      supabase_module_run_id: ${{ inputs.supabase_module_run_id }}
      semantic_search_module_run_id: ${{ inputs.semantic_search_module_run_id }}
      ocr_module_run_id: ${{ inputs.ocr_module_run_id }}
      compositor_runtime_run_id: ${{ inputs.compositor_runtime_run_id }}

  qualification-supabase:
    name: Build Linux supabase module
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.linux_required == 'true' && inputs.linux_evidence_run_id == '' && inputs.supabase_module_run_id == ''
    uses: ./.github/workflows/provider-module.yml
    # Reusable publisher permission ceiling; publish=false leaves that job skipped.
    # Producer jobs retain the reusable workflow's read-only permissions.
    permissions:
      contents: write
      actions: write
    with:
      module: supabase
      linux_only: false
      publish: false
      publish_marketplace: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  qualification-semantic-search:
    name: Build Linux semantic-search module
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.linux_required == 'true' && inputs.linux_evidence_run_id == '' && inputs.semantic_search_module_run_id == ''
    uses: ./.github/workflows/provider-module.yml
    # Reusable publisher permission ceiling; publish=false leaves that job skipped.
    # Producer jobs retain the reusable workflow's read-only permissions.
    permissions:
      contents: write
      actions: write
    with:
      module: semantic-search
      linux_only: false
      publish: false
      publish_marketplace: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  qualification-ocr:
    name: Build Linux ocr module
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.linux_required == 'true' && inputs.linux_evidence_run_id == '' && inputs.ocr_module_run_id == ''
    uses: ./.github/workflows/ocr-module.yml
    # Reusable publisher permission ceiling; publish=false leaves that job skipped.
    # Producer jobs retain the reusable workflow's read-only permissions.
    permissions:
      contents: write
      actions: write
    with:
      linux_only: false
      publish: false
      publish_marketplace: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  qualification-sms-codes:
    name: Build SMS Codes module
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true'
    uses: ./.github/workflows/sms-codes-module.yml
    permissions:
      contents: write
      actions: read
    with:
      publish: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  linux-native-current:
    name: Qualify current Linux artifacts
    needs: [preflight, policy, linux, compositor-runtime-public, qualification-supabase, qualification-semantic-search, qualification-ocr]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.policy.result == 'success' && needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.linux_required == 'true' && inputs.linux_evidence_run_id == '' && (needs.linux.result == 'success' || inputs.linux_artifact_run_id != '') && needs.compositor-runtime-public.result == 'success' && (needs.qualification-supabase.result == 'success' || inputs.supabase_module_run_id != '') && (needs.qualification-semantic-search.result == 'success' || inputs.semantic_search_module_run_id != '') && (needs.qualification-ocr.result == 'success' || inputs.ocr_module_run_id != '') }}
    uses: ./.github/workflows/linux-native-qualification.yml
    with:
      artifact_run_id: ${{ needs.preflight.outputs.linux_artifact_run_id }}
      previous_artifact_run_id: ${{ needs.preflight.outputs.previous_linux_artifact_run_id }}
      supabase_module_run_id: ${{ needs.preflight.outputs.supabase_module_run_id }}
      semantic_search_module_run_id: ${{ needs.preflight.outputs.semantic_search_module_run_id }}
      ocr_module_run_id: ${{ needs.preflight.outputs.ocr_module_run_id }}
      compositor_runtime_run_id: ${{ needs.preflight.outputs.compositor_runtime_run_id }}
      public_runtime_run_id: ${{ github.run_id }}

  macos:
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: macos
          profile: release
      - name: Create disposable release keychain
        run: bash scripts/ci/macos-test-keychain.sh create
      - name: Preserve Keychain identity across application updates
        run: python3 -m unittest scripts.release.tests.test_macos_keychain_helper -v
      - name: Build production macOS artifacts
        run: |
          chmod +x packaging/macos/selfsign.sh scripts/release/*.sh
          scripts/release/build-macos-flutter.sh "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.build_number }}"
          python3 scripts/ci/timed.py packaging scripts/release/build-cli-tarball.sh "${{ needs.preflight.outputs.version }}" arm64 --reuse-build
      - name: Install and run exact macOS artifact
        run: scripts/release/smoke-macos-production.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-macos-arm64.dmg" "${{ needs.preflight.outputs.version }}"
      - name: Write exact-artifact receipt
        run: python3 scripts/release/write-artifact-receipt.py --platform macos --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-macos-arm64.dmg" --artifact "dist/copypaste-cli-v${{ needs.preflight.outputs.version }}-macos-arm64.tar.gz" --version "${{ needs.preflight.outputs.version }}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output dist/production-receipt.json
      - name: Restore keychain state
        if: always()
        run: bash scripts/ci/macos-test-keychain.sh restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: production-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/production-receipt.json

  macos-regression:
    name: macos-regression
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: macos
          profile: debug
      - name: Create disposable test keychain
        run: bash scripts/ci/macos-test-keychain.sh create
      - name: Run independent Xcode launch regression
        working-directory: apps/copypaste_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --config-only --debug --no-pub
          xcodebuild test -project macos/Runner.xcodeproj -scheme Runner -configuration Debug -destination 'platform=macOS,arch=arm64' -only-testing:RunnerTests/AppDelegateLaunchTests -resultBundlePath "$RUNNER_TEMP/launch-pairing.xcresult"
      - name: Restore test keychain
        if: always()
        run: bash scripts/ci/macos-test-keychain.sh restore

  android:
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: android
          profile: release
      - name: Build signed universal and ARM Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?missing Android keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing Android keystore password}"
          : "${ANDROID_KEY_ALIAS:?missing Android key alias}"
          : "${ANDROID_KEY_PASSWORD:?missing Android key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/copypaste-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          expected="$(awk -F'"' '/android-release-certificate-sha256/{print $2; exit}' Cargo.toml)"
          actual="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | openssl dgst -sha256 | awk '{print $NF}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Android release keystore certificate mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cd apps/copypaste_flutter
          flutter pub get --enforce-lockfile
          python3 ../../scripts/ci/timed.py compilation flutter build apk --release --split-per-abi --no-pub --target-platform android-arm,android-arm64,android-x64 --build-name "${{ needs.preflight.outputs.version }}" --build-number "${{ needs.preflight.outputs.android_version_code }}"
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android-armv7.apk"
          cd ../..
          chmod +x scripts/release/*.sh
          for architecture in universal arm64 armv7; do
            suffix="-$architecture"
            [[ "$architecture" != universal ]] || suffix=""
            artifact="dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android$suffix.apk"
            "$tools/apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD "$artifact"
            AAPT2="$tools/aapt2" APKSIGNER="$tools/apksigner" scripts/release/verify-android-release.sh "$artifact" "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.android_version_code }}" "$expected" "$architecture"
            scripts/release/sign-update-artifact.sh "$artifact"
            # Run the pure Dart verifier without rebuilding native assets.
            (cd apps/copypaste_flutter && dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/verify_update_signature.dart "../../$artifact" "../../$artifact.sig")
          done
      - name: Write exact-artifact receipt
        run: |
          python3 scripts/release/write-artifact-receipt.py --platform android \
            --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk" \
            --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android-arm64.apk" \
            --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android-armv7.apk" \
            --version "${{ needs.preflight.outputs.version }}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output dist/production-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: production-android
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.apk.sig
            dist/*.apk.sha256
            dist/production-receipt.json

  windows:
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      OPENSSL_NO_VENDOR: "1"
      OPENSSL_STATIC: "1"
      OPENSSL_INCLUDE_DIR: 'C:\Program Files\OpenSSL\include'
      OPENSSL_LIB_DIR: 'C:\Program Files\OpenSSL\lib\VC\x64\MT'
      OPENSSL_LIBS: 'libssl_static:libcrypto_static'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        shell: bash
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: windows
          profile: release
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Verify Windows OpenSSL SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:OPENSSL_INCLUDE_DIR\openssl\ssl.h") -or
              -not (Test-Path "$env:OPENSSL_LIB_DIR\libssl_static.lib") -or
              -not (Test-Path "$env:OPENSSL_LIB_DIR\libcrypto_static.lib")) {
            throw "Windows OpenSSL SDK is incomplete"
          }
      - name: Prepare Windows signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/release/windows-sign.ps1 -Operation Prepare -OutputPfxPath "$env:RUNNER_TEMP\copypaste-release.pfx" -PersistEnvironment
      - name: Build signed Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/build-windows-flutter.ps1 -Version '${{ needs.preflight.outputs.version }}' -BuildNumber ${{ needs.preflight.outputs.build_number }}
      - name: Sign updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/release/sign-update-artifact.sh
          scripts/release/sign-update-artifact.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe"
          # Use the VM directly; signature verification has no native assets.
          (cd apps/copypaste_flutter && dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/verify_update_signature.dart "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" "../../dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe.sig")
      - name: Install and run exact Windows artifact
        shell: pwsh
        run: ./scripts/release/smoke-windows-production.ps1 -Installer "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" -Version '${{ needs.preflight.outputs.version }}'
      - name: Write exact-artifact receipt
        shell: pwsh
        run: python scripts/release/write-artifact-receipt.py --platform windows --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe" --version '${{ needs.preflight.outputs.version }}' --commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --output dist/production-receipt.json
      - name: Clean signing key
        if: always()
        shell: pwsh
        run: ./scripts/release/windows-sign.ps1 -Operation Cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: production-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.sig
            dist/*.exe.sha256
            dist/production-receipt.json

  linux:
    name: Linux build (${{ matrix.architecture }})
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.linux_required == 'true' && needs.preflight.outputs.linux_artifact_run_id == github.run_id
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.linux_build_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - uses: ./.github/actions/flutter-build-cache
        with:
          platform: linux
          profile: release
      - name: Install Linux release packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cpio desktop-file-utils libgtk-3-dev libsecret-1-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libkeybinder-3.0-dev libxtst-dev libxi-dev \
            gobject-introspection libgirepository1.0-dev libmutter-14-dev ninja-build pkg-config rpm patchelf \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Fetch pinned upstream AppImageTool
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-${{ matrix.architecture }}.AppImage"
          curl --fail --location --output "$tool" "${{ matrix.appimagetool_url }}"
          printf '%s  %s\n' "${{ matrix.appimagetool_sha256 }}" "$tool" | sha256sum --check --status
          chmod 755 "$tool"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --version
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build Linux packages
        run: |
          set -euo pipefail
          chmod +x scripts/release/build-linux-flutter.sh scripts/release/build-linux-packages.sh
          scripts/release/build-linux-flutter.sh "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.build_number }}" "${{ matrix.architecture }}"
          python3 scripts/release/verify-linux-runtime-baseline.py --bundle "dist/linux-${{ matrix.architecture }}/bundle" --architecture "${{ matrix.architecture }}" --maximum 2.39 --output "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.runtime-baseline.json"
          python3 scripts/ci/timed.py packaging scripts/release/build-linux-packages.sh "${{ needs.preflight.outputs.version }}" "${{ matrix.architecture }}" --release-scope
      - name: Install and verify the exact RPM preview on Fedora
        run: scripts/release/test-linux-rpm.sh "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm" "${{ needs.preflight.outputs.version }}" "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm.installation.json"
      - name: Sign Linux updater artifacts and write SHA-256 receipts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/release/sign-update-artifact.sh
          for extension in AppImage deb rpm; do
            artifact="dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.$extension"
            scripts/release/sign-update-artifact.sh "$artifact"
            (cd apps/copypaste_flutter && dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/verify_update_signature.dart "../../$artifact" "../../$artifact.sig")
            (cd dist && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")
          done
      - name: Write exact Linux artifact receipt
        run: |
          set -euo pipefail
          args=(--platform linux --version "${{ needs.preflight.outputs.version }}" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output "dist/production-receipt.json" --artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.runtime-baseline.json")
          for extension in AppImage deb rpm; do
            artifact="dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.$extension"
            args+=(--artifact "$artifact" --artifact "$artifact.sig" --artifact "$artifact.sha256")
          done
          args+=(--artifact "dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm.installation.json")
          python3 scripts/release/write-artifact-receipt.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 90
          name: production-linux-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.AppImage
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.AppImage.sig
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.AppImage.sha256
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.deb
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.deb.sig
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.deb.sha256
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm.sig
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm.sha256
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.rpm.installation.json
            dist/CopyPaste-v${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.runtime-baseline.json
            dist/production-receipt.json

  compositor-runtime-build:
    name: Build opt-in compositor runtime companions
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.compositor_runtime_required == 'true' && inputs.compositor_runtime_run_id == ''
    uses: ./.github/workflows/compositor-runtime.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      source_run_id: ${{ github.run_id }}
      commit: ${{ needs.preflight.outputs.release_commit }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  compositor-runtime-external:
    name: Verify staged compositor runtime companions
    needs: [preflight, policy]
    if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.compositor_runtime_required == 'true' && inputs.compositor_runtime_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify trusted exact-source runtime producer run
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.compositor_runtime_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID" > "$RUNNER_TEMP/runtime-run.json"
          python3 scripts/release/github_inventory.py --run-id "$RUNTIME_RUN_ID" --kind jobs > "$RUNNER_TEMP/runtime-jobs.json"
          python3 scripts/release/github_inventory.py --run-id "$RUNTIME_RUN_ID" --kind artifacts > "$RUNNER_TEMP/runtime-artifacts.json"
          python3 scripts/release/verify-compositor-runtime-source-run.py \
            --run "$RUNNER_TEMP/runtime-run.json" --jobs "$RUNNER_TEMP/runtime-jobs.json" \
            --artifacts "$RUNNER_TEMP/runtime-artifacts.json" --repository "$GITHUB_REPOSITORY" \
            --commit "${{ needs.preflight.outputs.release_commit }}"

  compositor-runtime-public:
    name: Sign and bind opt-in compositor runtime companions
    needs: [preflight, policy, compositor-runtime-build, compositor-runtime-external]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.policy.result == 'success' && needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && needs.preflight.outputs.compositor_runtime_required == 'true' && (needs.compositor-runtime-build.result == 'success' || needs.compositor-runtime-external.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: flutter
        run: echo "version=$(tr -d '\r\n[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ steps.flutter.outputs.version }}
      - name: Prepare pinned Flutter signature verifier
        run: (cd apps/copypaste_flutter && flutter pub get --enforce-lockfile)
      - uses: ./.github/actions/download-verified-artifact
        if: inputs.compositor_runtime_run_id == ''
        with:
          pattern: copypaste-compositor-runtime-*
          path: runtime-source
      - name: Download verified staged compositor runtime companions
        if: inputs.compositor_runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.compositor_runtime_run_id }}
        run: |
          set -euo pipefail
          for artifact in copypaste-compositor-runtime-gnome-46-ubuntu24.04-x86_64; do
            python3 scripts/release/download_artifact.py --run-id "$RUNTIME_RUN_ID" --name "$artifact" --path "runtime-source/$artifact"
          done
      - name: Stage exact runtime producer outputs
        env:
          PRODUCER_RUN_ID: ${{ inputs.compositor_runtime_run_id || github.run_id }}
        run: |
          set -euo pipefail
          for archive in runtime-source/*/runtime.tar; do
            python3 scripts/release/compositor-runtime-archive.py extract \
              --archive "$archive" --output "$(dirname "$archive")/runtime"
          done
          python3 scripts/release/stage-compositor-runtime-release.py stage \
            --source-root runtime-source --output runtime-public \
            --version "${{ needs.preflight.outputs.version }}" \
            --commit "${{ needs.preflight.outputs.release_commit }}" \
            --producer-run-id "$PRODUCER_RUN_ID"
      - name: Sign exact runtime companion packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/release/sign-update-artifact.sh
          shopt -s nullglob
          packages=(runtime-public/*.deb runtime-public/*.rpm)
          (( ${#packages[@]} == 1 ))
          for package in "${packages[@]}"; do
            scripts/release/sign-update-artifact.sh "$package"
            (cd apps/copypaste_flutter && dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/verify_update_signature.dart "../../$package" "../../$package.sig")
            (cd runtime-public && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
          done
      - name: Bind public companion signatures and receipts
        run: |
          set -euo pipefail
          python3 scripts/release/stage-compositor-runtime-release.py finalize \
            --root runtime-public --version "${{ needs.preflight.outputs.version }}" \
            --commit "${{ needs.preflight.outputs.release_commit }}" --release-run-id "$GITHUB_RUN_ID" \
            --output runtime-public/production-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 7
          name: production-compositor-runtime
          if-no-files-found: error
          path: runtime-public

  linux-full-parity-evidence:
    name: Linux full parity evidence gate
    needs: [preflight, policy, linux, compositor-runtime-public, linux-native-current]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.policy.result == 'success' && needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_qualification_only != 'true' && (needs.linux-native-current.result == 'success' || inputs.linux_evidence_run_id != '') && needs.preflight.outputs.linux_required == 'true' && (needs.linux.result == 'success' || needs.preflight.outputs.linux_artifact_run_id != github.run_id) && (needs.preflight.outputs.compositor_runtime_required != 'true' || needs.compositor-runtime-public.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require an evidence source run
        env:
          EVIDENCE_RUN_ID: ${{ needs.preflight.outputs.linux_evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: provide linux_evidence_run_id from a completed .github/workflows/linux-native-qualification.yml run" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" > "$RUNNER_TEMP/linux-evidence-run.json"
          python3 scripts/release/github_inventory.py --run-id "$EVIDENCE_RUN_ID" --kind jobs > "$RUNNER_TEMP/linux-evidence-jobs.json"
          python3 scripts/release/verify-linux-qualification-evidence-source.py \
            --run "$RUNNER_TEMP/linux-evidence-run.json" --jobs "$RUNNER_TEMP/linux-evidence-jobs.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: linux-native-qualification
          path: native-evidence
          run-id: ${{ needs.preflight.outputs.linux_evidence_run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: production-linux-x86_64
          path: exact-artifacts/x86_64
          run-id: ${{ needs.preflight.outputs.linux_artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.previous_linux_artifact_run_id != ''
        with:
          name: production-linux-x86_64
          path: previous-artifacts/x86_64
          run-id: ${{ needs.preflight.outputs.previous_linux_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify prior Linux artifact source
        id: previous-linux
        if: needs.preflight.outputs.previous_linux_artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ needs.preflight.outputs.previous_linux_artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID" > "$RUNNER_TEMP/previous-run.json"
          python3 scripts/release/github_inventory.py --run-id "$PREVIOUS_RUN_ID" --kind jobs > "$RUNNER_TEMP/previous-jobs.json"
          python3 scripts/release/github_inventory.py --run-id "$PREVIOUS_RUN_ID" --kind artifacts > "$RUNNER_TEMP/previous-artifacts.json"
          previous_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/previous-run.json")"
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/release/verify-linux-artifact-source-run.py \
            --run "$RUNNER_TEMP/previous-run.json" --jobs "$RUNNER_TEMP/previous-jobs.json" \
            --artifacts "$RUNNER_TEMP/previous-artifacts.json" --repository "$GITHUB_REPOSITORY" --commit "$previous_commit"
          previous_version="$(python3 scripts/release/previous-linux-version.py \
            --receipt previous-artifacts/x86_64/production-receipt.json --run-id "$PREVIOUS_RUN_ID" \
            --commit "$previous_commit")"
          echo "version=$previous_version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.compositor_runtime_required == 'true'
        with:
          name: production-compositor-runtime
          path: compositor-runtime
      - name: Verify full exact-artifact Linux desktop evidence
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          EVIDENCE_RUN_ID: ${{ needs.preflight.outputs.linux_evidence_run_id }}
          ARTIFACT_RUN_ID: ${{ needs.preflight.outputs.linux_artifact_run_id }}
          COMPOSITOR_RUNTIME_REQUIRED: ${{ needs.preflight.outputs.compositor_runtime_required }}
          PREVIOUS_VERSION: ${{ steps.previous-linux.outputs.version }}
        run: |
          set -euo pipefail
          mkdir exact-artifacts/all
          find exact-artifacts -path exact-artifacts/all -prune -o -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} exact-artifacts/all/ \;
          args=(--root native-evidence --artifacts exact-artifacts/all
            --version "$VERSION" --commit "$GITHUB_SHA"
            --source-run-id "$EVIDENCE_RUN_ID" --artifact-run-id "$ARTIFACT_RUN_ID")
          if [[ "$COMPOSITOR_RUNTIME_REQUIRED" == true ]]; then
            args+=(--compositor-runtime compositor-runtime)
          fi
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            mkdir previous-artifacts/all
            find previous-artifacts -path previous-artifacts/all -prune -o -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} previous-artifacts/all/ \;
            args+=(--previous-artifacts previous-artifacts/all --previous-version "$PREVIOUS_VERSION")
          fi
          python3 scripts/release/verify-linux-native-qualification.py "${args[@]}"

  qualify:
    needs: [preflight, policy, macos, macos-regression, android, windows, linux, compositor-runtime-public, linux-full-parity-evidence, qualification-sms-codes]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.policy.result == 'success' && (needs.preflight.outputs.reuse_qualified == 'true' || (needs.macos.result == 'success' && needs.macos-regression.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success' && needs.qualification-sms-codes.result == 'success' && (needs.preflight.outputs.linux_required != 'true' || ((needs.linux.result == 'success' || needs.preflight.outputs.linux_artifact_run_id != github.run_id) && needs.linux-full-parity-evidence.result == 'success' && (needs.preflight.outputs.compositor_runtime_required != 'true' || needs.compositor-runtime-public.result == 'success'))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download previously qualified artifacts
        if: needs.preflight.outputs.reuse_qualified == 'true'
        uses: ./.github/actions/download-verified-artifact
        with:
          name: production-qualified
          path: qualified
          run-id: ${{ needs.preflight.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-macos
          path: qualified/macos
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-android
          path: qualified/android
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.reuse_qualified != 'true'
        with:
          name: production-windows
          path: qualified/windows
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_required == 'true'
        with:
          name: production-linux-x86_64
          path: qualified/linux-x86_64
          run-id: ${{ needs.preflight.outputs.linux_artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/download-verified-artifact
        if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.compositor_runtime_required == 'true'
        with:
          name: production-compositor-runtime
          path: qualified/compositor-runtime
      - name: Assemble one Linux qualification receipt
        if: needs.preflight.outputs.reuse_qualified != 'true' && needs.preflight.outputs.linux_required == 'true'
        run: |
          set -euo pipefail
          mkdir -p qualified/linux
          find qualified/linux-x86_64 -type f ! -name production-receipt.json -exec cp {} qualified/linux/ \;
          python3 scripts/release/merge-linux-artifact-receipts.py \
            --receipt qualified/linux-x86_64/production-receipt.json \
            --output qualified/linux/production-receipt.json
          rm -rf qualified/linux-x86_64
      - name: Verify exact qualified artifacts
        run: |
          set -euo pipefail
          args=(--root qualified --version "${{ needs.preflight.outputs.version }}" --commit "${{ needs.preflight.outputs.release_commit }}" --run-id "${{ needs.preflight.outputs.artifact_run_id }}")
          if [[ "${{ needs.preflight.outputs.linux_required }}" == true ]]; then args+=(--require-linux); fi
          if [[ "${{ needs.preflight.outputs.compositor_runtime_required }}" == true ]]; then args+=(--require-compositor-runtime); fi
          if [[ "${{ needs.preflight.outputs.linux_artifact_run_id }}" != "$GITHUB_RUN_ID" ]]; then args+=(--linux-origin-run-id "${{ needs.preflight.outputs.linux_artifact_run_id }}"); fi
          python3 scripts/release/verify-artifact-receipts.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 90
          name: production-qualified
          if-no-files-found: error
          path: qualified

  publish:
    concurrency:
      group: copypaste-stable-publication
      cancel-in-progress: false
      queue: max
    needs: [preflight, qualify]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.qualify.result == 'success' && needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: production-qualified
          path: qualified
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find qualified -type f ! -name production-receipt.json -exec cp {} dist/ \;
          git show "$RELEASE_COMMIT:packaging/release-notes.md" > packaging/release-notes.md
          git show "$RELEASE_COMMIT:packaging/release-template.md" > packaging/release-template.md
          python3 scripts/release/render-release-notes.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --artifacts dist --output "$RUNNER_TEMP/release-notes.md"
          python3 scripts/release/publish-release.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --artifacts dist --notes "$RUNNER_TEMP/release-notes.md"
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          : "${TAP_TOKEN:?missing Homebrew tap token}"
          dmg="dist/CopyPaste-v${VERSION}-macos-arm64.dmg"
          tarball="dist/copypaste-cli-v${VERSION}-macos-arm64.tar.gz"
          chmod +x scripts/release/gen-cask.sh scripts/release/gen-formula.sh
          scripts/release/gen-cask.sh "$VERSION" "$(sha256sum "$dmg" | cut -d' ' -f1)" --out tap
          scripts/release/gen-formula.sh "$VERSION" "$(sha256sum "$tarball" | cut -d' ' -f1)" --out tap
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dmytro-yevs/homebrew-copypaste.git" homebrew-tap
          mkdir -p homebrew-tap/Casks homebrew-tap/Formula
          cp tap/Casks/copypaste.rb homebrew-tap/Casks/copypaste.rb
          cp tap/Formula/copypaste-cli.rb homebrew-tap/Formula/copypaste-cli.rb
          cd homebrew-tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Casks/copypaste.rb Formula/copypaste-cli.rb
          if ! git diff --cached --quiet; then
            git commit -m "Release CopyPaste $VERSION"
            git push origin HEAD:main
          fi

  release-required:
    name: Release qualification required
    needs: [preflight, qualify, linux-native-bootstrap]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject skipped or unsuccessful qualification
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          QUALIFY: ${{ needs.qualify.result }}
          BOOTSTRAP: ${{ needs.linux-native-bootstrap.result }}
          QUALIFICATION_ONLY: ${{ needs.preflight.outputs.linux_qualification_only }}
        run: |
          [[ "$PREFLIGHT" == success ]]
          if [[ "$QUALIFICATION_ONLY" == true ]]; then
            [[ "$BOOTSTRAP" == success ]]
          else
            [[ "$QUALIFY" == success ]]
          fi
