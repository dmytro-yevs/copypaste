name: Release

# Builds and publishes a release for all shipped platforms from one page: the macOS
# .app in a DMG, the CLI and daemon in a tarball, the Homebrew cask and formula
# that point at both, an Android APK, and a signed Windows NSIS installer with
# the update-feed metadata consumed by the Windows updater runtime.
#
# macOS remains ad-hoc signed under ADR-0001: no Apple identity or notarisation
# credential is present. Windows publication is different: it fails closed
# unless the code-signing certificate and Tauri updater key are available.
#
# The one optional secret that is not a signing credential is
# HOMEBREW_TAP_TOKEN: contents:write on the tap repository so the workflow can
# publish the updated cask. Without it the workflow still succeeds and attaches
# the cask and formula to the release for a maintainer to copy across by hand.
#
# Android also requires its durable release key. A missing signing secret on
# either platform stops publication before a non-upgradable artefact is uploaded.
#
# UNVERIFIED
# This project is developed on Linux. Every macOS-specific step below —
# codesign, hdiutil, PlistBuddy, the Tauri macOS bundler, and whether the
# resulting bundle launches — requires the native runner below.
#
# Why this is not cargo-dist
# AGENTS.md rule 1 makes a maintained tool the default, so cargo-dist (now
# "dist") was evaluated first. It does not package macOS .app bundles or DMGs.
# axodotdev/cargo-dist#24, "macos .dmg/.app installer support?", has been open
# since October 2022 and the maintainers' position on it is that it is "more
# gui app specific ... out of scope for MVP". Its supported artefacts are
# tarballs of plain binaries; its Homebrew installer generates a formula and
# has no cask support, so it cannot express `app "CopyPaste.app"` or the
# postflight ADR-0001 requires. It would therefore cover the CLI tarball and
# formula and nothing else — the .app, the DMG, the cask and the quarantine
# handling would still be hand-written, and the release would be split across
# two systems that each want to own the GitHub Release.
#
# Verdict: not adopted, and the reason is capability rather than preference.
# Worth revisiting if #24 is ever implemented, at which point the CLI half of
# this workflow could be deleted outright.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 2.0.0-alpha.1)"
        required: true
        type: string
      publish:
        description: "Create a GitHub Release and publish to the tap"
        required: false
        default: false
        type: boolean

concurrency:
  # The default single pending slot can replace an older queued rerun. This
  # still protects the active build and serializes the low-frequency version.
  group: release-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A release is the one build that leaves the repository, so it gets its own
  # scan rather than trusting that supply-chain.yml ran on the same commit.
  # Tree scan: the tag publishes the tree, and history is covered by the weekly
  # run in supply-chain.yml.
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml

  supabase-gate:
    name: Real Supabase integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.34.3
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: linux-release-supabase
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Exercise the disposable Supabase stack
        run: bash supabase/tests/real-supabase.sh

  # Resolve the version once, so the tag, the workspace manifest, the DMG
  # filename, the cask and the formula cannot disagree with each other.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - name: Install release metadata dependencies
        run: npm ci --prefix crates/copypaste-ui --ignore-scripts

      - id: resolve
        # The dispatch inputs arrive as environment variables rather than
        # through `${{ }}`. Interpolation splices the value into the script
        # text before bash sees it, so a version containing a backtick or a
        # semicolon would execute rather than fail validation.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION:-}"
            publish="${INPUT_PUBLISH:-false}"
          fi
          version="${version#v}"

          # Cargo workspace metadata is authoritative. The resolver also holds
          # package.json and Tauri's version indirection equal to it before it
          # emits the Android versionName and monotonic versionCode.
          ws="$(node scripts/release/android-metadata.mjs --field versionName)"
          if [[ "$ws" != "$version" ]]; then
            echo "::error::version mismatch — requested '$version', Cargo.toml [workspace.package] says '$ws'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $version (publish=$publish)"

  pairing-e2e:
    name: Pairing native E2E gate
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # rust-toolchain.toml outranks the toolchain step's `rustup default`, so
      # the bare cargo below would build on whatever stable is that week.
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libwebkit2gtk-4.1-dev webkit2gtk-driver \
            libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: linux-1.96-pairing-e2e-release
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tauri-driver
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.0.6-${{ runner.os }}-gnu
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            crates/copypaste-ui/package-lock.json
            e2e/package-lock.json
      - name: Build pairing surfaces
        run: cargo build -p copypaste-ui -p copypaste-daemon -p copypaste-cli --locked
      - name: Install frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm ci
      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci
      - name: Run pairing gate
        working-directory: e2e
        run: npm test -- tests/devices.e2e.test.ts

  # Build on macOS. arm64 only: the release ships a single aarch64 slice, not a
  # universal binary, matching `depends_on arch: :arm64` in the cask. Homebrew
  # is winding down Intel support and this project has no Intel user to serve.
  macos:
    name: Build macOS (arm64)
    needs: version
    runs-on: macos-14
    # A macOS runner bills at ten times a Linux one, and the default job timeout
    # is six hours. A Tauri build that hangs would spend a day of quota.
    timeout-minutes: 20
    env:
      # `dtolnay/rust-toolchain` sets its toolchain with `rustup default`, and
      # rust-toolchain.toml — channel = "stable" — outranks the default. Without
      # this the release scripts' bare `cargo` builds on whatever stable is that
      # week, not on the pinned 1.96. RUSTUP_TOOLCHAIN outranks both.
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-14-release
          # SQLCipher compiles from C on a cold cache and dominates the build.
          # Saving on a release run keeps the next one usable.
          save-if: "true"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - name: Confirm no signing identity is present
        # A guard, not a formality. If a Developer ID ever appears in the
        # runner keychain or the environment, the build would silently start
        # producing something ADR-0001 does not describe, and the difference
        # would not be visible in any artefact name.
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}${APPLE_CERTIFICATE:-}${APPLE_ID:-}" ]]; then
            echo "::error::an Apple signing credential is present in the environment; ADR-0001 says this pipeline has none"
            exit 1
          fi
          echo "Signing identities available to this runner:"
          security find-identity -v -p codesigning || true

      - name: Build and sign CopyPaste.app
        run: ./scripts/release/build-macos-app.sh "${{ needs.version.outputs.version }}" arm64

      - name: Package DMG
        run: ./scripts/release/make-dmg.sh "${{ needs.version.outputs.version }}" arm64

      - name: Verify nothing links outside the bundle
        # SQLCipher is compiled from C in this build and libsqlite3-sys picks its
        # crypto backend by the *absence* of OPENSSL_DIR — see the script header.
        # Getting that wrong yields a DMG that mounts and launches on this runner
        # and dies with a dyld error on every user's Mac. No other step here would
        # notice: the pipeline has no install test.
        run: |
          set -euo pipefail
          ./scripts/release/check-macos-linkage.sh \
            dist/CopyPaste.app \
            target/aarch64-apple-darwin/release/copypaste \
            target/aarch64-apple-darwin/release/copypaste-daemon

      - name: Install native evidence Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/pip" install --requirement requirements-ci.txt
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"

      - name: Install the DMG and run it
        # The first thing in this pipeline that opens what it built. It mounts
        # the image, copies the app to /Applications, quarantines it the way a
        # download is quarantined, runs the cask's postflight, and then starts
        # the daemon from inside the bundle and copies something with pbcopy.
        # The legs that need a window server are reported rather than enforced;
        # the script's header says which is which.
        run: |
          set -euo pipefail
          ./scripts/release/smoke-macos-dmg.sh "${{ needs.version.outputs.version }}" arm64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-macos-native-evidence
          path: artifacts/release-macos-native
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-macos-cloud-evidence
          path: artifacts/release-macos-cloud
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksums
        run: |
          set -euo pipefail
          {
            echo '## Artefacts'
            echo
            echo '```'
            ( cd dist && shasum -a 256 ./*.dmg )
            echo '```'
            echo
            echo 'Ad-hoc signed, not notarised — see ADR-0001.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  macos-cli:
    name: Build macOS CLI tarball (arm64)
    needs: version
    runs-on: macos-14
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-14-release-cli
          save-if: "true"
      - name: Package CLI tarball
        run: ./scripts/release/build-cli-tarball.sh "${{ needs.version.outputs.version }}" arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-cli-arm64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # Build the Android APK.
  #
  # UNVERIFIED, in the same sense as the macOS job and then some: no Android
  # build has ever run in this repository, and the Tauri Android scaffold under
  # crates/copypaste-ui/src-tauri/gen/android is new. Every path below is
  # asserted before it is used, so a scaffold that landed somewhere else fails
  # with a sentence rather than a stack trace.
  #
  # Signing is ADR-0006. Android will not install an unsigned APK, and an APK
  # signed with a per-run key cannot upgrade an existing install. All four
  # release-key secrets are therefore required; their absence fails this job
  # before any Android artifact is uploaded or published.
  android-abi:
    name: Build Android native shard (${{ matrix.target }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            triple: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7
            triple: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686
            triple: i686-linux-android
            abi: x86
    env:
      # See the macOS job: rust-toolchain.toml outranks `rustup default`, so
      # without this the Rust half of the Gradle build runs under stable — for
      # which `dtolnay/rust-toolchain` installed no Android target. The symptom
      # is `can't find crate for 'std'` from inside a Gradle task.
      RUSTUP_TOOLCHAIN: "1.96"
      # Pinned for the reason rust-toolchain.toml exists. An NDK that floats is
      # a build that changes under you, and the failure surfaces as a linker
      # error three layers down.
      NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-36"
      BUILD_TOOLS_VERSION: "36.0.0"
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-release-${{ matrix.target }}
          save-if: "true"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            crates/copypaste-ui/src-tauri/gen/android/**/*.gradle*
            crates/copypaste-ui/src-tauri/gen/android/**/gradle-wrapper.properties

      - name: Install the pinned SDK components
        run: |
          set -euo pipefail
          # The runner image ships the SDK and cmdline-tools; this only adds the
          # pinned pieces. Asserting ANDROID_HOME rather than assuming it keeps
          # a runner-image change from failing later and less clearly.
          : "${ANDROID_HOME:?ANDROID_HOME is unset — the runner image has no Android SDK}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || { echo "::error::$sdkmanager not found"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          # Asserted, not assumed. sdkmanager reports an unknown package as
          # `Warning: Failed to find package …` and has exited 0 doing it, which
          # would leave NDK_HOME pointing at nothing and surface four steps later
          # as a linker error. The runner image pins its own NDK revision, so
          # this list is exactly the set that had to be downloaded.
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          [[ -d "$ndk" ]] || { echo "::error::sdkmanager did not install ndk;${NDK_VERSION} — $ndk is absent"; exit 1; }
          [[ -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}" ]] \
            || { echo "::error::sdkmanager did not install platforms;${ANDROID_PLATFORM}"; exit 1; }
          for t in zipalign apksigner aapt2; do
            [[ -x "${tools}/${t}" ]] \
              || { echo "::error::${tools}/${t} is missing — build-tools;${BUILD_TOOLS_VERSION} did not install"; exit 1; }
          done

          {
            echo "NDK_HOME=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
          } >> "$GITHUB_ENV"

      - name: Confirm the OpenSSL build toolchain is present
        # New requirement as of ADR-0007. The NDK sysroot has no libcrypto, so
        # SQLCipher's OpenSSL is compiled from source per ABI by openssl-src,
        # which shells out to both of these. Asserted for the same reason the
        # SDK components above are: absent, perl surfaces as a cc-rs failure
        # several minutes into the Rust build, naming neither perl nor OpenSSL.
        run: |
          set -euo pipefail
          for tool in perl make; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is required to build OpenSSL for Android (ADR-0007)"; exit 1; }
          done
          perl --version | sed -n '2p'
          make --version | sed -n '1p'

      - name: Point the Android builds at the NDK's llvm-ar and llvm-ranlib
        # cc-rs derives an Android target's ranlib from the triple when nothing
        # exports one, and the NDK stopped shipping `<triple>-ranlib` in r23.
        # The script says the rest; it is separate so check.sh can execute it,
        # because the variable names are the whole of the fix.
        run: |
          set -euo pipefail
          ./scripts/release/android-ndk-env.sh "$NDK_HOME" | tee -a "$GITHUB_ENV"

      - name: Render signed Android updater configuration
        run: |
          set -euo pipefail
          bash scripts/release/android-updater-feed.sh --render-config \
            crates/copypaste-ui/src-tauri/tauri.android.signed.conf.template.json \
            crates/copypaste-ui/src-tauri/tauri.android.signed.generated.conf.json \
            "$TAURI_UPDATER_PUBLIC_KEY" "$TAURI_UPDATER_ENDPOINT"

      - name: Build the APK
        run: |
          set -euo pipefail
          gen="crates/copypaste-ui/src-tauri/gen/android"
          if [[ ! -d "$gen" ]]; then
            echo "::error::$gen does not exist. The Tauri Android project is tracked source,"
            echo "::error::not something this job regenerates — see its README. Restore it or"
            echo "::error::fix this path; do not skip the job."
            exit 1
          fi

          cd crates/copypaste-ui
          npm ci

          # `tauri android init` is deliberately NOT run here. It cannot produce
          # what the first run of this job asked it for: tauri.settings.gradle
          # and app/tauri.build.gradle.kts are not in the CLI's template at all.
          # They are written by the *Rust* build — tauri-build's build script,
          # gated on TAURI_ANDROID_PROJECT_PATH — which `tauri android build`
          # runs itself, before Gradle, at "run an initial build to initialize
          # plugins". So the ignored files appear exactly when Gradle needs
          # them. Everything init would write is committed; see
          # src-tauri/gen/android/README.md.
          #
          # What is asserted instead is the half Gradle reads at configuration
          # time and the Kotlin that makes the APK worth shipping. An APK that
          # builds, installs and captures nothing is the failure this guards.
          for f in src-tauri/gen/android/settings.gradle \
                   src-tauri/gen/android/build.gradle.kts \
                   src-tauri/gen/android/gradlew \
                   src-tauri/gen/android/app/build.gradle.kts \
                   src-tauri/gen/android/buildSrc/src/main/java/com/copypaste/app/kotlin/BuildTask.kt \
                   src-tauri/gen/android/app/src/main/AndroidManifest.xml \
                   src-tauri/gen/android/app/src/main/aidl/android/content/IOnPrimaryClipChangedListener.aidl; do
            [[ -f "$f" ]] || { echo "::error::$f is missing from the checkout"; exit 1; }
          done
          for k in CapturePlugin IntakeActivity CaptureTileService ShizukuClipboard \
                   ClipListener CaptureService CaptureNotifications ClipQueue; do
            f="src-tauri/gen/android/app/src/main/java/com/copypaste/app/${k}.kt"
            [[ -f "$f" ]] || { echo "::error::$f is missing — the Android capture feature would build empty"; exit 1; }
          done

          # Gradle re-enters the CLI through this line, in a subprocess, with
          # src-tauri as its working directory. Baked in by init from however
          # init itself was invoked, so it is the one committed file that can
          # silently disagree with how this job starts the build.
          grep -q 'val executable = """npm"""' \
            src-tauri/gen/android/buildSrc/src/main/java/com/copypaste/app/kotlin/BuildTask.kt || {
            echo "::error::BuildTask.kt does not invoke the CLI through npm, but this step does"
            exit 1
          }

          npm run tauri -- android build --apk --target "${{ matrix.target }}" \
            --config src-tauri/tauri.android.signed.generated.conf.json

          outputs="src-tauri/gen/android/app/build/outputs/apk"
          shard="$(find "$outputs" -name '*release*.apk' -print -quit)"
          [[ -n "$shard" ]] || { echo "::error::the ${{ matrix.target }} release APK was not produced"; exit 1; }
          native="src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}/libcopypaste_ui_lib.so"
          [[ -f "$native" ]] || { echo "::error::the ${{ matrix.abi }} native library was not produced"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/android-native"
          cp "$native" "${RUNNER_TEMP}/android-native/"

