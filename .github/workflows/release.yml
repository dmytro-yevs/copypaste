name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v"
        required: true
        type: string
      publish:
        description: "Create the GitHub release and update Homebrew"
        required: false
        default: false
        type: boolean
      qualify:
        description: "Run signed product qualification without publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: Version and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      qualify: ${{ steps.resolve.outputs.qualify }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - name: Resolve one release identity
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_QUALIFY: ${{ inputs.qualify }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#v}"; publish=true; qualify=true
          else
            version="${INPUT_VERSION#v}"; publish="${INPUT_PUBLISH:-false}"; qualify="${INPUT_QUALIFY:-false}"
            [[ "$publish" =~ ^(true|false)$ && "$qualify" =~ ^(true|false)$ ]] || {
              echo "::error::release mode must be true or false"; exit 1; }
            [[ "$publish" == true ]] && qualify=true
          fi
          npm ci --prefix crates/copypaste-ui --ignore-scripts
          workspace_version="$(node scripts/release/android-metadata.mjs --field versionName)"
          [[ "$workspace_version" == "$version" ]] || {
            echo "::error::requested $version, workspace declares $workspace_version"; exit 1; }
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "qualify=$qualify"
          } >> "$GITHUB_OUTPUT"
      - name: Scan the release tree for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          ./scripts/check-secret-scan.sh --scan

  supabase:
    name: Supabase auth and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: "1.96" }
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with: { version: 2.34.3 }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { shared-key: linux-release-supabase }
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: bash supabase/tests/real-supabase.sh

  macos:
    name: macOS app, CLI, and critical native smoke
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      COPYPASTE_SMOKE_PROFILE: critical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-14-release
          save-if: "true"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - name: Reject an undeclared Apple signing identity
        run: |
          set -euo pipefail
          [[ -z "${APPLE_SIGNING_IDENTITY:-}${APPLE_CERTIFICATE:-}${APPLE_ID:-}" ]] || {
            echo "::error::an Apple signing credential is present but this release is ad-hoc signed"; exit 1; }
      - run: ./scripts/release/build-macos-app.sh "${{ needs.preflight.outputs.version }}" arm64
      - run: ./scripts/release/make-dmg.sh "${{ needs.preflight.outputs.version }}" arm64
      - run: ./scripts/release/build-cli-tarball.sh "${{ needs.preflight.outputs.version }}" arm64 --reuse-build
      - name: Verify bundled dynamic libraries
        run: ./scripts/release/check-macos-linkage.sh dist/CopyPaste.app target/aarch64-apple-darwin/release/copypaste target/aarch64-apple-darwin/release/copypaste-daemon
      - name: Install evidence dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/pip" install --requirement requirements-ci.txt
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
      - name: Install the released DMG and exercise critical behavior
        run: ./scripts/release/smoke-macos-dmg.sh "${{ needs.preflight.outputs.version }}" arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-macos-native-evidence
          path: artifacts/release-macos-native
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  android-abi:
    name: Android native ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64, triple: aarch64-linux-android, abi: arm64-v8a }
          - { target: armv7, triple: armv7-linux-androideabi, abi: armeabi-v7a }
          - { target: i686, triple: i686-linux-android, abi: x86 }
          - { target: x86_64, triple: x86_64-linux-android, abi: x86_64 }
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: android-36
      BUILD_TOOLS_VERSION: "36.0.0"
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-release-${{ matrix.target }}
          save-if: "true"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: crates/copypaste-ui/src-tauri/gen/android/**/*.gradle*
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}"
          ndk="$ANDROID_HOME/ndk/${NDK_VERSION}"
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          [[ -d "$ndk" && -x "$tools/apksigner" && -x "$tools/zipalign" && -x "$tools/aapt2" ]] || exit 1
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
      - run: ./scripts/release/android-ndk-env.sh "$NDK_HOME" >> "$GITHUB_ENV"
      - name: Render signed updater configuration
        run: bash scripts/release/android-updater-feed.sh --render-config crates/copypaste-ui/src-tauri/tauri.android.signed.conf.template.json crates/copypaste-ui/src-tauri/tauri.android.signed.generated.conf.json "$TAURI_UPDATER_PUBLIC_KEY" "$TAURI_UPDATER_ENDPOINT"
      - name: Build one ABI and stage its native library
        run: |
          set -euo pipefail
          cd crates/copypaste-ui
          npm ci
          npm run tauri -- android build --apk --target "${{ matrix.target }}" --config src-tauri/tauri.android.signed.generated.conf.json
          native="src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}/libcopypaste_ui_lib.so"
          [[ -f "$native" ]] || { echo "::error::missing $native"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-native"
          cp "$native" "$RUNNER_TEMP/android-native/"
          if [[ "${{ matrix.target }}" == x86_64 ]]; then
            inputs="$RUNNER_TEMP/android-tauri-inputs"
            mkdir -p "$inputs/src/main"
            [[ -f src-tauri/gen/android/app/tauri.properties ]] || exit 1
            [[ -f src-tauri/gen/android/app/src/main/assets/tauri.conf.json ]] || exit 1
            cp src-tauri/gen/android/app/tauri.properties "$inputs/"
            cp -R src-tauri/gen/android/app/src/main/assets "$inputs/src/main/"
            if [[ -d src-tauri/gen/android/app/src/main/java/com/copypaste/app/generated ]]; then
              mkdir -p "$inputs/src/main/java/com/copypaste/app"
              cp -R src-tauri/gen/android/app/src/main/java/com/copypaste/app/generated "$inputs/src/main/java/com/copypaste/app/"
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-${{ matrix.target }}
          path: ${{ runner.temp }}/android-native/libcopypaste_ui_lib.so
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'x86_64'
        with:
          name: android-tauri-inputs
          path: ${{ runner.temp }}/android-tauri-inputs
          if-no-files-found: error
          retention-days: 7

  android:
    name: Assemble and sign universal Android APK
    needs: [preflight, android-abi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: android-36
      BUILD_TOOLS_VERSION: "36.0.0"
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: "1.96", targets: x86_64-linux-android }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { shared-key: android-release-x86_64, save-if: "true" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Install Android packaging tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}"
          ndk="$ANDROID_HOME/ndk/${NDK_VERSION}"
          [[ -d "$ndk" ]] || exit 1
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
      - run: ./scripts/release/android-ndk-env.sh "$NDK_HOME" >> "$GITHUB_ENV"
      - run: bash scripts/release/android-updater-feed.sh --render-config crates/copypaste-ui/src-tauri/tauri.android.signed.conf.template.json crates/copypaste-ui/src-tauri/tauri.android.signed.generated.conf.json "$TAURI_UPDATER_PUBLIC_KEY" "$TAURI_UPDATER_ENDPOINT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-tauri-inputs
          path: crates/copypaste-ui/src-tauri/gen/android/app
      - name: Generate path-bound Gradle settings locally
        run: |
          set -euo pipefail
          cd crates/copypaste-ui
          npm ci
          # tauri-build writes settings with absolute cargo-registry paths. A
          # check executes that generator on this runner without linking JNI.
          TAURI_ANDROID_PROJECT_PATH="$PWD/src-tauri/gen/android" cargo check --locked --target x86_64-linux-android -p copypaste-ui
          test -f src-tauri/gen/android/tauri.settings.gradle
          test -f src-tauri/gen/android/app/tauri.build.gradle.kts
          test -f src-tauri/gen/android/app/tauri.properties
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android-native-aarch64, path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android-native-armv7, path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android-native-i686, path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/x86 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android-native-x86_64, path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/x86_64 }
      - name: Assemble the prebuilt universal APK
        run: |
          set -euo pipefail
          cd crates/copypaste-ui/src-tauri/gen/android
          ./gradlew --no-daemon clean assembleUniversalRelease -PabiList=arm64-v8a,armeabi-v7a,x86,x86_64 -ParchList=arm64,arm,x86,x86_64 -PtargetList=aarch64,armv7,i686,x86_64 -x rustBuildUniversalRelease -x rustBuildArm64Release -x rustBuildArmRelease -x rustBuildX86Release -x rustBuildX86_64Release
          apk="$(find app/build/outputs/apk -name '*universal*release*.apk' -print -quit)"
          [[ -n "$apk" ]] || exit 1
          cp "$apk" "$RUNNER_TEMP/copypaste-release-unsigned.apk"
      - name: Sign and verify the exact APK
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?missing Android release key}" "${KEYSTORE_PASSWORD:?missing Android release key}" "${KEY_ALIAS:?missing Android release key}" "${KEY_PASSWORD:?missing Android release key}"
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          unsigned="$RUNNER_TEMP/copypaste-release-unsigned.apk"
          libs="$(unzip -l "$unsigned")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/${abi}/libcopypaste_ui_lib.so" <<<"$libs"
          done
          keystore="$RUNNER_TEMP/release.jks"
          mkdir -p dist
          apk="dist/CopyPaste-v${VERSION}-android.apk"
          aligned="$apk.aligned"
          trap 'rm -f "$keystore" "$aligned" "$unsigned"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass "pass:${KEYSTORE_PASSWORD}" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASSWORD}" --out "$apk" "$aligned"
          expected="$(node scripts/release/android-metadata.mjs --field releaseCertificateSha256)"
          bash scripts/release/android-artifact-check.sh --apk "$apk" --build-type release --aapt2 "$tools/aapt2" --apksigner "$tools/apksigner" --expected-cert "$expected"
          bash scripts/release/android-updater-feed.sh --sign-apk "$apk" "$apk.sig"
          (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android-smoke:
    name: Android install, upgrade, persistence, and protection
    needs: [preflight, android]
    if: needs.preflight.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COPYPASTE_SMOKE_PROFILE: critical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native evidence dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/pip" install --requirement requirements-ci.txt
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: npm ci --prefix crates/copypaste-ui --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android, path: dist }
      - name: Fetch the latest eligible published upgrade fixture
        id: upgrade-fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(node scripts/release/android-metadata.mjs --field versionName)"
          releases="$RUNNER_TEMP/android-releases.json"
          gh release list --limit 100 --json tagName,isDraft > "$releases"
          mapfile -t candidates < <(
            node --input-type=module - "$current" "$releases" <<'NODE'
          import { readFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { pathToFileURL } from "node:url";

          const require = createRequire(pathToFileURL(`${process.cwd()}/crates/copypaste-ui/package.json`));
          const semver = require("semver");
          const current = semver.valid(process.argv[2]);
          if (!current) throw new Error(`current version is not semver: ${process.argv[2]}`);
          const releases = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const candidates = releases
            .filter((release) => !release.isDraft)
            .map((release) => semver.clean(release.tagName))
            .filter((version) => version && semver.lt(version, current))
            .sort(semver.rcompare);
          process.stdout.write(`${[...new Set(candidates)].join("\n")}\n`);
          NODE
          )
          mkdir -p upgrade-dist
          for previous in "${candidates[@]}"; do
            [[ -n "$previous" ]] || continue
            name="CopyPaste-v${previous}-android.apk"
            if gh release download "v${previous}" --pattern "$name" --dir upgrade-dist; then
              mv "upgrade-dist/$name" upgrade-dist/copypaste-previous-release.apk
              echo "version=$previous" >> "$GITHUB_OUTPUT"
              echo "Using published Android v${previous} as the upgrade fixture"
              exit 0
            fi
          done
          echo "::error::no published release below v${current} includes an Android APK"
          exit 1
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with: { distribution: temurin, java-version: "21" }
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "36"
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./scripts/release/android-release-emulator-legs.sh
        env:
          APK: dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk
          PREVIOUS_APK: upgrade-dist/copypaste-previous-release.apk
          PREVIOUS_VERSION: ${{ steps.upgrade-fixture.outputs.version }}
          SMOKE_OUT: artifacts/release-android-smoke
          STORAGE_OUT: artifacts/release-android-storage
          CLOUD_OUT: artifacts/release-android-cloud
          CLOUD_MODE: all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-smoke-evidence
          path: artifacts/release-android-smoke
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer and critical native smoke
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
      WINDOWS_RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { shared-key: windows-2022-release-app, cache-on-failure: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Prepare signing identity
        if: needs.preflight.outputs.qualify == 'true'
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/windows-sign.ps1 -Operation Prepare -PersistEnvironment -SmokeSign
      - name: Build once, sign, package, and install
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ('${{ needs.preflight.outputs.qualify }}' -eq 'true') {
            ./scripts/release/build-windows.ps1 -OutputDirectory artifacts/windows-x86_64
          } else {
            ./scripts/release/build-windows.ps1 -Unsigned -OutputDirectory artifacts/windows-x86_64
          }
      - name: Install and exercise the packaged product
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $signature = if ('${{ needs.preflight.outputs.qualify }}' -eq 'true') { 'Valid' } else { 'NotSigned' }
          ./scripts/release/windows-native-evidence.ps1 -Installer "artifacts/windows-x86_64/CopyPaste-v$version-windows-x86_64-setup.exe" -PackageDirectory artifacts/windows-x86_64 -EvidenceDirectory artifacts/release-windows-native -ExpectedSignature $signature -Commit '${{ github.sha }}' -RunId '${{ github.run_id }}'
      - if: always() && needs.preflight.outputs.qualify == 'true'
        run: ./scripts/release/windows-sign.ps1 -Operation Cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-windows-native-evidence
          path: artifacts/release-windows-native
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Validate artifacts and publish
    needs: [preflight, supabase, macos, android, android-smoke, windows]
    if: always() && needs.preflight.outputs.qualify == 'true' && needs.supabase.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success' && needs.android-smoke.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: macos-app-arm64, path: dist }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android, path: dist }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: windows-x86_64, path: dist }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-macos-native-evidence, path: artifacts/native-parity/macos }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-android-smoke-evidence, path: artifacts/native-parity/android }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-windows-native-evidence, path: artifacts/native-parity/windows }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: npm ci --prefix crates/copypaste-ui
      - name: Validate evidence and the exact qualified files
        working-directory: crates/copypaste-ui
        run: |
          npm run check:native-parity -- --require macos,android,windows --commit '${{ github.sha }}' --run-id '${{ github.run_id }}' --evidence '${{ github.workspace }}/artifacts/native-parity/macos/native-evidence.json' --evidence '${{ github.workspace }}/artifacts/native-parity/android/native-evidence.json' --evidence '${{ github.workspace }}/artifacts/native-parity/windows/native-evidence.json' --qualified-artifact macos='${{ github.workspace }}/dist/CopyPaste-v${{ needs.preflight.outputs.version }}-macos-arm64.dmg' --qualified-artifact android='${{ github.workspace }}/dist/CopyPaste-v${{ needs.preflight.outputs.version }}-android.apk' --qualified-artifact windows='${{ github.workspace }}/dist/CopyPaste-v${{ needs.preflight.outputs.version }}-windows-x86_64-setup.exe'
      - name: Generate Homebrew metadata from verified artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          dmg="dist/CopyPaste-v${VERSION}-macos-arm64.dmg"
          tarball="dist/copypaste-cli-v${VERSION}-macos-arm64.tar.gz"
          for artifact in "$dmg" "$tarball"; do
            [[ -f "$artifact" && -f "$artifact.sha256" ]] || exit 1
            actual="$(sha256sum "$artifact" | cut -d' ' -f1)"
            grep -q "$actual" "$artifact.sha256" || exit 1
          done
          ./scripts/release/gen-cask.sh "$VERSION" "$(sha256sum "$dmg" | cut -d' ' -f1)" --out tap
          ./scripts/release/gen-formula.sh "$VERSION" "$(sha256sum "$tarball" | cut -d' ' -f1)" --out tap
      - name: Compose updater feed and checksums
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/CopyPaste-v${VERSION}-android.apk"
          exe="dist/CopyPaste-v${VERSION}-windows-x86_64-setup.exe"
          bash scripts/release/android-updater-feed.sh --write-feed "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RELEASE_BASE_URL" "$exe" "$exe.sig" "$apk" "$apk.sig" dist/latest.json
          checksum_file="$(mktemp)"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
          )
      - name: Create GitHub release
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/release/publish-github-release.sh --version "$VERSION" --repo '${{ github.repository }}' --notes packaging/release-notes.md dist/*.dmg dist/*.dmg.sha256 dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.apk dist/*.apk.sig dist/*.apk.sha256 dist/*.exe dist/*.exe.sig dist/latest.json dist/SHA256SUMS tap/Casks/copypaste.rb tap/Formula/copypaste-cli.rb
      - name: Publish Homebrew tap
        if: needs.preflight.outputs.publish == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${TAP_TOKEN:-}" ]] || exit 0
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-copypaste.git" tap-repo
          mkdir -p tap-repo/Casks tap-repo/Formula
          cp tap/Casks/copypaste.rb tap-repo/Casks/copypaste.rb
          cp tap/Formula/copypaste-cli.rb tap-repo/Formula/copypaste-cli.rb
          cd tap-repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks Formula
          git diff --cached --quiet || { git commit -m "copypaste ${VERSION}"; git push origin HEAD:main; }
