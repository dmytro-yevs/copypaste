            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$out" \
            "${out}.aligned"
          rm -f "${out}.aligned" "$keystore"
          "${tools}/apksigner" verify "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-cloud-evidence-apk
          path: evidence-dist/copypaste-cloud-evidence-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7

  # Test the signed universal artifact, not a separately assembled emulator
  # APK. This job downloads exactly what `publish` will later download, checks
  # its sidecar digest, and installs/runs it through the release smoke harness.
  # It runs only when a release can be published; a non-publishing dispatch may
  # still build artifacts without spending an emulator runner.
  android-smoke:
    name: Smoke-test published Android APK
    needs: [version, android, android-cloud-evidence, android-upgrade-fixture]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native evidence Python dependencies
        run: python3 -m pip install --requirement requirements-ci.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - name: Install Android metadata Node dependencies
        run: npm ci --prefix crates/copypaste-ui --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-cloud-evidence-apk
          path: evidence-dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-upgrade-fixture
          path: upgrade-dist

      - name: Verify the release artifact identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/CopyPaste-v${VERSION}-android.apk"
          sidecar="${apk}.sha256"
          [[ -f "$apk" ]] || { echo "::error::$apk is missing from the Android artifact"; exit 1; }
          [[ -f "$sidecar" ]] || { echo "::error::$sidecar is missing from the Android artifact"; exit 1; }
          ( cd dist && sha256sum --check "$(basename "$sidecar")" )
          echo "Testing $(sha256sum "$apk" | cut -d' ' -f1)  $(basename "$apk")"

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [[ -e /dev/kvm ]] || { echo "::error::/dev/kvm is absent — this runner cannot accelerate the emulator"; exit 1; }

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "36"
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ./scripts/release/android-release-emulator-legs.sh
        env:
          APK: dist/CopyPaste-v${{ needs.version.outputs.version }}-android.apk
          PREVIOUS_APK: upgrade-dist/copypaste-previous-release.apk
          SMOKE_OUT: artifacts/release-android-smoke
          STORAGE_OUT: artifacts/release-android-storage
          CLOUD_MODE: all
          CLOUD_EVIDENCE_APK: evidence-dist/copypaste-cloud-evidence-x86_64-release.apk
          CLOUD_OUT: artifacts/release-android-cloud

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-smoke-evidence
          path: artifacts/release-android-smoke
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-storage-evidence
          path: artifacts/release-android-storage
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-cloud-evidence
          path: artifacts/release-android-cloud
          if-no-files-found: error
          retention-days: 14

  android-smoke-api33:
    name: Smoke-test published Android APK (API 33)
    needs: [version, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native evidence Python dependencies
        run: python3 -m pip install --requirement requirements-ci.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [[ -e /dev/kvm ]] || { echo "::error::/dev/kvm is absent — this runner cannot accelerate the emulator"; exit 1; }

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "33"
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ./scripts/release/android-smoke-release.sh
        env:
          APK: dist/CopyPaste-v${{ needs.version.outputs.version }}-android.apk
          SMOKE_OUT: artifacts/release-android-smoke-api33

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-api33-smoke-evidence
          path: artifacts/release-android-smoke-api33
          if-no-files-found: error
          retention-days: 14

  android-hardware:
    name: Validate published Android APK on a physical device
    needs: [version, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: [self-hosted, linux, ARM64, android-device]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native evidence Python dependencies
        run: python3 -m pip install --requirement requirements-ci.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - name: Select the attached physical Android device
        run: |
          set -euo pipefail
          mapfile -t devices < <(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }')
          (( ${#devices[@]} == 1 )) || { echo "::error::Expected exactly one authorized Android device"; exit 1; }
          serial="${devices[0]}"
          [[ "$serial" != emulator-* ]] || { echo "::error::Emulator serial cannot produce publication evidence"; exit 1; }
          qemu="$(adb -s "$serial" shell getprop ro.kernel.qemu | tr -d '\r')"
          [[ "$qemu" != "1" ]] || { echo "::error::Emulated Android cannot produce publication evidence"; exit 1; }
          echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"

      - name: Verify and exercise the release artifact on hardware
        env:
          APK: dist/CopyPaste-v${{ needs.version.outputs.version }}-android.apk
          SMOKE_OUT: artifacts/release-android-physical
        run: |
          set -euo pipefail
          sidecar="${APK}.sha256"
          [[ -f "$APK" && -f "$sidecar" ]] || { echo "::error::Android release artifact or digest is missing"; exit 1; }
          ( cd dist && sha256sum --check "$(basename "$sidecar")" )
          bash ./scripts/release/android-smoke-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-physical-evidence
          path: artifacts/release-android-physical
          if-no-files-found: error
          retention-days: 14

  windows-sidecars:
    name: Build Windows sidecars
    needs: version
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-2022-release-sidecars
          cache-on-failure: true
      - name: Build release sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo +1.96 build --release --locked --target x86_64-pc-windows-msvc -p copypaste-cli -p copypaste-daemon
          New-Item -ItemType Directory -Force artifacts/windows-sidecars | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/copypaste.exe,target/x86_64-pc-windows-msvc/release/copypaste-daemon.exe artifacts/windows-sidecars
          @{ architecture = "x86_64" } | ConvertTo-Json |
            Set-Content artifacts/windows-sidecars/sidecars.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-sidecars
          path: artifacts/windows-sidecars
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build and exercise Windows installer
    needs: [version, windows-sidecars]
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
      WINDOWS_RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-2022-release-app
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-sidecars
          path: artifacts/windows-sidecars
      - name: Install native evidence Python dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-ci.txt
      - name: Exercise Windows packaging failures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/release/test-package-windows.ps1
          ./scripts/release/windows-native-evidence.ps1 -SelfTest
          ./scripts/release/build-windows.ps1 -SelfTest
          ./scripts/release/windows-sign.ps1 -Operation SelfTest
      - name: Prepare Windows release signing
        if: needs.version.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/release/windows-sign.ps1 `
            -Operation Prepare `
            -PersistEnvironment `
            -SmokeSign
      - name: Build signed Windows release package
        if: needs.version.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/release/build-windows.ps1 `
            -PrebuiltSidecarsDirectory artifacts/windows-sidecars `
            -OutputDirectory artifacts/windows-x86_64
      - name: Build unsigned Windows release package
        if: needs.version.outputs.publish != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/release/build-windows.ps1 `
            -Unsigned `
            -PrebuiltSidecarsDirectory artifacts/windows-sidecars `
            -OutputDirectory artifacts/windows-x86_64
      - name: Remove Windows signing material
        if: always() && needs.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/release/windows-sign.ps1 -Operation Cleanup
      - name: Install, launch with packaged sidecar, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ needs.version.outputs.version }}'
          $installer = "artifacts/windows-x86_64/CopyPaste-v$version-windows-x86_64-setup.exe"
          $signature = if ('${{ needs.version.outputs.publish }}' -eq 'true') { 'Valid' } else { 'NotSigned' }
          ./scripts/release/windows-native-evidence.ps1 `
            -Installer $installer `
            -PackageDirectory artifacts/windows-x86_64 `
            -EvidenceDirectory artifacts/release-windows-native `
            -ExpectedSignature $signature `
            -Commit '${{ github.sha }}' `
            -RunId '${{ github.run_id }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-windows-native-evidence
          path: artifacts/release-windows-native
          if-no-files-found: error
          retention-days: 30

  native-parity:
    name: Gate publication on native evidence
    needs: [version, macos, android-hardware, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m pip install --requirement requirements-ci.txt
      - name: Reject incomplete feature evidence
        run: python3 scripts/check-feature-ledger.py --require-complete
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-native-evidence
          path: artifacts/native-parity/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-android-physical-evidence
          path: artifacts/native-parity/android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-native-evidence
          path: artifacts/native-parity/windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: npm ci
        working-directory: crates/copypaste-ui
      - name: Validate release-native parity
        working-directory: crates/copypaste-ui
        run: |
          set -euo pipefail
          expected=()
          while IFS= read -r state; do
            [[ -n "$state" ]] && expected+=(--expect-feature-state "$state")
          done < <(python3 "$GITHUB_WORKSPACE/scripts/check-feature-ledger.py" --receipt-expectations)
          (( ${#expected[@]} > 0 )) || { echo "::error::No verified feature-state expectations were produced"; exit 1; }
          npm run check:native-parity -- \
            --require macos,android,windows \
            --commit ${{ github.sha }} \
            --run-id ${{ github.run_id }} \
            --evidence ${{ github.workspace }}/artifacts/native-parity/macos/native-evidence.json \
            --evidence ${{ github.workspace }}/artifacts/native-parity/android/native-evidence.json \
            --evidence ${{ github.workspace }}/artifacts/native-parity/windows/native-evidence.json \
            "${expected[@]}"

  # Generate the cask and the formula from the artefacts that were actually
  # built, so the checksums come from the files being published rather than
  # from a re-download.
  packaging:
    name: Generate cask and formula
    needs: [version, macos, macos-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-arm64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-cli-arm64
          path: dist

      - name: Stamp cask and formula
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"

          dmg="dist/CopyPaste-v${version}-macos-arm64.dmg"
          tgz="dist/copypaste-cli-v${version}-macos-arm64.tar.gz"
          [[ -f "$dmg" ]] || { echo "::error::$dmg missing"; exit 1; }
          [[ -f "$tgz" ]] || { echo "::error::$tgz missing"; exit 1; }

          # Computed from the artefact, not read from the .sha256 sidecar.
          # Trusting the sidecar would mean the cask and the file it verifies
          # could both be wrong in the same way.
          dmg_sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          tgz_sha="$(sha256sum "$tgz" | cut -d' ' -f1)"

          # And then check the sidecars agree, because a disagreement means
          # something rewrote an artefact between jobs.
          grep -q "$dmg_sha" "${dmg}.sha256" || { echo "::error::DMG checksum does not match its .sha256 sidecar"; exit 1; }
          grep -q "$tgz_sha" "${tgz}.sha256" || { echo "::error::tarball checksum does not match its .sha256 sidecar"; exit 1; }

          ./scripts/release/gen-cask.sh    "$version" "$dmg_sha" --out tap
          ./scripts/release/gen-formula.sh "$version" "$tgz_sha" --out tap

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew
          path: tap/
          if-no-files-found: error

  # Publish.
  publish:
    name: Publish release
    # Android and Windows are hard dependencies: one release page serves all
    # shipped platforms, and a page that silently serves only some of them is
    # worse than a failed run.
    needs: [version, supabase-gate, secret-scan, pairing-e2e, macos, android, android-smoke, android-smoke-api33, windows, native-parity, packaging]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The only widened permission in this file, and only on this job.
      contents: write
    steps:
      # Needed for packaging/release-notes.md.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-arm64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-cli-arm64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x86_64
          path: dist

      - name: Compose canonical cross-platform updater feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/CopyPaste-v${VERSION}-android.apk"
          exe="$(find dist -maxdepth 1 -name '*-windows-x86_64-setup.exe' -print -quit)"
          [[ -n "$exe" ]] || { echo "::error::Windows installer is missing"; exit 1; }
          [[ -s "${apk}.sig" ]] || { echo "::error::Android updater signature is missing"; exit 1; }
          win_sig="${exe}.sig"
          [[ -s "$win_sig" ]] || { echo "::error::Windows updater signature is missing"; exit 1; }
          bash scripts/release/android-updater-feed.sh --write-feed \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RELEASE_BASE_URL" \
            "$exe" "$win_sig" "$apk" "${apk}.sig" dist/latest.json
          checksum_file="$(mktemp)"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
          )

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew
          path: tap

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # The notes live in packaging/release-notes.md rather than inline.
          # A heredoc cannot be used here: its terminator has to sit at column
          # zero, and column zero inside a YAML block scalar ends the block. A
          # file also makes the text reviewable in a diff instead of buried in
          # a workflow step.
          [[ -f packaging/release-notes.md ]] || { echo "::error::packaging/release-notes.md missing"; exit 1; }

          # --verify-tag: refuse to create a release for a tag that does not
          # exist, so a typo in a manual dispatch cannot invent one.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          else
            prerelease+=(--latest)
          fi
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file packaging/release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            dist/*.dmg dist/*.dmg.sha256 \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            dist/*.apk dist/*.apk.sig dist/*.apk.sha256 \
            dist/*.exe dist/*.exe.sig dist/latest.json dist/SHA256SUMS \
            tap/Casks/copypaste.rb \
            tap/Formula/copypaste-cli.rb

      - name: Publish to the Homebrew tap
        # Skipped entirely when the secret is absent, which is the default. The
        # cask and formula are attached to the release above either way, so a
        # maintainer can always copy them across by hand — the token buys
        # convenience, not capability.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set — skipping tap publication."
            echo "The cask and formula are attached to the release; copy them into"
            echo "the tap by hand, or run scripts/release/setup-tap.sh --help."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-copypaste.git" \
            tap-repo

          mkdir -p tap-repo/Casks tap-repo/Formula
          cp tap/Casks/copypaste.rb        tap-repo/Casks/copypaste.rb
          cp tap/Formula/copypaste-cli.rb  tap-repo/Formula/copypaste-cli.rb

          cd tap-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula

          if git diff --cached --quiet; then
            echo "Tap already up to date."
            exit 0
          fi

          git commit -m "copypaste ${VERSION}"
          git push origin HEAD:main
