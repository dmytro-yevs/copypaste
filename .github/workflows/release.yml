  android:
    name: Assemble and sign Android universal APK
    needs: [version, android-abi]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.96"
      NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-36"
      BUILD_TOOLS_VERSION: "36.0.0"
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-release-x86_64-assembly
          save-if: "true"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            crates/copypaste-ui/src-tauri/gen/android/**/*.gradle*
            crates/copypaste-ui/src-tauri/gen/android/**/gradle-wrapper.properties
      - name: Install Android packaging tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          [[ -d "$ndk" ]] || { echo "::error::the pinned Android NDK is missing"; exit 1; }
          {
            echo "NDK_HOME=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
          } >> "$GITHUB_ENV"
      - name: Point the Android build at NDK binutils
        run: |
          set -euo pipefail
          ./scripts/release/android-ndk-env.sh "$NDK_HOME" | tee -a "$GITHUB_ENV"
      - name: Render signed Android updater configuration
        run: |
          set -euo pipefail
          bash scripts/release/android-updater-feed.sh --render-config \
            crates/copypaste-ui/src-tauri/tauri.android.signed.conf.template.json \
            crates/copypaste-ui/src-tauri/tauri.android.signed.generated.conf.json \
            "$TAURI_UPDATER_PUBLIC_KEY" "$TAURI_UPDATER_ENDPOINT"
      - name: Generate runner-local Tauri Gradle settings
        run: |
          set -euo pipefail
          for tool in perl make; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is required to build OpenSSL for Android"; exit 1; }
          done
          cd crates/copypaste-ui
          npm ci
          npm run tauri -- android build --apk --target x86_64 \
            --config src-tauri/tauri.android.signed.generated.conf.json
          for generated in \
            src-tauri/gen/android/tauri.settings.gradle \
            src-tauri/gen/android/app/tauri.build.gradle.kts \
            src-tauri/gen/android/app/tauri.properties \
            src-tauri/gen/android/app/src/main/jniLibs/x86_64/libcopypaste_ui_lib.so; do
            [[ -f "$generated" ]] || { echo "::error::Tauri did not generate $generated"; exit 1; }
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-native-aarch64
          path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-native-armv7
          path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-native-i686
          path: crates/copypaste-ui/src-tauri/gen/android/app/src/main/jniLibs/x86
      - name: Assemble the prelinked universal APK
        run: |
          set -euo pipefail
          cd crates/copypaste-ui/src-tauri/gen/android
          ./gradlew --no-daemon \
            clean \
            assembleUniversalRelease \
            -PabiList=arm64-v8a,armeabi-v7a,x86,x86_64 \
            -ParchList=arm64,arm,x86,x86_64 \
            -PtargetList=aarch64,armv7,i686,x86_64 \
            -x rustBuildUniversalRelease \
            -x rustBuildArm64Release \
            -x rustBuildArmRelease \
            -x rustBuildX86Release \
            -x rustBuildX86_64Release
          outputs="app/build/outputs/apk"
          published="$(find "$outputs" -name '*universal*release*.apk' -print -quit)"
          [[ -n "$published" ]] || { echo "::error::the universal release APK was not assembled"; exit 1; }
          cp "$published" "${RUNNER_TEMP}/copypaste-release-unsigned.apk"

      - name: Locate and sign the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="${RUNNER_TEMP}/copypaste-release-unsigned.apk"
          [[ -f "$unsigned" ]] || { echo "::error::the staged release APK is missing"; exit 1; }
          echo "Built: $unsigned"
          libs="$(unzip -l "$unsigned")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/${abi}/libcopypaste_ui_lib.so" <<<"$libs" \
              || { echo "::error::the universal APK is missing ${abi}"; exit 1; }
          done

          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          mkdir -p dist

          # Report what the APK claims about itself before signing it. The macOS
          # job makes the same check on CFBundleShortVersionString: a version
          # that silently loses its -alpha.1 suffix is survivable, a version that
          # disagrees in its numeric core is a broken release.
          if [[ -x "${tools}/aapt2" ]]; then
            badging="$("${tools}/aapt2" dump badging "$unsigned" 2>/dev/null || true)"
            name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
            code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
            echo "APK versionName=${name:-<unset>} versionCode=${code:-<unset>}"
            if [[ -n "$name" && "$name" != "$VERSION" ]]; then
              if [[ "$name" == "${VERSION%%-*}" ]]; then
                echo "::warning::the APK versionName is '$name' but this release is '$VERSION' — the pre-release suffix was dropped"
              else
                echo "::error::the APK versionName is '$name' but this release is '$VERSION'"
                exit 1
              fi
            fi
          fi

          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Android release signing is fail-closed (ADR-0006): missing ${missing[*]}. No APK will be uploaded or published."
            exit 1
          fi

          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "Signing with the release keystore from repository secrets."

          expected_cert="$(node scripts/release/android-metadata.mjs --field releaseCertificateSha256)"
          if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cargo.toml must contain one Android release certificate SHA-256 fingerprint"
            exit 1
          fi

          out="dist/CopyPaste-v${VERSION}-android.apk"
          "${tools}/zipalign" -p -f 4 "$unsigned" "${out}.aligned"
          "${tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$out" \
            "${out}.aligned"
          rm -f "${out}.aligned" "$keystore"

          signer_report="$("${tools}/apksigner" verify --verbose --print-certs "$out")"
          printf '%s\n' "$signer_report"
          mapfile -t signer_certs < <(printf '%s\n' "$signer_report" \
            | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if (( ${#signer_certs[@]} != 1 )); then
            echo "::error::APK must contain exactly one signing certificate"
            exit 1
          fi
          actual_cert="${signer_certs[0]}"
          if [[ ! "$actual_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::apksigner did not report the SHA-256 certificate fingerprint"
            exit 1
          fi
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signer fingerprint does not match Cargo.toml release metadata"
            exit 1
          fi
          bash scripts/release/android-artifact-check.sh \
            --apk "$out" --build-type release \
            --aapt2 "${tools}/aapt2" --apksigner "${tools}/apksigner" \
            --expected-cert "$expected_cert"
          bash scripts/release/android-updater-feed.sh \
            --sign-apk "$out" "$out.sig"
          ( cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )
          cat "${out}.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          apk="$(find dist -name '*.apk' -print -quit)"
          {
            echo '## Android'
            echo
            echo '```'
            ( cd dist && sha256sum ./*.apk )
            # The certificate digest is the number that decides whether the next
            # release can upgrade this one. Publishing it costs nothing and makes
            # a key change visible without installing anything.
            "${tools}/apksigner" verify --print-certs "$apk" 2>/dev/null \
              | grep -i 'SHA-256 digest' || true
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.apk.sig
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  android-upgrade-fixture:
    name: Build Android upgrade fixture (x86_64)
    needs: version
