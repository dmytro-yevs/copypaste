name: Linux native diagnostic driver

on:
  workflow_dispatch:
    inputs:
      expected_product_commit:
        description: Exact product commit represented by every supplied artifact source
        required: true
        type: string
        default: "180f03bc302933402474e42ad88aaf29c2be5790"
      artifact_run_id: {description: Completed historical artifact staging run, required: true, type: string, default: "38089095415"}
      previous_artifact_run_id: {description: Optional historical baseline run for upgrade diagnosis, required: false, type: string, default: ""}
      supabase_module_run_id: {description: Exact-product Supabase module run, required: true, type: string, default: "38086419088"}
      semantic_search_module_run_id: {description: Exact-product Semantic Search module run, required: true, type: string, default: "38086419076"}
      ocr_module_run_id: {description: Exact-product OCR module run, required: true, type: string, default: "38086419262"}
      compositor_runtime_run_id: {description: Exact-product trusted compositor producer run, required: true, type: string, default: "38086399840"}

concurrency:
  group: linux-native-diagnostic-${{ github.ref }}-${{ inputs.artifact_run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  diagnostic:
    name: Run disposable Linux desktop diagnosis
    uses: ./.github/workflows/linux-native-diagnostic.yml
    with:
      expected_product_commit: ${{ inputs.expected_product_commit }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      previous_artifact_run_id: ${{ inputs.previous_artifact_run_id }}
      supabase_module_run_id: ${{ inputs.supabase_module_run_id }}
      semantic_search_module_run_id: ${{ inputs.semantic_search_module_run_id }}
      ocr_module_run_id: ${{ inputs.ocr_module_run_id }}
      compositor_runtime_run_id: ${{ inputs.compositor_runtime_run_id }}
