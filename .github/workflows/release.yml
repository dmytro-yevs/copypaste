              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$out" \
              "${out}.aligned"
            rm -f "${out}.aligned" "$keystore"
          fi
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          expected_cert="$(node scripts/release/android-metadata.mjs --field releaseCertificateSha256)"
