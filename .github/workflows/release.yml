name: Release

# Builds and publishes a release for both platforms from one page: the macOS
# .app in a DMG, the CLI and daemon in a tarball, the Homebrew cask and formula
# that point at both, and an Android APK a user can download and install.
#
# NOTHING IN THIS FILE HOLDS A SIGNING CREDENTIAL
# That is the entire premise of ADR-0001, not an accident of the current setup.
# There is no APPLE_CERTIFICATE, no APPLE_ID, no APPLE_TEAM_ID, no notarisation
# step and no keychain import. Signing is ad-hoc (`codesign --sign -`), which
# needs no identity and no secret. If a future change adds one, ADR-0001 has to
# change first — a Developer ID would make most of this workflow, and the
# cask's postflight, unnecessary.
#
# The one optional secret that is not a signing credential is
# HOMEBREW_TAP_TOKEN: contents:write on the tap repository so the workflow can
# publish the updated cask. Without it the workflow still succeeds and attaches
# the cask and formula to the release for a maintainer to copy across by hand.
#
# ANDROID_* is a different matter and is not covered by the paragraph above.
# Android will not install an unsigned APK at all, so there is no ad-hoc
# equivalent and no way to defer signing to the device. All four release-signing
# secrets are required: a release without its durable key fails closed before it
# can upload a non-upgradable artefact. ADR-0006 records that decision.
#
# UNVERIFIED
# This project is developed on Linux. Every macOS-specific step below —
# codesign, hdiutil, PlistBuddy, the Tauri macOS bundler, and whether the
# resulting bundle actually launches — was written from documentation and from
# v1's scripts on archive/v0.4.1-pre-rewrite. None of it has been executed on a
# Mac. Treat the first run as an experiment and read the log.
#
# Why this is not cargo-dist
# AGENTS.md rule 1 makes a maintained tool the default, so cargo-dist (now
# "dist") was evaluated first. It does not package macOS .app bundles or DMGs.
# axodotdev/cargo-dist#24, "macos .dmg/.app installer support?", has been open
# since October 2022 and the maintainers' position on it is that it is "more
# gui app specific ... out of scope for MVP". Its supported artefacts are
# tarballs of plain binaries; its Homebrew installer generates a formula and
# has no cask support, so it cannot express `app "CopyPaste.app"` or the
# postflight ADR-0001 requires. It would therefore cover the CLI tarball and
# formula and nothing else — the .app, the DMG, the cask and the quarantine
# handling would still be hand-written, and the release would be split across
# two systems that each want to own the GitHub Release.
#
# Verdict: not adopted, and the reason is capability rather than preference.
# Worth revisiting if #24 is ever implemented, at which point the CLI half of
# this workflow could be deleted outright.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 2.0.0-alpha.1)"
        required: true
        type: string
      publish:
        description: "Create a GitHub Release and publish to the tap"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  supabase-gate:
    name: Real Supabase integration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Exercise the disposable Supabase stack
        run: bash supabase/tests/real-supabase.sh

  # Resolve the version once, so the tag, the workspace manifest, the DMG
  # filename, the cask and the formula cannot disagree with each other.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - name: Install release metadata dependencies
        run: npm ci --prefix crates/copypaste-ui --ignore-scripts

      - id: resolve
        # The dispatch inputs arrive as environment variables rather than
        # through `${{ }}`. Interpolation splices the value into the script
        # text before bash sees it, so a version containing a backtick or a
        # semicolon would execute rather than fail validation.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION:-}"
            publish="${INPUT_PUBLISH:-false}"
          fi
          version="${version#v}"

          # Cargo workspace metadata is authoritative. The resolver also holds
          # package.json and Tauri's version indirection equal to it before it
          # emits the Android versionName and monotonic versionCode.
          ws="$(node scripts/release/android-metadata.mjs --field versionName)"
          if [[ "$ws" != "$version" ]]; then
            echo "::error::version mismatch — requested '$version', Cargo.toml [workspace.package] says '$ws'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $version (publish=$publish)"

  pairing-e2e:
    name: Pairing native E2E gate
    needs: version
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml outranks the toolchain step's `rustup default`, so
      # the bare cargo below would build on whatever stable is that week.
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libwebkit2gtk-4.1-dev webkit2gtk-driver \
            libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: linux-1.96
          key: pairing-e2e-release
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            crates/copypaste-ui/package-lock.json
            e2e/package-lock.json
      - name: Build pairing surfaces
        run: cargo build -p copypaste-ui -p copypaste-daemon -p copypaste-cli --locked
      - name: Install frontend dependencies
        working-directory: crates/copypaste-ui
        run: npm ci
      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci
      - name: Run pairing gate
        working-directory: e2e
        run: npm test -- tests/devices.e2e.test.ts

  # Build on macOS. arm64 only: the release ships a single aarch64 slice, not a
  # universal binary, matching `depends_on arch: :arm64` in the cask. Homebrew
  # is winding down Intel support and this project has no Intel user to serve.
  macos:
    name: Build macOS (arm64)
    needs: version
    runs-on: macos-14
    # A macOS runner bills at ten times a Linux one, and the default job timeout
    # is six hours. A Tauri build that hangs would spend a day of quota.
    timeout-minutes: 90
    env:
      # `dtolnay/rust-toolchain` sets its toolchain with `rustup default`, and
      # rust-toolchain.toml — channel = "stable" — outranks the default. Without
      # this the release scripts' bare `cargo` builds on whatever stable is that
      # week, not on the pinned 1.96. RUSTUP_TOOLCHAIN outranks both.
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-14-release
          # SQLCipher compiles from C on a cold cache and dominates the build.
          # Saving on a release run keeps the next one usable.
          save-if: "true"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - name: Confirm no signing identity is present
        # A guard, not a formality. If a Developer ID ever appears in the
        # runner keychain or the environment, the build would silently start
        # producing something ADR-0001 does not describe, and the difference
        # would not be visible in any artefact name.
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}${APPLE_CERTIFICATE:-}${APPLE_ID:-}" ]]; then
            echo "::error::an Apple signing credential is present in the environment; ADR-0001 says this pipeline has none"
            exit 1
          fi
          echo "Signing identities available to this runner:"
          security find-identity -v -p codesigning || true

      - name: Build and sign CopyPaste.app
        run: ./scripts/release/build-macos-app.sh "${{ needs.version.outputs.version }}" arm64

      - name: Package DMG
        run: ./scripts/release/make-dmg.sh "${{ needs.version.outputs.version }}" arm64

      - name: Package CLI tarball
        run: ./scripts/release/build-cli-tarball.sh "${{ needs.version.outputs.version }}" arm64

      - name: Verify nothing links outside the bundle
        # SQLCipher is compiled from C in this build and libsqlite3-sys picks its
        # crypto backend by the *absence* of OPENSSL_DIR — see the script header.
        # Getting that wrong yields a DMG that mounts and launches on this runner
        # and dies with a dyld error on every user's Mac. No other step here would
        # notice: the pipeline has no install test.
        run: |
          set -euo pipefail
          ./scripts/release/check-macos-linkage.sh \
            dist/CopyPaste.app \
            target/aarch64-apple-darwin/release/copypaste \
            target/aarch64-apple-darwin/release/copypaste-daemon

      - name: Install the DMG and run it
        # The first thing in this pipeline that opens what it built. It mounts
        # the image, copies the app to /Applications, quarantines it the way a
        # download is quarantined, runs the cask's postflight, and then starts
        # the daemon from inside the bundle and copies something with pbcopy.
        # The legs that need a window server are reported rather than enforced;
        # the script's header says which is which.
        run: |
          set -euo pipefail
          ./scripts/release/smoke-macos-dmg.sh "${{ needs.version.outputs.version }}" arm64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-native-evidence
          path: artifacts/release-macos-native
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-cloud-evidence
          path: artifacts/release-macos-cloud
          if-no-files-found: error
          retention-days: 14

      - name: Checksums
        run: |
          set -euo pipefail
          {
            echo '## Artefacts'
            echo
            echo '```'
            ( cd dist && shasum -a 256 ./*.dmg ./*.tar.gz )
            echo '```'
            echo
            echo 'Ad-hoc signed, not notarised — see ADR-0001.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # Build the Android APK.
  #
  # UNVERIFIED, in the same sense as the macOS job and then some: no Android
  # build has ever run in this repository, and the Tauri Android scaffold under
  # crates/copypaste-ui/src-tauri/gen/android is new. Every path below is
  # asserted before it is used, so a scaffold that landed somewhere else fails
  # with a sentence rather than a stack trace.
  #
  # Signing is ADR-0006. Android will not install an unsigned APK, and an APK
  # signed with a per-run key cannot upgrade an existing install. All four
  # release-key secrets are therefore required; their absence fails this job
  # before any Android artifact is uploaded or published.
  android:
    name: Build Android (universal APK)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # See the macOS job: rust-toolchain.toml outranks `rustup default`, so
      # without this the Rust half of the Gradle build runs under stable — for
      # which `dtolnay/rust-toolchain` installed no Android target. The symptom
      # is `can't find crate for 'std'` from inside a Gradle task.
      RUSTUP_TOOLCHAIN: "1.96"
      # Pinned for the reason rust-toolchain.toml exists. An NDK that floats is
      # a build that changes under you, and the failure surfaces as a linker
      # error three layers down.
      NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-36"
      BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.96"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-release
          save-if: "true"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            crates/copypaste-ui/src-tauri/gen/android/**/*.gradle*
            crates/copypaste-ui/src-tauri/gen/android/**/gradle-wrapper.properties

      - name: Install the pinned SDK components
        run: |
          set -euo pipefail
          # The runner image ships the SDK and cmdline-tools; this only adds the
          # pinned pieces. Asserting ANDROID_HOME rather than assuming it keeps
          # a runner-image change from failing later and less clearly.
          : "${ANDROID_HOME:?ANDROID_HOME is unset — the runner image has no Android SDK}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || { echo "::error::$sdkmanager not found"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          # Asserted, not assumed. sdkmanager reports an unknown package as
          # `Warning: Failed to find package …` and has exited 0 doing it, which
          # would leave NDK_HOME pointing at nothing and surface four steps later
          # as a linker error. The runner image pins its own NDK revision, so
          # this list is exactly the set that had to be downloaded.
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          [[ -d "$ndk" ]] || { echo "::error::sdkmanager did not install ndk;${NDK_VERSION} — $ndk is absent"; exit 1; }
          [[ -d "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}" ]] \
            || { echo "::error::sdkmanager did not install platforms;${ANDROID_PLATFORM}"; exit 1; }
          for t in zipalign apksigner aapt2; do
            [[ -x "${tools}/${t}" ]] \
              || { echo "::error::${tools}/${t} is missing — build-tools;${BUILD_TOOLS_VERSION} did not install"; exit 1; }
          done

          {
            echo "NDK_HOME=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
          } >> "$GITHUB_ENV"

      - name: Confirm the OpenSSL build toolchain is present
        # New requirement as of ADR-0007. The NDK sysroot has no libcrypto, so
        # SQLCipher's OpenSSL is compiled from source per ABI by openssl-src,
        # which shells out to both of these. Asserted for the same reason the
        # SDK components above are: absent, perl surfaces as a cc-rs failure
        # several minutes into the Rust build, naming neither perl nor OpenSSL.
        run: |
          set -euo pipefail
          for tool in perl make; do
            command -v "$tool" >/dev/null 2>&1 \
              || { echo "::error::$tool is required to build OpenSSL for Android (ADR-0007)"; exit 1; }
          done
          perl --version | sed -n '2p'
          make --version | sed -n '1p'

      - name: Point the Android builds at the NDK's llvm-ar and llvm-ranlib
        # cc-rs derives an Android target's ranlib from the triple when nothing
        # exports one, and the NDK stopped shipping `<triple>-ranlib` in r23.
        # The script says the rest; it is separate so check.sh can execute it,
        # because the variable names are the whole of the fix.
        run: |
          set -euo pipefail
          ./scripts/release/android-ndk-env.sh "$NDK_HOME" | tee -a "$GITHUB_ENV"

      - name: Build the APK
        run: |
          set -euo pipefail
          gen="crates/copypaste-ui/src-tauri/gen/android"
          if [[ ! -d "$gen" ]]; then
            echo "::error::$gen does not exist. The Tauri Android project is tracked source,"
            echo "::error::not something this job regenerates — see its README. Restore it or"
            echo "::error::fix this path; do not skip the job."
            exit 1
          fi

          cd crates/copypaste-ui
          npm ci

          # `tauri android init` is deliberately NOT run here. It cannot produce
          # what the first run of this job asked it for: tauri.settings.gradle
          # and app/tauri.build.gradle.kts are not in the CLI's template at all.
          # They are written by the *Rust* build — tauri-build's build script,
          # gated on TAURI_ANDROID_PROJECT_PATH — which `tauri android build`
          # runs itself, before Gradle, at "run an initial build to initialize
          # plugins". So the ignored files appear exactly when Gradle needs
          # them. Everything init would write is committed; see
          # src-tauri/gen/android/README.md.
          #
          # What is asserted instead is the half Gradle reads at configuration
          # time and the Kotlin that makes the APK worth shipping. An APK that
          # builds, installs and captures nothing is the failure this guards.
          for f in src-tauri/gen/android/settings.gradle \
                   src-tauri/gen/android/build.gradle.kts \
                   src-tauri/gen/android/gradlew \
                   src-tauri/gen/android/app/build.gradle.kts \
                   src-tauri/gen/android/buildSrc/src/main/java/com/copypaste/app/kotlin/BuildTask.kt \
                   src-tauri/gen/android/app/src/main/AndroidManifest.xml \
                   src-tauri/gen/android/app/src/main/aidl/android/content/IOnPrimaryClipChangedListener.aidl; do
            [[ -f "$f" ]] || { echo "::error::$f is missing from the checkout"; exit 1; }
          done
          for k in CapturePlugin IntakeActivity CaptureTileService ShizukuClipboard \
                   ClipListener CaptureService CaptureNotifications ClipQueue; do
            f="src-tauri/gen/android/app/src/main/java/com/copypaste/app/${k}.kt"
            [[ -f "$f" ]] || { echo "::error::$f is missing — the Android capture feature would build empty"; exit 1; }
          done

          # Gradle re-enters the CLI through this line, in a subprocess, with
          # src-tauri as its working directory. Baked in by init from however
          # init itself was invoked, so it is the one committed file that can
          # silently disagree with how this job starts the build.
          grep -q 'val executable = """npm"""' \
            src-tauri/gen/android/buildSrc/src/main/java/com/copypaste/app/kotlin/BuildTask.kt || {
            echo "::error::BuildTask.kt does not invoke the CLI through npm, but this step does"
            exit 1
          }

          previous="$(node ../../scripts/release/android-metadata.mjs --previous-fixture)"
          previous_config="${RUNNER_TEMP}/copypaste-previous-tauri.json"
          COPYPASTE_ANDROID_UPGRADE_FIXTURE=1 \
            node ../../scripts/release/android-metadata.mjs \
              --version "$previous" --write-overlay "$previous_config"
          npm run tauri -- android build --apk --config "$previous_config"
          outputs="src-tauri/gen/android/app/build/outputs/apk"
          previous_apk="$(find "$outputs" -name '*universal*release*.apk' -print -quit)"
          [[ -n "$previous_apk" ]] || { echo "::error::the previous-version universal APK was not produced"; exit 1; }
          cp "$previous_apk" "${RUNNER_TEMP}/copypaste-previous-unsigned.apk"
          find "$outputs" -type f -name '*.apk' -delete

          npm run tauri -- android build --apk

          published="$(find "$outputs" -name '*universal*release*.apk' -print -quit)"
          [[ -n "$published" ]] || { echo "::error::the universal release APK was not produced"; exit 1; }
          cp "$published" "${RUNNER_TEMP}/copypaste-release-unsigned.apk"
          find "$outputs" -type f -name '*.apk' -delete

          COPYPASTE_CLOUD_URL=http://10.0.2.2:47800 \
          COPYPASTE_CLOUD_ANON_KEY=native-evidence \
            npm run tauri -- android build --apk --target x86_64
          configured="$(find "$outputs" -name '*release*.apk' -print -quit)"
          [[ -n "$configured" ]] || { echo "::error::the configured x86_64 evidence APK was not produced"; exit 1; }
          cp "$configured" "${RUNNER_TEMP}/copypaste-cloud-evidence-unsigned.apk"

      - name: Locate and sign the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="${RUNNER_TEMP}/copypaste-release-unsigned.apk"
          previous_unsigned="${RUNNER_TEMP}/copypaste-previous-unsigned.apk"
          cloud_unsigned="${RUNNER_TEMP}/copypaste-cloud-evidence-unsigned.apk"
          [[ -f "$unsigned" && -f "$previous_unsigned" && -f "$cloud_unsigned" ]] \
            || { echo "::error::the staged release APKs are missing"; exit 1; }
          echo "Built: $unsigned"

          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          mkdir -p dist evidence-dist upgrade-dist

          # Report what the APK claims about itself before signing it. The macOS
          # job makes the same check on CFBundleShortVersionString: a version
          # that silently loses its -alpha.1 suffix is survivable, a version that
          # disagrees in its numeric core is a broken release.
          if [[ -x "${tools}/aapt2" ]]; then
            badging="$("${tools}/aapt2" dump badging "$unsigned" 2>/dev/null || true)"
            name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
            code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
            echo "APK versionName=${name:-<unset>} versionCode=${code:-<unset>}"
            if [[ -n "$name" && "$name" != "$VERSION" ]]; then
              if [[ "$name" == "${VERSION%%-*}" ]]; then
                echo "::warning::the APK versionName is '$name' but this release is '$VERSION' — the pre-release suffix was dropped"
              else
                echo "::error::the APK versionName is '$name' but this release is '$VERSION'"
                exit 1
              fi
            fi
          fi

          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Android release signing is fail-closed (ADR-0006): missing ${missing[*]}. No APK will be uploaded or published."
            exit 1
          fi

          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "Signing with the release keystore from repository secrets."

          expected_cert="$(node scripts/release/android-metadata.mjs --field releaseCertificateSha256)"
          if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cargo.toml must contain one Android release certificate SHA-256 fingerprint"
            exit 1
          fi

          out="dist/CopyPaste-v${VERSION}-android.apk"
          "${tools}/zipalign" -p -f 4 "$unsigned" "${out}.aligned"
          "${tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$out" \
            "${out}.aligned"
          previous_out="upgrade-dist/copypaste-previous-release.apk"
          "${tools}/zipalign" -p -f 4 "$previous_unsigned" "${previous_out}.aligned"
          "${tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$previous_out" \
            "${previous_out}.aligned"
          cloud_out="evidence-dist/copypaste-cloud-evidence-x86_64-release.apk"
          "${tools}/zipalign" -p -f 4 "$cloud_unsigned" "${cloud_out}.aligned"
          "${tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$cloud_out" \
            "${cloud_out}.aligned"
          rm -f "${out}.aligned" "${previous_out}.aligned" "${cloud_out}.aligned" "$keystore"
          "${tools}/apksigner" verify "$previous_out"
          "${tools}/apksigner" verify "$cloud_out"

          signer_report="$("${tools}/apksigner" verify --verbose --print-certs "$out")"
          printf '%s\n' "$signer_report"
          mapfile -t signer_certs < <(printf '%s\n' "$signer_report" \
            | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if (( ${#signer_certs[@]} != 1 )); then
            echo "::error::APK must contain exactly one signing certificate"
            exit 1
          fi
          actual_cert="${signer_certs[0]}"
          if [[ ! "$actual_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::apksigner did not report the SHA-256 certificate fingerprint"
            exit 1
          fi
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signer fingerprint does not match Cargo.toml release metadata"
            exit 1
          fi
          bash scripts/release/android-artifact-check.sh \
            --apk "$out" --build-type release \
            --aapt2 "${tools}/aapt2" --apksigner "${tools}/apksigner" \
            --expected-cert "$expected_cert"
          previous="$(node scripts/release/android-metadata.mjs --previous-fixture)"
          COPYPASTE_ANDROID_UPGRADE_FIXTURE=1 bash scripts/release/android-artifact-check.sh \
            --apk "$previous_out" --build-type release --version "$previous" \
            --aapt2 "${tools}/aapt2" --apksigner "${tools}/apksigner" \
            --expected-cert "$expected_cert"
          ( cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )
          cat "${out}.sha256"

      - name: Summary
        run: |
          set -euo pipefail
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          apk="$(find dist -name '*.apk' -print -quit)"
          {
            echo '## Android'
            echo
            echo '```'
            ( cd dist && sha256sum ./*.apk )
            # The certificate digest is the number that decides whether the next
            # release can upgrade this one. Publishing it costs nothing and makes
            # a key change visible without installing anything.
            "${tools}/apksigner" verify --print-certs "$apk" 2>/dev/null \
              | grep -i 'SHA-256 digest' || true
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-cloud-evidence-apk
          path: evidence-dist/copypaste-cloud-evidence-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-upgrade-fixture
          path: upgrade-dist/copypaste-previous-release.apk
          if-no-files-found: error
          retention-days: 7

  # Test the signed universal artifact, not a separately assembled emulator
  # APK. This job downloads exactly what `publish` will later download, checks
  # its sidecar digest, and installs/runs it through the release smoke harness.
  # It runs only when a release can be published; a non-publishing dispatch may
  # still build artifacts without spending an emulator runner.
  android-smoke:
    name: Smoke-test published Android APK
    needs: [version, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-cloud-evidence-apk
          path: evidence-dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-upgrade-fixture
          path: upgrade-dist

      - name: Verify the release artifact identity
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="dist/CopyPaste-v${VERSION}-android.apk"
          sidecar="${apk}.sha256"
          [[ -f "$apk" ]] || { echo "::error::$apk is missing from the Android artifact"; exit 1; }
          [[ -f "$sidecar" ]] || { echo "::error::$sidecar is missing from the Android artifact"; exit 1; }
          ( cd dist && sha256sum --check "$(basename "$sidecar")" )
          echo "Testing $(sha256sum "$apk" | cut -d' ' -f1)  $(basename "$apk")"

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [[ -e /dev/kvm ]] || { echo "::error::/dev/kvm is absent — this runner cannot accelerate the emulator"; exit 1; }

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "36"
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ./scripts/release/android-release-emulator-legs.sh
        env:
          APK: dist/CopyPaste-v${{ needs.version.outputs.version }}-android.apk
          PREVIOUS_APK: upgrade-dist/copypaste-previous-release.apk
          SMOKE_OUT: artifacts/release-android-smoke
          STORAGE_OUT: artifacts/release-android-storage
          CLOUD_MODE: all
          CLOUD_EVIDENCE_APK: evidence-dist/copypaste-cloud-evidence-x86_64-release.apk
          CLOUD_OUT: artifacts/release-android-cloud

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-smoke-evidence
          path: artifacts/release-android-smoke
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-storage-evidence
          path: artifacts/release-android-storage
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-cloud-evidence
          path: artifacts/release-android-cloud
          if-no-files-found: error
          retention-days: 14

  # The emulator never executes the aarch64 native library and cannot stand in
  # for a phone. Publishing therefore waits for this labelled runner, with one
  # exclusively attached physical arm64 Android device, to run the signed APK.
  android-hardware:
    name: Gate release on a physical arm64 Android device
    needs: [version, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: [self-hosted, linux, ARM64, android-device]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - name: Verify the runner owns one physical arm64 device
        run: |
          set -euo pipefail
          command -v adb >/dev/null 2>&1 || { echo "::error::adb is not installed on the hardware runner"; exit 1; }
          mapfile -t devices < <(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }')
          (( ${#devices[@]} == 1 )) || { echo "::error::expected exactly one ready Android device, found ${#devices[@]}"; exit 1; }
          [[ "${devices[0]}" != emulator-* ]] || { echo "::error::the release gate requires physical hardware, not an emulator"; exit 1; }
          echo "ANDROID_SERIAL=${devices[0]}" >> "$GITHUB_ENV"
          abi="$(adb -s "${devices[0]}" shell getprop ro.product.cpu.abi | tr -d '\r')"
          [[ "$abi" == arm64-v8a ]] || { echo "::error::the release gate requires arm64-v8a, found '$abi'"; exit 1; }

      - name: Smoke-test the signed release APK on hardware
        env:
          APK: dist/CopyPaste-v${{ needs.version.outputs.version }}-android.apk
          SMOKE_OUT: artifacts/release-android-hardware
        run: |
          set -euo pipefail
          [[ -f "$APK" ]] || { echo "::error::$APK is missing from the Android artifact"; exit 1; }
          set +e
          ./scripts/release/android-smoke-release.sh; smoke=$?
          SMOKE_OUT=artifacts/release-android-hardware-storage \
            ./scripts/release/android-storage-transfer.sh; storage=$?
          set -e
          [ $smoke -eq 0 ] && [ $storage -eq 0 ]

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-android-hardware-evidence
          path: |
            artifacts/release-android-hardware
            artifacts/release-android-hardware-storage
          if-no-files-found: error
          retention-days: 30

  native-parity:
    name: Gate publication on native evidence
    needs: [version, macos, android-hardware]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject unproven performance credits
        run: python3 scripts/check-feature-ledger.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-native-evidence
          path: artifacts/native-parity/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-android-hardware-evidence
          path: artifacts/native-parity/android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/copypaste-ui/package-lock.json
      - run: npm ci
        working-directory: crates/copypaste-ui
      - name: Validate release-native parity
        working-directory: crates/copypaste-ui
        run: >-
          npm run check:native-parity --
          --require macos,android
          --commit ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --evidence ${{ github.workspace }}/artifacts/native-parity/macos/native-evidence.json
          --evidence ${{ github.workspace }}/artifacts/native-parity/android/release-android-hardware/native-evidence.json

  # Generate the cask and the formula from the artefacts that were actually
  # built, so the checksums come from the files being published rather than
  # from a re-download.
  packaging:
    name: Generate cask and formula
    needs: [version, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64
          path: dist

      - name: Stamp cask and formula
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"

          dmg="dist/CopyPaste-v${version}-macos-arm64.dmg"
          tgz="dist/copypaste-cli-v${version}-macos-arm64.tar.gz"
          [[ -f "$dmg" ]] || { echo "::error::$dmg missing"; exit 1; }
          [[ -f "$tgz" ]] || { echo "::error::$tgz missing"; exit 1; }

          # Computed from the artefact, not read from the .sha256 sidecar.
          # Trusting the sidecar would mean the cask and the file it verifies
          # could both be wrong in the same way.
          dmg_sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          tgz_sha="$(sha256sum "$tgz" | cut -d' ' -f1)"

          # And then check the sidecars agree, because a disagreement means
          # something rewrote an artefact between jobs.
          grep -q "$dmg_sha" "${dmg}.sha256" || { echo "::error::DMG checksum does not match its .sha256 sidecar"; exit 1; }
          grep -q "$tgz_sha" "${tgz}.sha256" || { echo "::error::tarball checksum does not match its .sha256 sidecar"; exit 1; }

          ./scripts/release/gen-cask.sh    "$version" "$dmg_sha" --out tap
          ./scripts/release/gen-formula.sh "$version" "$tgz_sha" --out tap

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew
          path: tap/
          if-no-files-found: error

  # Publish.
  publish:
    name: Publish release
    # android is a hard dependency, not a nice-to-have: ADR-0006 says one
    # release page serves both platforms, and a page that silently serves one is
    # worse than a failed run.
    needs: [version, supabase-gate, pairing-e2e, macos, android, android-smoke, android-hardware, native-parity, packaging]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The only widened permission in this file, and only on this job.
      contents: write
    steps:
      # Needed for packaging/release-notes.md.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew
          path: tap

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # The notes live in packaging/release-notes.md rather than inline.
          # A heredoc cannot be used here: its terminator has to sit at column
          # zero, and column zero inside a YAML block scalar ends the block. A
          # file also makes the text reviewable in a diff instead of buried in
          # a workflow step.
          [[ -f packaging/release-notes.md ]] || { echo "::error::packaging/release-notes.md missing"; exit 1; }

          # --verify-tag: refuse to create a release for a tag that does not
          # exist, so a typo in a manual dispatch cannot invent one.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file packaging/release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            dist/*.dmg dist/*.dmg.sha256 \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            dist/*.apk dist/*.apk.sha256 \
            tap/Casks/copypaste.rb \
            tap/Formula/copypaste-cli.rb

      - name: Publish to the Homebrew tap
        # Skipped entirely when the secret is absent, which is the default. The
        # cask and formula are attached to the release above either way, so a
        # maintainer can always copy them across by hand — the token buys
        # convenience, not capability.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set — skipping tap publication."
            echo "The cask and formula are attached to the release; copy them into"
            echo "the tap by hand, or run scripts/release/setup-tap.sh --help."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-copypaste.git" \
            tap-repo

          mkdir -p tap-repo/Casks tap-repo/Formula
          cp tap/Casks/copypaste.rb        tap-repo/Casks/copypaste.rb
          cp tap/Formula/copypaste-cli.rb  tap-repo/Formula/copypaste-cli.rb

          cd tap-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula

          if git diff --cached --quiet; then
            echo "Tap already up to date."
            exit 0
          fi

          git commit -m "copypaste ${VERSION}"
          git push origin HEAD:main
