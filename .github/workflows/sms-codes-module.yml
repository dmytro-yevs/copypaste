name: Build SMS Codes module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: arm, target: armv7-linux-androideabi }
          - { architecture: aarch64, target: aarch64-linux-android }
          - { architecture: x86_64, target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: modules/sms-codes
      - name: Check recognition and build Android package
        run: |
          cargo +1.96 test --manifest-path modules/sms-codes/Cargo.toml --locked
          python3 - <<'PY'
          import os, subprocess
          subprocess.run([os.environ["ANDROID_HOME"] + "/cmdline-tools/latest/bin/sdkmanager", "--licenses"],
                         input="y\n" * 100, text=True, check=True)
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066"
          python3 scripts/modules/build-android-module.py --module-dir modules/sms-codes --library-name libcopypaste_module_sms_codes.so --architecture ${{ matrix.architecture }} --ndk "$ANDROID_HOME/ndk/29.0.13846066"
      - name: Sign separately installed module
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("modules/sms-codes/module.json"))["version"])')"
          python3 scripts/modules/package.py --module-dir modules/sms-codes --library modules/sms-codes/target/${{ matrix.target }}/release/libcopypaste_module_sms_codes.so --platform android --architecture ${{ matrix.architecture }} --output dist/CopyPasteModule-copypaste.sms-codes-v${version}-android-${{ matrix.architecture }}.cpmodule
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-codes-android-${{ matrix.architecture }}
          if-no-files-found: error
          path: dist/*.cpmodule
