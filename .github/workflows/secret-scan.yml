name: Secret scan

# gitleaks from its pinned release tarball rather than gitleaks-action: the
# action is licensed per organisation for anything that is not a public
# repository, so a visibility change would break CI rather than the build that
# caused it. The same binary then drives the scan and the self-test, which is
# what makes the self-test evidence about the scan.
#
# The scan policy is `.gitleaks.toml` with `.gitleaksignore` at the repository
# root; `config/gitleaks/` is the product detector's rule source, not this scan.

on:
  workflow_call:
    inputs:
      history:
        description: Scan every commit instead of the checked-out tree.
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing in this job writes to the tree, so a tree scan sees exactly
          # the tracked content checkout wrote. History mode needs every commit.
          fetch-depth: ${{ inputs.history && '0' || '1' }}

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Before the real scan, mirroring the RustSec policy self-tests: a scan
      # that cannot fail reports the same green as a clean repository.
      - name: Seeded-secret self-test
        run: ./scripts/check-secret-scan.sh --self-test

      - name: Scan
        run: ./scripts/check-secret-scan.sh --scan ${{ inputs.history && '--history' || '' }}
