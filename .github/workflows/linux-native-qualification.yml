name: Linux native qualification

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful production release run containing the exact current Linux packages
        required: true
        type: string
      previous_artifact_run_id:
        description: Successful earlier production release run; omit only when creating the first-install baseline
        required: false
        type: string
        default: ""

concurrency:
  group: linux-native-qualification-${{ inputs.artifact_run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Verify exact artifact sources
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      previous_version: ${{ steps.source.outputs.previous_version }}
      upgrade_mode: ${{ steps.source.outputs.upgrade_mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          PREVIOUS_ARTIFACT_RUN_ID: ${{ inputs.previous_artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/current-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/current-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/current-artifacts.json"
          commit="$(jq -r '.head_sha' "$RUNNER_TEMP/current-run.json")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$commit" ]] || {
            echo "ERROR: dispatch this workflow from the exact commit that built artifact_run_id" >&2
            exit 1
          }
          python3 scripts/release/verify-linux-artifact-source-run.py \
            --run "$RUNNER_TEMP/current-run.json" --jobs "$RUNNER_TEMP/current-jobs.json" --artifacts "$RUNNER_TEMP/current-artifacts.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$commit"
          upgrade_mode=first_install_baseline
          previous_version=""
          if [[ -n "$PREVIOUS_ARTIFACT_RUN_ID" ]]; then
            [[ "$PREVIOUS_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_ARTIFACT_RUN_ID" > "$RUNNER_TEMP/previous-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_ARTIFACT_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/previous-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_ARTIFACT_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/previous-artifacts.json"
            previous_commit="$(jq -r '.head_sha' "$RUNNER_TEMP/previous-run.json")"
            [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
            python3 scripts/release/verify-linux-artifact-source-run.py \
              --run "$RUNNER_TEMP/previous-run.json" --jobs "$RUNNER_TEMP/previous-jobs.json" --artifacts "$RUNNER_TEMP/previous-artifacts.json" \
              --repository "$GITHUB_REPOSITORY" --commit "$previous_commit"
            previous_version="$(git show "$previous_commit:apps/copypaste_flutter/pubspec.yaml" | awk '/^version:[[:space:]]*/ {print $2; exit}')"
            previous_version="${previous_version%%+*}"
            upgrade_mode=prior_release
          fi
          version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' apps/copypaste_flutter/pubspec.yaml)"
          version="${version%%+*}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$upgrade_mode" == first_install_baseline || "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "previous_version=$previous_version"
            echo "upgrade_mode=$upgrade_mode"
          } >> "$GITHUB_OUTPUT"

  scenario:
    name: ${{ matrix.architecture }} ${{ matrix.desktop }} ${{ matrix.session }}
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            desktop: GNOME
            session: x11
          - architecture: x86_64
            runner: ubuntu-24.04
            desktop: GNOME
            session: wayland
          - architecture: x86_64
            runner: ubuntu-24.04
            desktop: KDE
            session: x11
          - architecture: x86_64
            runner: ubuntu-24.04
            desktop: KDE
            session: wayland
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            desktop: GNOME
            session: x11
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            desktop: GNOME
            session: wayland
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            desktop: KDE
            session: x11
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            desktop: KDE
            session: wayland
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Install disposable desktop scenario dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-user-session gnome-shell gnome-session gnome-keyring gnome-shell-extension-appindicator \
            kde-config-screenlocker kwin-wayland kwin-x11 plasma-workspace \
            libsecret-tools wl-clipboard wtype x11-utils xdotool xdg-desktop-portal \
            xdg-desktop-portal-gnome xdg-desktop-portal-kde xvfb rpm cpio xclip python3-gi build-essential pkg-config libgtk-3-dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-linux-${{ matrix.architecture }}
          path: current
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.source.outputs.upgrade_mode == 'prior_release'
        with:
          name: production-linux-${{ matrix.architecture }}
          path: previous
          run-id: ${{ inputs.previous_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Execute exact package scenarios in a nested desktop
        run: |
          set -euo pipefail
          chmod +x scripts/release/run-linux-native-desktop-session.sh scripts/release/run-linux-native-scenarios.sh scripts/release/run-fedora-plasma6-qualification.sh
          mkdir -p evidence
          producer=(python3 scripts/release/produce-linux-native-qualification.py
            --artifacts current --version "${{ needs.source.outputs.version }}"
            --architecture "${{ matrix.architecture }}" --desktop "${{ matrix.desktop }}" --session "${{ matrix.session }}"
            --commit "${{ needs.source.outputs.commit }}" --source-run-id "$GITHUB_RUN_ID" --artifact-run-id "${{ inputs.artifact_run_id }}"
            --driver scripts/release/run-linux-native-scenarios.sh --output evidence)
          if [[ "${{ needs.source.outputs.upgrade_mode }}" == prior_release ]]; then
            producer+=(--previous-artifacts previous --previous-version "${{ needs.source.outputs.previous_version }}")
          fi
          if [[ "${{ matrix.desktop }}" == KDE ]]; then
            fedora_producer=(python3 /work/scripts/release/produce-linux-native-qualification.py
              --artifacts /artifacts --version "${{ needs.source.outputs.version }}"
              --architecture "${{ matrix.architecture }}" --desktop KDE --session "${{ matrix.session }}"
              --commit "${{ needs.source.outputs.commit }}" --source-run-id "$GITHUB_RUN_ID" --artifact-run-id "${{ inputs.artifact_run_id }}"
              --driver /work/scripts/release/run-linux-native-scenarios.sh --output /evidence)
            fedora_args=(--session "${{ matrix.session }}" --architecture "${{ matrix.architecture }}" --artifacts current --evidence evidence)
            if [[ "${{ needs.source.outputs.upgrade_mode }}" == prior_release ]]; then
              fedora_args+=(--previous-artifacts previous)
              fedora_producer+=(--previous-artifacts /previous --previous-version "${{ needs.source.outputs.previous_version }}")
            fi
            scripts/release/run-fedora-plasma6-qualification.sh "${fedora_args[@]}" -- "${fedora_producer[@]}"
          else
            scripts/release/run-linux-native-desktop-session.sh \
              --desktop GNOME --session "${{ matrix.session }}" -- "${producer[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-native-row-${{ matrix.architecture }}-${{ matrix.desktop }}-${{ matrix.session }}
          if-no-files-found: warn
          path: evidence

  evidence:
    name: Assemble verified Linux native qualification
    needs: [source, scenario]
    if: ${{ needs.scenario.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-native-row-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-linux-x86_64
          path: artifacts/x86_64
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-linux-aarch64
          path: artifacts/aarch64
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Reject partial, stale, or forged matrix evidence
        run: |
          set -euo pipefail
          mkdir artifacts/all
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/all/ \;
          python3 scripts/release/verify-linux-native-qualification.py \
            --root evidence --artifacts artifacts/all --version "${{ needs.source.outputs.version }}" \
            --commit "${{ needs.source.outputs.commit }}" --source-run-id "$GITHUB_RUN_ID" --artifact-run-id "${{ inputs.artifact_run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native-qualification
          if-no-files-found: error
          path: evidence
