# Branch-only diagnostics; these artifacts never qualify a release.
name: GTK startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install the production fixture dependency set and profiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core build-essential dbus-x11 gobject-introspection libgirepository1.0-dev \
            libgtk-3-dev libmutter-14-dev libsecret-1-dev libssl-dev \
            libx11-dev libxres-dev libxi-dev libxtst-dev nodejs pkg-config ripgrep sway \
            x11-utils xvfb wl-clipboard strace
      - name: Compile the unchanged native tests before profiling
        run: cargo test --locked -p copypaste-daemon live_x11_fixture --no-run
      - name: Profile the exact X11 fixture and preserve its exit status
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          set +e
          CARGO_NET_OFFLINE=true timeout 120s strace -ff -tt -T -s 128 \
            -e trace=file,process,connect,poll,ppoll,futex,clock_nanosleep \
            -o "$PWD/diagnostics/x11" bash scripts/test-linux-clipboard-x11.sh > diagnostics/fixture.log 2>&1
          result=$?
          echo "$result" > diagnostics/status
          exit "$result"
      - name: Collect payload-free helper traces and startup metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          root = Path("diagnostics")
          public = root / "public"
          public.mkdir(parents=True, exist_ok=True)
          text = (root / "fixture.log").read_text(errors="replace") if (root / "fixture.log").is_file() else ""
          phases = [line for line in text.splitlines() if "GTK_PROVIDER_" in line]
          (public / "phases.log").write_text("\n".join(phases) + "\n")
          traces = {path.name.rsplit(".", 1)[-1]: path for path in root.glob("x11.*")}
          selected = {pid for pid, path in traces.items() if re.search(r'execve\("[^"\n]*/linux-clipboard-provider"', path.read_text(errors="replace"))}
          pending = list(selected)
          while pending:
              pid = pending.pop()
              for line in traces[pid].read_text(errors="replace").splitlines():
                  if "clone" in line:
                      match = re.search(r"= ([0-9]+)(?: |$)", line)
                      if match and match[1] in traces and match[1] not in selected:
                          selected.add(match[1])
                          pending.append(match[1])
          slow = []
          for pid in sorted(selected):
              path = traces[pid]
              shutil.copyfile(path, public / ("gtk-provider." + pid + ".strace"))
              for line in path.read_text(errors="replace").splitlines():
                  match = re.search(r"<([0-9.]+)>$", line)
                  if match and float(match[1]) >= 0.001:
                      slow.append({"pid": pid, "seconds": float(match[1]), "call": line})
          fonts = subprocess.run(["fc-list", "--format=%{file}\n"], capture_output=True, text=True)
          summary = {
              "fixture_exit": (root / "status").read_text().strip() if (root / "status").is_file() else None,
              "helper_pids": sorted(selected), "font_files": len(set(fonts.stdout.splitlines())),
              "environment": {name: os.environ.get(name) for name in ("GTK_THEME", "GTK_IM_MODULE", "GSETTINGS_BACKEND", "XDG_CURRENT_DESKTOP", "XMODIFIERS", "FONTCONFIG_FILE", "FONTCONFIG_PATH")},
              "slow_calls": sorted(slow, key=lambda item: item["seconds"], reverse=True)[:30],
          }
          (public / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print("\n".join(phases))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gtk-startup-diagnostics
          path: diagnostics/public
          if-no-files-found: error
