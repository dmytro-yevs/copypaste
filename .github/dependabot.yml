# Security updates only. Version updates are deliberate lockfile changes, and
# supply-chain.yml already runs cargo audit and cargo deny on pushes and weekly.
# Security update pull requests remain enabled despite the zero version-PR cap.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # RUSTSEC-2024-0429 is pinned by Tauri's unshipped Linux GTK stack.
      # Dependabot cannot scope an ignore to one advisory, so remove this entry
      # when that stack resolves glib 0.20 or later. See ADR-0021.
      - dependency-name: "glib"
