[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-linux-android" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = [
    # proc-macro-error 1.0.4 unmaintained.
    # Transitive via tray-icon -> muda/libappindicator -> gtk -> glib-macros/gtk3-macros.
    # No safe upgrade upstream. Revisit when tray-icon migrates off gtk3.
    "RUSTSEC-2024-0370",
    # gtk-rs GTK3 bindings unmaintained (atk, gdk, gdk-pixbuf, gdk-sys, gio,
    # gtk, gtk-sys, pango). Transitive via tray-icon -> libappindicator -> gtk.
    # No safe upgrade upstream until tray-icon migrates off gtk3.
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # More gtk-rs GTK3 X11/Wayland backend bindings unmaintained (same tray-icon ->
    # libappindicator -> gtk chain; Linux UI only, not built on macOS/Android).
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0417", # gdkx11
    # unic-* unmaintained (char-range/common/char-property/ucd-version/ucd-ident).
    # Transitive via urlpattern -> tauri-utils -> copypaste-ui (UI build only).
    # No safe upgrade upstream; not on the core crypto/IPC path.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # ── Retry/backoff. THIS ONE HAS A FIX AND SHOULD NOT BE HERE LONG. ────────
    # backoff 0.4.0 is unmaintained; the advisory names `backon` as the
    # maintained replacement. It is a direct workspace dependency — the "ONE
    # implementation" that Cargo.toml's comment says replaced v1's six — and it
    # is used by copypaste-daemon and copypaste-cloud.
    #
    # Ignored rather than fixed here only because [workspace.dependencies] and
    # crates/ are owned by other agents this cycle. This is a two-line swap
    # (backoff -> backon) plus call-site updates, not an unfixable transitive.
    # Delete both entries below once it lands; do not let them calcify.
    "RUSTSEC-2025-0012",
    # instant 0.1.13 unmaintained — pulled in solely by backoff 0.4. Goes away
    # with the entry above; there is nothing else to do about it.
    "RUSTSEC-2024-0384",
    # ─────────────────────────────────────────────────────────────────────────
    #
    # REMOVED 2026-07-30, with the same reasoning the note below records:
    #   RUSTSEC-2024-0436 (paste)   — `paste` is no longer in Cargo.lock
    #   RUSTSEC-2025-0141 (bincode) — `bincode` is no longer in Cargo.lock
    # Both were inherited from v1's deny.toml and matched nothing, which
    # cargo-deny reports as `advisory-not-detected`. Re-add with a fresh
    # justification if a dependency bump reintroduces either crate.
    #
    # NOTE: RUSTSEC-2024-0429 (glib 0.18.5 VariantStrIter unsound, Linux/webkit2gtk
    # only) was removed from this list 2026-06-30: cargo-deny v2 does not raise
    # `unsound` informational advisories (only `unmaintained`/`vulnerability`), so
    # the ignore matched no advisory and failed the `advisories` check with
    # `advisory-not-detected`. The glib path is still Linux-webkit2gtk-only and
    # unreachable on the shipped macOS/Android targets; re-add here only if a
    # future cargo-deny/advisory-db actually raises it (see bd CopyPaste-8p37).
]

[licenses]
version = 2
# cargo-deny 0.14+ removed `deny`, `copyleft`, `allow-osi-fsf-free`, `default`
# (see EmbarkStudios/cargo-deny#611). Anything not in `allow` is implicitly
# denied — including GPL-2.0 / GPL-3.0 / AGPL-3.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",                # Boost Software License — clipboard-win
    "CC0-1.0",                # public-domain dedication used by a few transitives
    "CDLA-Permissive-2.0",    # webpki-roots (transitive via reqwest/hyper-rustls in copypaste-supabase)
]
confidence-threshold = 0.8


[bans]
# Duplicate detection. "warn" rather than "deny": in a tree with Tauri in it,
# some duplication is imposed by upstream and a hard gate would be permanently
# red. The value is the report — CLAUDE.md rule 1 is a rule about duplication,
# and `--show-stats` in the CI job prints the count so it is visible whether it
# is trending up or down.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# CLAUDE.md's third dependency exemption is "it would pull a second crypto or
# TLS stack into the tree", and Cargo.toml states the intent directly: reqwest
# and tokio-tungstenite are configured for rustls "so no OpenSSL C build enters
# the tree". That intent is currently satisfied — neither crate below is in
# Cargo.lock — and this is what stops a future `default-features = true`
# somewhere from quietly undoing it.
#
# This is the cheap half of rule 1: a stated invariant that a machine checks.
deny = [
    { name = "openssl", reason = "second TLS stack; the workspace is rustls-only (CLAUDE.md rule 1, exemption 3)" },
    { name = "openssl-sys", reason = "pulls a C OpenSSL build into the tree; use rustls" },
    { name = "native-tls", reason = "delegates to the platform/OpenSSL TLS stack; use rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
