name = "twilio_signing_key_sid"
category = "credential"
confidence = 0.65
pattern_override = '''\bSK[a-f0-9]{32}\b'''
pattern_decision = "The shape identifies a signing-key SID, not an auth token; word boundaries and inert confidence prevent deletion."

[[rules]]
upstream_ids = ["sendgrid-api-token"]
name = "sendgrid_api_key"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["hashicorp-tf-api-token"]
name = "terraform_cloud_token"
category = "credential"
confidence = 0.99
pattern_override = '''\batlasv1\.[A-Za-z0-9_-]{64,}\b'''
pattern_decision = "Manifest 07 requires legacy tokens without the newer organization prefix."

[[rules]]
upstream_ids = ["gcp-api-key"]
name = "google_api_key"
category = "credential"
confidence = 0.99
pattern_override = '''\b(AIza[A-Za-z0-9_-]{35})'''
pattern_decision = "Manifest 07 binds the legacy 35-character payload fixture even when another token character follows it."

[[rules]]
upstream_ids = ["heroku-api-key"]
name = "heroku_api_key"
category = "credential"
confidence = 0.95
never_auto_delete = true
never_auto_delete_decision = "The word heroku near a delimiter is the whole evidence, and the value is a UUID — the most common identifier shape there is and distinctive to nothing. An app, dyno, release and addon id are all UUIDs and all appear beside the word heroku in ordinary CLI output. anchor_only withholds only where a restricted rule covers the same bytes, so standing alone the rule deleted those; a restricted rule never deletes at all, and manifest I1 ranks that erasure above leaving a real key unsearchable (DMY-162)."

[[rules]]
upstream_ids = ["vault-service-token", "vault-batch-token"]
name = "hashicorp_vault"
category = "credential"
confidence = 0.95
pattern_override = '''\b(?:hv[sb]\.[A-Za-z0-9_-]{32,}|s\.[A-Za-z0-9]{24})\b'''
pattern_decision = "Keep the reviewed 32-character minimum while adding the upstream legacy service-token form."
entropy_override = 3.5
entropy_decision = "One rule merges vault-service-token (3.5) and vault-batch-token (4.0), so the merge has no threshold to inherit. The lower of the two keeps the service-token recall upstream intends; a batch token's own randomness clears it easily."
keywords_override = ["hvs.", "hvb.", "s."]
keywords_decision = "The merged service and batch rule must prefilter all three accepted prefixes."

[[rules.allowlist_regex_overrides]]
source = '''s\.[A-Za-z]{24}'''
replacement = '''^s\.[A-Za-z]{24}$'''
decision = "The merged compatibility rule also matches hvs.; anchor the legacy s. allowlist so it cannot suppress that distinct prefix."

[[rules]]
upstream_ids = ["cloudflare-api-key"]
name = "cloudflare_api_token"
category = "credential"
confidence = 0.92
pattern_override = '''(?i)\b(?:CLOUDFLARE_API_(?:TOKEN|KEY)|CF_API_TOKEN)\s*=\s*([A-Za-z0-9_-]{40})\b'''
pattern_decision = "The env-var context anchor is the reason a bare 40-character blob cannot auto-wipe; the value is captured so the value validator sees the token rather than the variable name, which contains the keyword."
secret_group = 1
validator = "value_strength"
entropy_override = 4.3
entropy_decision = "Upstream's 2.0 is a repository scanner's number and it deleted CLOUDFLARE_API_TOKEN=YOUR_TOKEN_HERE_<24 X> at 2.233 (DMY-162). The pattern fixes the value at 40 characters over 64 symbols, so the populations are measurable: 80,000 single-case word templates at that length top out at 4.225, and 4.3 rejects 3.4 of every 10,000 random 40-character tokens. That 4.225 is that population's ceiling and not the template ceiling — mixed case with digits reaches 4.354 — and the number may not be raised to cover the difference: 4.4 rejects 30.5 in 10,000, and by 4.2 tightening a restricted rule creates deletions rather than preventing them. The placeholder count below answers that overlap instead."
keywords_override = ["cloudflare_api_", "cf_api_token"]
keywords_decision = "The local CF_API_TOKEN alias is absent from the upstream keyword list."
secret_shape_allowlist_from = "generic-api-key"
secret_shape_allowlist_decision = "Gitleaks' own secret allowlist for generic-api-key: a value spelled only from letters, underscore, dot and hyphen is a template whatever it says, which is the question entropy cannot answer (DMY-162). The cost is a real token drawn without a digit, about 1 in 900 at 40 characters over 64 symbols."
placeholder_stopwords_from = "generic-api-key"
placeholder_stopwords_minimum = 3
placeholder_stopwords_decision = "The one template both other gates miss is prose written in mixed case with digits: Replace_With_Your_Real_Token_Value123456 measures 4.354, above the 4.3 this rule may not raise, and carries a digit so the shape guard leaves it. Counting distinct vendored placeholder words separates it from a credential, but only if the count is above one, because 9.1 binds a real token that contains or begins with a single todo, your, dummy or sample marker as detected. Measured over the vendored 1,446-word list: that template carries 4 markers and every 9.2 Cloudflare template carries 3 to 6, while the four binding one-marker fixtures carry at most 1. At 3 the cost against 200,000 random 40-character tokens is 0, and 46 for one beginning todo, against 3,681 at a minimum of 2."
never_auto_delete = true
never_auto_delete_decision = "CLOUDFLARE_API_TOKEN= proves which field matched and nothing about the value. The template and credential entropy populations overlap in the tail, so an unforeseen template can still clear 4.3, and manifest I1 ranks that irreversible deletion above leaving a real token unsearchable."

[[rules]]
upstream_ids = ["private-key"]
name = "private_key"
category = "credential"
confidence = 0.99
pattern_override = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
pattern_decision = "Manifest 07 requires detection from the header before a complete closing block is present."

[[rules]]
upstream_ids = ["generic-api-key"]
name = "generic_api_key"
category = "credential"
confidence = 0.75
secret_group = 1
anchor_only = true
anchor_only_decision = "A keyword, a delimiter and [A-Za-z0-9_.=-]{10,150} are the whole match, so over bytes a restricted rule already judged this is the same anchor read again on weaker gates rather than separate evidence. Marking it here and not on the rules with a unique literal is what returns auto-wipe to GITHUB_TOKEN=ghp_..., VAULT_TOKEN=hvs.... and AUTH_TOKEN=<JWT>, which 4.2's band table and 9.1 both call deletable (DMY-162)."
pattern_override = '''(?i)[A-Za-z0-9_.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \tA-Za-z0-9_.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([A-Za-z0-9_.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
pattern_decision = "Go RE2 word characters are ASCII; explicit ASCII classes preserve the pinned regex semantics without Rust regex's oversized Unicode automata."

[[rules.allowlist_regex_overrides]]
source = '''import[ \t]+{[ \t\w,]+}[ \t]+from[ \t]+['"][^'"]+['"]'''
replacement = '''import[ \t]+\{[ \t\w,]+\}[ \t]+from[ \t]+['"][^'"]+['"]'''
decision = "Go RE2 treats braces without a decimal quantifier as literals; Rust regex requires them escaped."

[[rules.allowlist_regex_overrides]]
source = '''^[a-zA-Z_.-]+$'''
replacement = '''^[a-zA-Z_.-]+={0,3}$'''
decision = "Upstream's own capture group admits =, so AccountKey=<86 letters>== is captured with its base64 padding and this allowlist no longer matches the value it was written for. That left the all-letter Azure template deletable through this rule alone while the other five rejected it (DMY-162). The padding is not evidence of a credential: the value still carries no digit and no symbol, which is the whole of what the shape asks. Only this rule's own copy is widened; the four rules that borrow the allowlist take the vendored literal unchanged."

