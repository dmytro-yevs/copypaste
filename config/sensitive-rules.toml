[[overlay]]
name = "azure_storage_key"
category = "credential"
confidence = 0.90
pattern = '''AccountKey=([A-Za-z0-9+/]{86})=='''
secret_group = 1
validator = "value_strength"
entropy = 4.8
entropy_decision = "The AccountKey= anchor proves the field and says nothing about the value, so the value's own randomness is the only thing separating a real 86-character key from a README placeholder. 86 characters leave the widest gap of the four: 500,000 random keys all measure above 4.92 while word templates at that length top out at 4.27, so 4.8 rejects none of the first and all of the second."
secret_shape_allowlist_from = "generic-api-key"
secret_shape_allowlist_decision = "The same vendored generic-api-key secret allowlist the other three take. At 86 characters over 64 symbols a real key drawn from letters alone is about 1 in 57 million, so the shape guard costs almost nothing here and still closes the all-letter template."
never_auto_delete = true
never_auto_delete_decision = "AccountKey= proves which field matched and nothing about the value; 86 characters widen the gap between the two populations without closing it, and manifest I1 ranks an irreversible deletion above an unsearchable key."

[[overlay]]
name = "azure_sas_token"
category = "credential"
confidence = 0.92
pattern = '''(?i)(?:\bsv=\d{4}-\d{2}-\d{2}\b[^\s#]*&(?:amp;)?sig=[A-Za-z0-9%+/]{40,}|\bsig=[A-Za-z0-9%+/]{40,}[^\s#]*&(?:amp;)?sv=\d{4}-\d{2}-\d{2}\b)'''

[[overlay]]
name = "putty_private_key"
category = "credential"
confidence = 0.99
pattern = '''(?m)^PuTTY-User-Key-File-[0-9]+:'''

[[overlay]]
name = "generic_bearer"
category = "credential"
confidence = 0.65
pattern = '''(?i)\bBearer\s+[A-Za-z0-9\-._~+/]{20,}'''

[[overlay]]
name = "generic_password_kv"
category = "credential"
confidence = 0.75
# Manifest 07 §3.2 rule 23 spelled each compound keyword one way, so
# `access.token:` — the ordinary YAML and CLI-flag spelling — reached no rule at
# all. The delimiter is one character and deliberately not optional: written
# `access[-_. ]?token` the literal the prefilter can require collapses from
# `access_token` to `access`, and every rule in the set pays for that.
# `db password` and `client secret` need no branch of their own; the bare
# `password` and `secret` keywords already match inside them. The `api_key`
# family is `api_key_kv` below.
#
# No `secret_shape_allowlist_from` here or on that rule: both are
# `never_auto_delete`, so the shape guard could prevent no deletion, and its
# only reachable effect was to send an all-letter password or key to
# `clipboard_fts` (DMY-162). The four rules with machine-issued values keep it.
pattern = '''(?i)(?:password|passwd|secret|auth[-_. ]token|access[-_. ]token|client_secret|refresh[-_. ]token|db_password)["']?\s*[:=]\s*(\S{6,})'''
validator = "value_strength"
secret_group = 1
entropy = 2.0
entropy_decision = "Measured, and it answers only the repetitive half of the placeholder pair in manifest 5.6. This rule's own 9.1 fixtures fix the ceiling: password=hunter2 and secret = !abcdef measure 2.807, so any threshold that reached a word-spelled template would take a real short password with it — 2.5 rejects 19% of six-character values and 2.8 rejects passw0rd at 2.750. At 2.0 the rule rejects a value spelled from four or fewer effective symbols, and costs 1,145 real values in 100,000 at the six characters the pattern admits, 29 at eight and none at ten or more. The word-spelled templates belong to the shape guard, not to this number."
never_auto_delete = true
never_auto_delete_decision = "password= and client_secret= prove which field matched and nothing about the value, which is 4.2's argument for the four context-anchored rules at the same keyword-anchor strength. A template written in words and digits together clears every gate this rule carries, and manifest I1 ranks deleting it above leaving a real password unsearchable."

[[overlay]]
name = "api_key_kv"
category = "credential"
confidence = 0.75
# `generic_password_kv` with the `api_key` family taken out of it. The counted
# word list that was the whole reason for the split suppressed real values and
# is gone (DMY-162), so the two rules now carry the same gates and the split
# survives as a separate rule name. The delimiter is one character and not
# optional, for the reason the sibling rule gives.
pattern = '''(?i)(?:api[-_. ]key|apikey)["']?\s*[:=]\s*(\S{6,})'''
validator = "value_strength"
secret_group = 1
entropy = 2.0
entropy_decision = "The number is generic_password_kv's, unchanged, because the value population is the same one: what a person or a README writes after a keyword. It answers the repetitive half of 5.6's placeholder pair — TWILIO_API_KEY=ACxxxx... at 0.382 and MAILGUN_API_KEY=key-0000... at 0.741 — and nothing above 9.1's password=hunter2 ceiling of 2.807 may be asked of it."
never_auto_delete = true
never_auto_delete_decision = "api_key= proves which field matched and nothing about the value, exactly as password= does for the rule it was split from. A real key still reaches this rule and is still withheld; only the deletion is refused (I1)."

[[overlay]]
name = "aws_secret_access_key"
category = "credential"
confidence = 0.99
pattern = '''(?i)aws_secret_access_key["']?\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})'''
secret_group = 1
validator = "value_strength"
entropy = 4.3
entropy_decision = "Same reasoning and the same value shape as cloudflare_api_token — 40 characters over 64 symbols — so the same number. 3.0 deleted aws_secret_access_key = REPLACE/WITH/YOUR/AWS/SECRET/ACCESS/KEYX at 3.759 (DMY-162). AWS's own published EXAMPLEKEY secret measures 4.663 and is still detected."
secret_shape_allowlist_from = "generic-api-key"
secret_shape_allowlist_decision = "The same vendored generic-api-key secret allowlist. AWS's own EXAMPLEKEY secret carries a slash and is untouched by it; the cost is a real 40-character key drawn from letters alone, about 1 in 7,500."
never_auto_delete = true
never_auto_delete_decision = "The same anchor argument at the same 40-character shape as cloudflare_api_token: the field is proven and the value is not."

[[overlay]]
name = "http_basic_auth"
category = "credential"
confidence = 0.65
pattern = '''(?i)\bAuthorization:\s*Basic\s+[A-Za-z0-9+/]{16,}={0,2}'''

[[overlay]]
name = "dotenv_secret"
category = "infrastructure"
confidence = 0.80
pattern = '''(?m)^(?:export\s+)?[A-Z][A-Z0-9_]{2,}(?:_KEY|_SECRET|_TOKEN|_PASSWORD|_PASS|_PWD|_CREDENTIALS?)\s*=\s*(\S+)'''
# The variable name is the only evidence this rule has, and a README's
# CLOUDFLARE_API_TOKEN=YOUR_TOKEN_HERE line carries the same name as the real
# one. Value strength cannot separate them on its own: a placeholder is long.
validator = "value_strength"
secret_group = 1
entropy = 4.4
entropy_decision = "The variable name is the only evidence, so the value's randomness is what separates MY_API_TOKEN=<real> from the identical line in a README. Alone of the four this rule fixes neither a length nor an alphabet, so its number must clear the word-template ceiling at every length its (\\S+) admits — measured 4.27 at 86 characters — rather than at one. 3.5 deleted MY_API_TOKEN=REPLACE_ME_WITH_THE_REAL_VALUE_PLEASE_OK at 3.631 (DMY-162). The cost is stated in manifest 5.6: a hex-alphabet value can never reach 4.4, so those fall to generic_api_key at 0.75."
secret_shape_allowlist_from = "generic-api-key"
secret_shape_allowlist_decision = "The same vendored generic-api-key secret allowlist, and the reason MY_API_TOKEN=sk_test_abcdefghijklmnopqrstuvwx no longer classifies: its characters are nearly all distinct, so it measures 4.515 and no threshold separates it, but it is spelled without a digit or a symbol. The cost is a real all-letter value, about 1 in 280 for a 32-character alphanumeric token."
never_auto_delete = true
never_auto_delete_decision = "The variable name is the only evidence and (\\S+) fixes neither a length nor an alphabet, so this rule overlaps ordinary templates more widely than the other three and may never be a reason to delete."

[[overlay]]
name = "db_conn_string"
category = "infrastructure"
confidence = 0.99
pattern = '''(?i)(?:postgresql|postgres|mysql|mongodb|redis|amqp|mssql)://[^@\s]*:[^@\s]*@\S+'''

[[overlay]]
name = "ip_with_port"
category = "infrastructure"
confidence = 0.65
pattern = '''\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?):\d{2,5}\b'''

[[overlay]]
name = "credit_card"
category = "financial"
confidence = 0.99
# Manifest 07 §3.3's scanner accepted any single [\s-] between digits, so a
# column of amounts one per line, or an ISBN with a quantity after it, became
# one candidate and passed Luhn about one time in ten.
#
# One alternative per spelling, because that is what makes the group boundary
# structural: with an optional separator, `\d{4}(?:[ -]?\d{2,6}){2,4}` accepts
# `41111111 11111111` and `4111 111111111111`, so the leading group is only
# four digits when the writer happened to put a separator after it. Spelled
# apart, a separator is mandatory within each grouped form and uniform across
# it, and newline, tab, mixed and repeated separators cannot match at all.
pattern = '''\b(?:\d{4}(?: \d{2,6}){2,4}|\d{4}(?:-\d{2,6}){2,4}|\d{13,19})\b'''
validator = "card_number"
never_auto_delete = true
never_auto_delete_decision = "Issuer range, brand length and Luhn are everything the digits carry, and a Luhn-valid order id inside an issuer range satisfies all three: a mutation over prefixes 4, 51, 35 and 60 auto-wiped 71 of 600 ordinary 16-digit order ids. Manifest I1 ranks that irreversible loss above leaving the user's own card unsearchable, so a validated card is withheld from the index, sync and previews and never deleted."

[[overlay]]
name = "iban"
category = "financial"
confidence = 0.65
pattern = '''(?-u:\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b)'''
validator = "iban"

[[overlay]]
name = "ssn_us"
category = "personal_id"
confidence = 0.65
pattern = '''\b\d{3}[-\s]\d{2}[-\s]\d{4}\b'''
validator = "ssn_structure"

[[overlay]]
