[[overlay]]
name = "azure_sas_token"
category = "credential"
confidence = 0.92
pattern = '''(?i)(?:\bsv=\d{4}-\d{2}-\d{2}\b[^\s#]*&(?:amp;)?sig=[A-Za-z0-9%+/]{40,}|\bsig=[A-Za-z0-9%+/]{40,}[^\s#]*&(?:amp;)?sv=\d{4}-\d{2}-\d{2}\b)'''

[[overlay]]
name = "putty_private_key"
category = "credential"
confidence = 0.99
pattern = '''(?m)^PuTTY-User-Key-File-[0-9]+:'''

[[overlay]]
name = "generic_bearer"
category = "credential"
confidence = 0.65
pattern = '''(?i)\bBearer\s+[A-Za-z0-9\-._~+/]{20,}'''

[[overlay]]
name = "generic_password_kv"
category = "credential"
confidence = 0.75
# Manifest 07 §3.2 rule 23 spelled each compound keyword one way, so `api-key:`
# and `access.token:` — the ordinary YAML and CLI-flag spellings — reached no
# rule at all. The delimiter is one character and deliberately not optional:
# written `api[-_. ]?key` the literal the prefilter can require collapses from
# `api_key` to `api`, and every rule in the set pays for that. `db password` and
# `client secret` need no branch of their own; the bare `password` and `secret`
# keywords already match inside them. The value-strength gate is unchanged, so a
# wider keyword cannot make a weak value wipeable.
pattern = '''(?i)(?:password|passwd|secret|api[-_. ]key|apikey|auth[-_. ]token|access[-_. ]token|client_secret|refresh[-_. ]token|db_password)["']?\s*[:=]\s*(\S{6,})'''
validator = "value_strength"
secret_group = 1

[[overlay]]
name = "aws_secret_access_key"
category = "credential"
confidence = 0.99
pattern = '''(?i)aws_secret_access_key["']?\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})'''
secret_group = 1
# No "example" here, for the reason aws_access_key gives up the upstream
# .+EXAMPLE allowlist: AWS's own published secret key ends EXAMPLEKEY and the
# manifest binds it as a true positive.
placeholder_stopwords = ["your", "placeholder", "changeme", "change_me", "replace", "redacted", "insert", "dummy", "notreal", "todo"]

[[overlay]]
name = "http_basic_auth"
category = "credential"
confidence = 0.65
pattern = '''(?i)\bAuthorization:\s*Basic\s+[A-Za-z0-9+/]{16,}={0,2}'''

[[overlay]]
name = "dotenv_secret"
category = "infrastructure"
confidence = 0.80
pattern = '''(?m)^(?:export\s+)?[A-Z][A-Z0-9_]{2,}(?:_KEY|_SECRET|_TOKEN|_PASSWORD|_PASS|_PWD|_CREDENTIALS?)\s*=\s*(\S+)'''
validator = "value_strength"
secret_group = 1
# The variable name is the only evidence this rule has, and a README's
# CLOUDFLARE_API_TOKEN=YOUR_TOKEN_HERE line carries exactly the same name as the
# real one. Value strength cannot separate them: a placeholder is long.
placeholder_stopwords = ["your", "example", "placeholder", "changeme", "change_me", "replace", "redacted", "insert", "dummy", "sample", "notreal", "todo"]

[[overlay]]
name = "db_conn_string"
category = "infrastructure"
confidence = 0.99
pattern = '''(?i)(?:postgresql|postgres|mysql|mongodb|redis|amqp|mssql)://[^@\s]*:[^@\s]*@\S+'''

[[overlay]]
name = "ip_with_port"
category = "infrastructure"
confidence = 0.65
pattern = '''\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?):\d{2,5}\b'''

[[overlay]]
name = "credit_card"
category = "financial"
confidence = 0.99
# Manifest 07 §3.3's scanner accepted any single [\s-] between digits, so a
# column of amounts one per line, or an ISBN with a quantity after it, became
# one candidate and passed Luhn about one time in ten.
#
# One alternative per spelling, because that is what makes the group boundary
# structural: with an optional separator, `\d{4}(?:[ -]?\d{2,6}){2,4}` accepts
# `41111111 11111111` and `4111 111111111111`, so the leading group is only
# four digits when the writer happened to put a separator after it. Spelled
# apart, a separator is mandatory within each grouped form and uniform across
# it, and newline, tab, mixed and repeated separators cannot match at all.
pattern = '''\b(?:\d{4}(?: \d{2,6}){2,4}|\d{4}(?:-\d{2,6}){2,4}|\d{13,19})\b'''
validator = "card_number"

[[overlay]]
name = "iban"
category = "financial"
confidence = 0.65
pattern = '''(?-u:\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b)'''
validator = "iban"

[[overlay]]
name = "ssn_us"
category = "personal_id"
confidence = 0.65
pattern = '''\b\d{3}[-\s]\d{2}[-\s]\d{4}\b'''
validator = "ssn_structure"

[[overlay]]
name = "email"
category = "personal_id"
confidence = 0.60
pattern = '''\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'''

[[overlay]]
name = "phone_us"
category = "personal_id"
confidence = 0.55
pattern = '''(?:\+1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'''
validator = "phone_shape"

[[overlay]]
name = "passport"
category = "personal_id"
confidence = 0.55
pattern = '''\b[A-Z]{1,2}[0-9]{9}\b'''
