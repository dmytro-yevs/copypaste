[source]
release = "v8.30.1"
commit = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
license = "MIT"
config_url = "https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml"
license_url = "https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/LICENSE"
config_sha256 = "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
license_sha256 = "e3884b252b3bfc045e55be43a34d1e80da070bc6f804ac95bf4660e97d62ebc6"
vendored_config = "config/gitleaks/gitleaks.toml"
vendored_license = "config/gitleaks/LICENSE"
generated_rust = "crates/copypaste-core/src/sensitive/rules_generated.rs"
unsupported_context_decision = "Clipboard scans have no commit or path; OR path/commit clauses can never match, and AND groups containing either are omitted whole. Rules requiring a path are rejected."
regex_dialect_decision = "Pinned RE2 patterns must compile with Rust regex; existing Unicode shorthand behavior is retained because clipboard input is Unicode and every selected credential alphabet is otherwise ASCII-bounded."
use_global_allowlist = false
global_allowlist_decision = "Gitleaks' global allowlist is repository-oriented and suppresses repeated synthetic tokens that the binding manifest requires as true positives; reviewed per-rule content allowlists remain enabled."

[[rules]]
upstream_ids = ["aws-access-token"]
name = "aws_access_key"
category = "credential"
confidence = 0.99
pattern_override = '''\b(?:A3T[0-9A-Z]|AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}'''
pattern_decision = "Manifest 07 requires ASIA keys with trailing digits and the official EXAMPLE fixture."
use_rule_allowlists = false
allowlist_decision = "The upstream .+EXAMPLE allowlist conflicts with the binding true-positive corpus."

[[rules]]
upstream_ids = ["github-fine-grained-pat"]
name = "github_fine_grained"
category = "credential"
confidence = 0.99
entropy_override = 0.0
entropy_decision = "Manifest 07 pins a repetitive synthetic token that upstream entropy rejects."

[[rules]]
upstream_ids = ["github-pat"]
name = "github_classic_pat"
category = "credential"
confidence = 0.99
entropy_override = 0.0
entropy_decision = "Manifest 07 pins ghp_ plus 36 repeated characters."

[[rules]]
upstream_ids = ["github-app-token"]
name = "github_app_token"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["github-oauth"]
name = "github_oauth"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["github-refresh-token"]
name = "github_refresh_token"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["openai-api-key"]
name = "openai_api_key"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["anthropic-api-key", "anthropic-admin-api-key"]
name = "anthropic"
category = "credential"
confidence = 0.99
pattern_override = '''\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{80,}'''
pattern_decision = "Manifest 07 requires the older 80-character fixture while the pinned rules require 93 characters and AA."

[[rules]]
upstream_ids = ["stripe-access-token"]
name = "stripe_live"
category = "credential"
confidence = 0.99
pattern_override = '''\b(?:sk|rk)_(?:live|prod)_[0-9A-Za-z]{10,99}\b'''
pattern_decision = "Test keys occur in public examples; CopyPaste only classifies live and prod keys."
entropy_override = 0.0
entropy_decision = "Manifest 07 pins a repeated-character Stripe fixture."

[[rules]]
upstream_ids = ["npm-access-token"]
name = "npm_token"
category = "credential"
confidence = 0.99
entropy_override = 0.0
entropy_decision = "Manifest 07 pins npm_ plus 36 repeated characters."

[[rules]]
upstream_ids = ["pypi-upload-token"]
name = "pypi_token"
category = "credential"
confidence = 0.99
pattern_override = '''pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,1000}'''
pattern_decision = "Go RE2 word characters are ASCII; spelling the class explicitly preserves the upstream meaning and avoids Rust regex's oversized Unicode repetition."

[[rules]]
upstream_ids = ["slack-bot-token"]
name = "slack_token"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["slack-webhook-url"]
name = "slack_webhook"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["discord-api-token"]
name = "discord_api_token"
category = "credential"
confidence = 0.92

[[rules]]
upstream_ids = ["twilio-api-key"]
name = "twilio_signing_key_sid"
category = "credential"
confidence = 0.65
pattern_override = '''\bSK[a-f0-9]{32}\b'''
pattern_decision = "The shape identifies a signing-key SID, not an auth token; word boundaries and inert confidence prevent deletion."
entropy_override = 0.0
entropy_decision = "The inert compatibility corpus requires repeated lowercase hex to remain detectable."

[[rules]]
upstream_ids = ["sendgrid-api-token"]
name = "sendgrid_api_key"
category = "credential"
confidence = 0.99
entropy_override = 0.0
entropy_decision = "Manifest 07 pins repeated payload segments while preserving the SG dot structure."

[[rules]]
upstream_ids = ["hashicorp-tf-api-token"]
name = "terraform_cloud_token"
category = "credential"
confidence = 0.99
pattern_override = '''\batlasv1\.[A-Za-z0-9_-]{64,}\b'''
pattern_decision = "Manifest 07 requires legacy tokens without the newer organization prefix."
entropy_override = 0.0
entropy_decision = "Manifest 07 pins atlasv1. plus 64 repeated characters."

[[rules]]
upstream_ids = ["gcp-api-key"]
name = "google_api_key"
category = "credential"
confidence = 0.99
pattern_override = '''\b(AIza[A-Za-z0-9_-]{35})'''
pattern_decision = "Manifest 07 binds the legacy 35-character payload fixture even when another token character follows it."

[[rules]]
upstream_ids = ["heroku-api-key"]
name = "heroku_api_key"
category = "credential"
confidence = 0.95

[[rules]]
upstream_ids = ["vault-service-token", "vault-batch-token"]
name = "hashicorp_vault"
category = "credential"
confidence = 0.95
pattern_override = '''\b(?:hv[sb]\.[A-Za-z0-9_-]{32,}|s\.[A-Za-z0-9]{24})\b'''
pattern_decision = "Keep the reviewed 32-character minimum while adding the upstream legacy service-token form."
entropy_override = 0.0
entropy_decision = "Manifest 07 requires hvs. plus 32 repeated characters."
keywords_override = ["hvs.", "hvb.", "s."]
keywords_decision = "The merged service and batch rule must prefilter all three accepted prefixes."

[[rules.allowlist_regex_overrides]]
source = '''s\.[A-Za-z]{24}'''
replacement = '''^s\.[A-Za-z]{24}$'''
decision = "The merged compatibility rule also matches hvs.; anchor the legacy s. allowlist so it cannot suppress that distinct prefix."

[[rules]]
upstream_ids = ["cloudflare-api-key"]
name = "cloudflare_api_token"
category = "credential"
confidence = 0.92
pattern_override = '''(?i)\b(?:CLOUDFLARE_API_(?:TOKEN|KEY)|CF_API_TOKEN)\s*=\s*([A-Za-z0-9_-]{40})\b'''
pattern_decision = "The env-var context anchor is the reason a bare 40-character blob cannot auto-wipe; the value is captured so the placeholder stopwords see the token rather than the variable name."
secret_group = 1
placeholder_stopwords = ["your", "example", "placeholder", "changeme", "change_me", "replace", "redacted", "insert", "dummy", "sample", "notreal", "todo"]
placeholder_stopwords_decision = "A 40-character alphanumeric run is exactly the shape of a README placeholder, and the context anchor cannot tell the two apart."
entropy_override = 0.0
entropy_decision = "The context anchor is sufficient and the compatibility test uses a repeated value."
keywords_override = ["cloudflare_api_", "cf_api_token"]
keywords_decision = "The local CF_API_TOKEN alias is absent from the upstream keyword list."

[[rules]]
upstream_ids = ["private-key"]
name = "private_key"
category = "credential"
confidence = 0.99
pattern_override = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
pattern_decision = "Manifest 07 requires detection from the header before a complete closing block is present."

[[rules]]
upstream_ids = ["generic-api-key"]
name = "generic_api_key"
category = "credential"
confidence = 0.75
secret_group = 1
pattern_override = '''(?i)[A-Za-z0-9_.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \tA-Za-z0-9_.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([A-Za-z0-9_.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
pattern_decision = "Go RE2 word characters are ASCII; explicit ASCII classes preserve the pinned regex semantics without Rust regex's oversized Unicode automata."

[[rules.allowlist_regex_overrides]]
source = '''import[ \t]+{[ \t\w,]+}[ \t]+from[ \t]+['"][^'"]+['"]'''
replacement = '''import[ \t]+\{[ \t\w,]+\}[ \t]+from[ \t]+['"][^'"]+['"]'''
decision = "Go RE2 treats braces without a decimal quantifier as literals; Rust regex requires them escaped."

[[rules]]
upstream_ids = ["jwt"]
name = "jwt"
category = "credential"
confidence = 0.95

[[rules]]
upstream_ids = ["gitlab-pat"]
name = "gitlab_pat"
category = "credential"
confidence = 0.99
pattern_override = '''\bglpat-[0-9a-zA-Z_-]{20}\b'''
pattern_decision = "Word boundaries preserve the glued-token false-positive guard."
entropy_override = 0.0
entropy_decision = "The direct compatibility test uses a repeated payload."

[[overlay]]
name = "aws_arn"
category = "infrastructure"
confidence = 0.50
pattern = '''\barn:aws:[a-z][a-z0-9\-]*:[a-z0-9\-]*:[0-9]{12}:[^\s]+'''

