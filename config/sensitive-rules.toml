[source]
release = "v8.30.1"
commit = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
license = "MIT"
config_url = "https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml"
license_url = "https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/LICENSE"
config_sha256 = "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
license_sha256 = "e3884b252b3bfc045e55be43a34d1e80da070bc6f804ac95bf4660e97d62ebc6"
vendored_config = "config/gitleaks/gitleaks.toml"
vendored_license = "config/gitleaks/LICENSE"
generated_rust = "crates/copypaste-core/src/sensitive/rules_generated.rs"
generated_publication_redaction = "config/sensitive-publication-redaction.json"
publication_redaction_rules = [
    "aws_access_key",
    "github_classic_pat",
    "openai_new",
    "openai_legacy",
    "slack_token",
    "stripe_webhook",
    "gitlab_pat",
]
publication_redaction_decision = "Published Android harness evidence is a diagnostic trust boundary. It redacts registered fixtures first, then a conservative subset of canonical detector patterns whose Rust regex syntax is also valid ECMAScript; false positives here remove diagnostic text rather than user data."
unsupported_context_decision = "Clipboard scans have no commit or path; OR path/commit clauses can never match, and AND groups containing either are omitted whole. Rules requiring a path are rejected."
regex_dialect_decision = "Pinned RE2 patterns must compile with Rust regex; existing Unicode shorthand behavior is retained because clipboard input is Unicode and every selected credential alphabet is otherwise ASCII-bounded."
use_global_allowlist = false
global_allowlist_decision = "Gitleaks' global allowlist is repository-oriented and suppresses repeated synthetic tokens that the binding manifest requires as true positives; reviewed per-rule content allowlists remain enabled."

[[rules]]
upstream_ids = ["aws-access-token"]
name = "aws_access_key"
category = "credential"
confidence = 0.99
pattern_override = '''\b(?:A3T[0-9A-Z]|AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}'''
pattern_decision = "Manifest 07 requires ASIA keys with trailing digits and the official EXAMPLE fixture."
use_rule_allowlists = false
allowlist_decision = "The upstream .+EXAMPLE allowlist conflicts with the binding true-positive corpus."

[[rules]]
upstream_ids = ["github-fine-grained-pat"]
name = "github_fine_grained"
category = "credential"
confidence = 0.99

[[rules]]
upstream_ids = ["github-pat"]
name = "github_classic_pat"
category = "credential"
confidence = 0.99

[[rules]]
