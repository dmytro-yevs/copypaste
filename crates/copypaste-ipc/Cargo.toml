[package]
name = "copypaste-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The ONE model of the wire contract. v1 modelled it three times: typed DTOs the
# CLI never imported, a duplicate in the daemon, and untyped Value poking in the
# CLI. Both the daemon and the CLI depend on this crate and on nothing else for
# wire types.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
directories.workspace = true
unicode-segmentation.workspace = true
ts-rs = { workspace = true, optional = true }
# `transport` only: the endpoint type every consumer of this crate already
# frames over, so that "what a local IPC connection is" has one definition
# rather than one per crate.
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
typescript = ["dep:ts-rs"]

# The Windows endpoint: `windows-sys` for one constant, `sha2` and `hex` for the
# per-user pipe name. All three are already resolved in this tree, so these are
# dependency edges and not new packages.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
sha2.workspace = true
hex.workspace = true
