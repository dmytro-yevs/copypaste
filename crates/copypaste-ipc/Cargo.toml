[package]
name = "copypaste-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The ONE model of the wire contract. v1 modelled it three times: typed DTOs the
# CLI never imported, a duplicate in the daemon, and untyped Value poking in the
# CLI. Both the daemon and the CLI depend on this crate and on nothing else for
# wire types.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
directories.workspace = true
unicode-segmentation.workspace = true
ts-rs = { workspace = true, optional = true }
# `transport` only: the endpoint type every consumer of this crate already
# frames over, so that "what a local IPC connection is" has one definition
# rather than one per crate.
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
typescript = ["dep:ts-rs"]

# The Windows endpoint. `interprocess` owns connection waiting, listener
# instance replacement and the Tokio stream adapter; the digest keeps a path
# and username out of the machine-global pipe name.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
sha2.workspace = true
hex.workspace = true
# The owner check on a connected pipe. Same version `interprocess` already
# builds against, so this adds bindings rather than a second copy of them.
# Evaluated instead: `win-security-identifier` (the daemon's, for the server's
# DACL) reads SIDs but cannot query a kernel object's owner, and
# `interprocess` exposes no owner or SQOS surface of its own.
windows-sys.workspace = true
