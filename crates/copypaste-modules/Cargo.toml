[dependencies]
copypaste-sync = { path = "../copypaste-sync" }
copypaste-ipc = { path = "../copypaste-ipc" }
zeroize.workspace = true
copypaste-module-sdk = { path = "../copypaste-module-sdk" }
copypaste-fs = { path = "../copypaste-fs" }
copypaste-core = { path = "../copypaste-core" }
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
