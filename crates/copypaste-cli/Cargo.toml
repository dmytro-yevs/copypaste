[package]
name = "copypaste-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "copypaste"
path = "src/main.rs"

# No copypaste-core dependency: the CLI speaks IPC only.
[dependencies]
copypaste-clock = { path = "../copypaste-clock" }
copypaste-ipc = { path = "../copypaste-ipc" }
backon.workspace = true
tokio.workspace = true
# Framing is LinesCodec, the same codec the daemon uses — not a hand-rolled
# byte-scanning read loop (CLAUDE.md rule 1).
tokio-util.workspace = true
# `sink` is not in futures-util's default feature set; SinkExt::send needs it.
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
comfy-table.workspace = true
