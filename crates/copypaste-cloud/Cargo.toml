[package]
name = "copypaste-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Supabase replaces v1's bespoke relay: 12k lines of write-behind cache, custom
# retry queue, SSE fan-out, supervisor and a second rate limiter, for a service
# that already exists.
[dependencies]
reqwest.workspace = true
tokio-tungstenite.workspace = true
tokio.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
backon.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
hex.workspace = true
url.workspace = true

[dev-dependencies]
# Test-only, and deliberately not a real dependency: `tests/constant_parity.rs`
# is the only thing that reads it, so the skew ceiling the two transports share
# cannot drift without a build failure, and no shipped binary gains an edge.
copypaste-p2p = { path = "../copypaste-p2p" }
tempfile.workspace = true
# `start_paused` for deterministic retry tests without real sleeping.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "=0.6.5"
