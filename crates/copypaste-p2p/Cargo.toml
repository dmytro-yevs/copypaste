[package]
name = "copypaste-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
copypaste-clock = { path = "../copypaste-clock" }
snow.workspace = true
mdns-sd.workspace = true
data-encoding.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
# `raw_value` so a received sync message can be handed to `SyncMessage::decode`
# verbatim: the bounds and the timestamp clamp live in that function, and
# decoding straight into `SyncMessage` would skip both.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
hex.workspace = true
# The wire definition of content identity (protocol::content_hash).
sha2.workspace = true
uuid.workspace = true
# Atomic peer-file writes, not just tests: the file holds PSKs.
tempfile.workspace = true
# Local interface addresses: where a pairing tells a peer to dial, and which
# advertisements on the wire are this device's own. `getifaddrs(3)` behind a
# maintained crate; covers macOS and Android (CLAUDE.md rules 1 and 7).
if-addrs = "0.15"

[dev-dependencies]
tempfile.workspace = true
