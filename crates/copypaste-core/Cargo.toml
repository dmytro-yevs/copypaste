[package]
name = "copypaste-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde_rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
hex.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
directories.workspace = true

# macOS Keychain backend for the device secret. Optional so the crate still
# builds on Linux, where the file-backed development store is used instead.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[features]
# Enabled by default on macOS builds; without it the daemon falls back to the
# 0600 file store, which is a development posture and not a shipping one.
macos-keychain = ["dep:security-framework"]

[dev-dependencies]
tempfile.workspace = true
