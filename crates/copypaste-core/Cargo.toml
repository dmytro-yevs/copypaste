[package]
name = "copypaste-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
copypaste-clock = { path = "../copypaste-clock" }
# `ConfigData` — the settings the ingest path reads. The dependency runs this
# way only: `copypaste-ipc` must never depend on this crate, because the CLI
# depends on it and must not be able to open a database.
copypaste-ipc = { path = "../copypaste-ipc" }
# The wire model of a sync session, and `merge_decision` — the one comparator
# both transports apply (manifest 05 INV-C2). The edge runs this way because
# `copypaste-p2p` deliberately knows nothing about a database, and forking the
# comparator to keep the two crates apart is the defect INV-C2 records. It adds
# no third-party weight to a shipped binary: every consumer of this crate (the
# daemon and the Tauri app) already links `copypaste-p2p`.
copypaste-p2p = { path = "../copypaste-p2p" }
# `block_in_place` only — see `sync::blocking`. Every caller of a `SyncSource`
# is an async task, and SQLite plus an AEAD on the reactor thread is what that
# helper exists to avoid; putting it beside the source is what stops each
# platform growing its own.
tokio.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
hex.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
iban_validate.workspace = true
image.workspace = true

# Declared here as well as in the Android target table below, and optional only
# here: that is what lets `--features android-keystore-typecheck` compile the
# Android backend on a Linux host. On Android the table makes them
# unconditional, so no build of the real thing depends on a flag being passed —
# which is the mistake the macOS keychain shipped for a year.
keyring-core = { version = "1", optional = true }
android-native-keyring-store = { version = "1", optional = true }

# Windows has no system OpenSSL to link SQLCipher against and no third branch
# in libsqlite3-sys's build.rs to fall into — it panics on a missing
# OPENSSL_DIR. Vendored here for the same reason Android vendors below, and
# scoped the same way so macOS keeps CommonCrypto. See ADR-0007.
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

# sha2's `asm` backend, for every target that can assemble it. The feature
# pulls sha2-asm, whose sources are GNU `.S` files that cl.exe rejects, so
# windows-msvc has to resolve sha2 without it. Feature unification carries this
# to the rest of the workspace, exactly as the rusqlite tables around it do.
[target.'cfg(not(windows))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# macOS Keychain backend for the device secret. Target-gated, not feature-gated:
# it is already absent from a Linux build, and the feature that used to guard it
# was never passed by any release script — so every shipped macOS binary wrote
# the secret to a 0600 file instead.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

# Android Keystore backend for the device secret, target-gated for the same
# reason. `android-native-keyring-store` wraps the secret with an AES-GCM key
# held in the Android Keystore and keeps the blob in app-private
# SharedPreferences — the design this needs — and it classifies a missing entry
# as `NoEntry` distinctly from every other failure, which is what port manifest
# 02 I-20 turns on. It adds no second crypto stack (CLAUDE.md rule 1, exemption
# 3): the AES-GCM is Android's own, reached over JNI.
#
# The tradeoff to state: it needs `ndk-context` initialised by the host app,
# which Tauri does not do — `copypaste-ui` supplies that. ADR-0003 records what
# was evaluated and what a first device run would falsify.
#
# Versions are literal rather than `[workspace.dependencies]` entries only
# because the root manifest was held by another agent; they belong there.
[target.'cfg(target_os = "android")'.dependencies]
# The NDK sysroot has no OpenSSL, and `bundled-sqlcipher` links against the
# system one. Vendored here and nowhere else: resolver v2 does not unify
# features from a target that is not being built, so macOS keeps
# CommonCrypto and pays nothing. See ADR-0007.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
keyring-core = "1"
android-native-keyring-store = "1"

# Windows DPAPI backend for the device secret, target-gated for the same reason
# as the two above. `windows-sys` is Microsoft's own binding to `crypt32.dll`,
# and it adds no package to the tree: 0.61 is already resolved through `tokio`
# and `tempfile`, so this is a dependency edge and nothing more.
#
# CLAUDE.md rule 1, exemption 1, for the two calls that stay hand-written here.
# `windows-dpapi` is the only maintained safe wrapper and does not fit: it copies
# the unsealed buffer out and `LocalFree`s it without wiping, which leaves the
# device secret in the process heap on every start and loses I-12 on the one
# value that matters most. It also drops the Windows error code into
# `anyhow::Error`, and that code is what separates "this blob will never open"
# from "the master key is not loaded yet" (I-20).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[features]
# Compile `crypto/keystore/android.rs` on a host that is not Android. It
# selects nothing — the file backend is still what a Linux build uses — and
# exists so that code is type-checked somewhere rather than being dead text on
# every machine this project is built on.
android-keystore-typecheck = ["dep:keyring-core", "dep:android-native-keyring-store"]

[dev-dependencies]
tempfile.workspace = true
# Benchmark harness (CLAUDE.md rule 1 — the alternative was a hand-rolled timing
# loop, which is the wheel this rule is about). `default-features = false` drops
# `plotters` and `rayon`: the report those draw is not worth ~30 transitive
# crates in a dev tree, and the numbers land in `docs/rewrite/performance.md`
# rather than in an HTML report. Cost as configured: 12 dev-only crates, no
# effect on any shipped binary.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# `harness = false` on every one: criterion parses its own arguments, and the
# libtest harness would eat them. It also keeps benches out of `cargo test`,
# which is the point — a bench must never run in the normal test path.
[[bench]]
name = "capture"
harness = false

[[bench]]
name = "binary"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "detect"
harness = false
