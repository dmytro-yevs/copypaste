[package]
name = "copypaste-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `ConfigData` — the settings the ingest path reads. The dependency runs this
# way only: `copypaste-ipc` must never depend on this crate, because the CLI
# depends on it and must not be able to open a database.
copypaste-ipc = { path = "../copypaste-ipc" }
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
hex.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
directories.workspace = true

# macOS Keychain backend for the device secret. Target-gated, not feature-gated:
# it is already absent from a Linux build, and the feature that used to guard it
# was never passed by any release script — so every shipped macOS binary wrote
# the secret to a 0600 file instead.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
tempfile.workspace = true
