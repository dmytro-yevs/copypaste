[package]
name = "copypaste-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Tauri invokes `cargo run --no-default-features`; keep that command pinned to
# the app now that the development-only bridge is a second binary.
default-run = "copypaste-ui"

[lib]
name = "copypaste_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Asked only for the Android C compiler's identity, so build.rs can name the
# compiler-rt archive rather than re-deriving cc's CC_<triple>/TARGET_CC order
# (CLAUDE.md rule 1). Adds no package: openssl-src and ring resolve it already.
cc = "1"

[dependencies]
# The ONE model of the wire contract, shared with the daemon and the CLI. Both
# backends below speak these types; neither defines its own (CLAUDE.md rule 1).
copypaste-ipc = { path = "../../copypaste-ipc" }
copypaste-feedback = { path = "../../copypaste-feedback" }
copypaste-retry = { path = "../../copypaste-retry" }
# `macos-private-api` is what `"transparent": true` + `macOSPrivateApi` in
# tauri.conf.json require; without it tauri-build rejects the config. It rules
# out the Mac App Store, which does not apply — we ship through Homebrew Cask.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-clipboard-manager = "2"
# The native save/open panel, used **only from Rust** (`commands::transfer`).
# Two things follow from that and both are the point: the chosen path never
# crosses into the WebView, so no authored string can carry one (CLAUDE.md rule
# 4); and no capability entry is needed, because the ACL gates the JS bridge and
# nothing here calls the plugin from JS.
tauri-plugin-dialog = "2"
# The dialog returns Android `content://` URIs. The same maintained Tauri
# plugin opens both those URIs and desktop paths without revealing either to
# the WebView.
tauri-plugin-fs = "2"
# Posting to the notification centre needs an application bundle, which the
# daemon does not have — so the capture notification is the app's job and the
# daemon only reports `EventData::captured` (parity 18, backlog B-18). Driven
# from Rust in `shell::notify`, so like the dialog plugin it is granted nothing
# in `capabilities/`.
tauri-plugin-notification = "2"
tokio.workspace = true
# The one retry implementation in the workspace (CLAUDE.md rule 1). Used for
# the bounded wait after starting the background service.
backon.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
copypaste-runtime-log = { path = "../../copypaste-runtime-log" }
copypaste-fs = { path = "../../copypaste-fs" }
uuid.workspace = true
tempfile.workspace = true
ts-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# The in-process backend's crates. Optional here so the Android code path can be
# type-checked on a Linux host with `--features embedded-backend`; the target
# table below makes them unconditional on Android, so the real build needs no
# flag. See `backend::mod` for why the cfg predicate names both.
copypaste-core = { path = "../../copypaste-core", optional = true }
copypaste-p2p = { path = "../../copypaste-p2p", optional = true }
copypaste-cloud = { path = "../../copypaste-cloud", optional = true }
zeroize.workspace = true
# `src/android_context.rs` only: the one JNI entry point in this crate, which
# hands the app context to `ndk-context` so the core's Android Keystore backend
# can find it. Both crates are already in the tree under tao; neither is a new
# stack, and both build on any host — which is what lets the feature below
# type-check that file here. See ADR-0003 for why Tauri does not do this itself.
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2.5.4"

# ---------------------------------------------------------------------------
# Desktop only
# ---------------------------------------------------------------------------
# Both plugins are meaningless on Android and neither compiles there:
# `tauri-plugin-global-shortcut` is itself
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]`.
#
# `tauri-plugin-global-shortcut` delegates to `global-hotkey`, which on macOS
# registers through Carbon `RegisterEventHotKey` and therefore needs no
# Accessibility grant — settled in ADR-0002, and guarded in `shell::hotkey`
# because one corner of that crate does take a `CGEventTap`.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit supplies the frontmost-process hand-off after Quick Paste copies an
# item. Tauri deliberately keeps this platform detail out of its cross-platform
# window API.
objc2-app-kit = { workspace = true, features = ["NSAccessibilityProtocols", "NSAlert", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSImageView", "NSResponder", "NSRunningApplication", "NSSecureTextField", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "NSColor", "NSColorSpace", "libc"] }
objc2.workspace = true
# The maintained objc2 sibling marshals modal AppKit work onto the main queue;
# it is already present through Tauri and avoids raw dispatch FFI.
dispatch2 = "0.3.1"
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSThread"] }
# The exclusion picker walks only the platform's standard application roots
# and reads bundle metadata. Both crates are already in the resolved tree and
# keep binary/XML plist parsing and recursive traversal out of product code.
plist = "1.10"
walkdir = "2.5"
directories.workspace = true
# tauri-plugin-notification reports Granted on desktop without asking TCC.
# The maintained objc2 binding is the real UNUserNotificationCenter prompt.
objc2-user-notifications = { version = "0.2.2", features = [
    "UNUserNotificationCenter",
    "UNNotificationSettings",
    "block2",
] }
block2 = "=0.5.1"
# Maintained encoder/rendering crates own the QR matrix and PNG; pairing code
# must not grow another handwritten QR implementation.
qrcode = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
image.workspace = true
# Tauri's tray hook exposes tray-icon's objc2 0.6 AppKit objects. Keep this
# narrow alias beside the older capture bindings until they can move together.
objc2-menu = { package = "objc2", version = "0.6.4" }
# Application icons are resolved from a captured bundle identifier and
# immediately converted to a bounded PNG. No icon path reaches the WebView.
copypaste-core = { path = "../../copypaste-core" }

# ---------------------------------------------------------------------------
# Windows and Android updater
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "windows")'.dependencies]
# Pairing stays in native controls, including their UI Automation behavior.
winsafe = { version = "0.0.28", features = ["gui", "gdi"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
image.workspace = true
# Source-app icon resolution: App Paths registry lookup, SHGetFileInfoW for the
# icon, GDI to extract the bitmap. The path is transient and never stored (I-9).
# `Win32_System_Threading` is `CREATE_NO_WINDOW` alone: naming the constant
# rather than writing `0x0800_0000` into a spawn call.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# App Paths is Windows' documented executable-registration catalogue. Use the
# maintained registry wrapper for enumeration; the existing icon resolver
# remains the single path-to-executable boundary.
winreg = "0.55"
# Tauri owns feed parsing, version comparison, signature verification,
# download, installation and restart under ADR-0020. Pin the exact API audited
# by the updater command boundary; the dependency stays out of mobile builds.
tauri-plugin-updater = "=2.10.1"
# The daemon must die with the app even when the app is killed outright, which
# is a job object with `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`. `win32job` wraps
# exactly that trio of calls, so ADR-0018's preference for a maintained wrapper
# over hand-written FFI holds here rather than its DPAPI exemption.
win32job = "2"

# ---------------------------------------------------------------------------
# Android only
# ---------------------------------------------------------------------------
# Android hosts no background daemon (ADR-0002), so there is no socket to talk
# to and the core is linked into the app process instead.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-updater = "=2.10.1"
url.workspace = true
copypaste-core = { path = "../../copypaste-core" }
copypaste-p2p = { path = "../../copypaste-p2p" }
copypaste-cloud = { path = "../../copypaste-cloud" }
zeroize.workspace = true
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
# `start_paused` drives the client budgets without a test that actually waits
# ten seconds. Tokio's own clock control, not a second one (CLAUDE.md rule 1).
tokio = { workspace = true, features = ["test-util"] }

# The client budgets have to be proved against a real endpoint on the platform
# that has one. `interprocess` is already the workspace's named-pipe listener
# (`copypaste_ipc::transport::pipe`); a test-only listener of any other shape
# would be a second implementation of the thing under test.
[target.'cfg(windows)'.dev-dependencies]
interprocess.workspace = true

[features]
# Compile the in-process backend on a host that is not Android. Exists so this
# code is type-checked somewhere: without it the whole Android path would be
# dead text on every machine the project is actually built on.
embedded-backend = ["dep:copypaste-core", "dep:copypaste-p2p", "dep:copypaste-cloud", "dep:jni", "dep:ndk-context"]
# Only the separate Android evidence APK may admit loopback plaintext.
cloud-evidence = ["copypaste-cloud/test-endpoints"]
typescript = ["dep:ts-rs", "copypaste-ipc/typescript"]
# Never enabled by Tauri or Android builds. This exists solely for the local
# browser preview, which cannot speak the daemon's private Unix socket.
dev-web-bridge = ["dep:axum", "dep:tower-http"]

[[bin]]
name = "copypaste-web-bridge"
path = "src/bin/copypaste-web-bridge.rs"
required-features = ["dev-web-bridge"]

[[example]]
name = "generate-typescript"
required-features = ["typescript"]
