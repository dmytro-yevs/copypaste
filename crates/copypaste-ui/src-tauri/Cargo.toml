[package]
name = "copypaste-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "copypaste_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The ONE model of the wire contract, shared with the daemon and the CLI. Both
# backends below speak these types; neither defines its own (CLAUDE.md rule 1).
copypaste-ipc = { path = "../../copypaste-ipc" }
# `macos-private-api` is what `"transparent": true` + `macOSPrivateApi` in
# tauri.conf.json require; without it tauri-build rejects the config. It rules
# out the Mac App Store, which does not apply — we ship through Homebrew Cask.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tokio.workspace = true
# The one retry implementation in the workspace (CLAUDE.md rule 1). Used for
# the bounded wait after starting the background service.
backon.workspace = true
tokio-util.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The in-process backend's crates. Optional here so the Android code path can be
# type-checked on a Linux host with `--features embedded-backend`; the target
# table below makes them unconditional on Android, so the real build needs no
# flag. See `backend::mod` for why the cfg predicate names both.
copypaste-core = { path = "../../copypaste-core", optional = true }
copypaste-p2p = { path = "../../copypaste-p2p", optional = true }
# `src/android_context.rs` only: the one JNI entry point in this crate, which
# hands the app context to `ndk-context` so the core's Android Keystore backend
# can find it. Both crates are already in the tree under tao; neither is a new
# stack, and both build on any host — which is what lets the feature below
# type-check that file here. See ADR-0003 for why Tauri does not do this itself.
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

# ---------------------------------------------------------------------------
# Desktop only
# ---------------------------------------------------------------------------
# Both plugins are meaningless on Android and neither compiles there:
# `tauri-plugin-global-shortcut` is itself
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]`.
#
# `tauri-plugin-global-shortcut` delegates to `global-hotkey`, which on macOS
# registers through Carbon `RegisterEventHotKey` and therefore needs no
# Accessibility grant — settled in ADR-0002, and guarded in `shell::hotkey`
# because one corner of that crate does take a `CGEventTap`.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# ---------------------------------------------------------------------------
# Android only
# ---------------------------------------------------------------------------
# Android hosts no background daemon (ADR-0002), so there is no socket to talk
# to and the core is linked into the app process instead.
[target.'cfg(target_os = "android")'.dependencies]
copypaste-core = { path = "../../copypaste-core" }
copypaste-p2p = { path = "../../copypaste-p2p" }
jni = "0.21"
ndk-context = "0.1"

[features]
# Compile the in-process backend on a host that is not Android. Exists so this
# code is type-checked somewhere: without it the whole Android path would be
# dead text on every machine the project is actually built on.
embedded-backend = ["dep:copypaste-core", "dep:copypaste-p2p", "dep:jni", "dep:ndk-context"]

[dev-dependencies]
tempfile.workspace = true
