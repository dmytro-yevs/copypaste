# Local development stack for `supabase start` / `supabase db reset`.
#
# This file configures the *local* stack only. A hosted project is configured in
# its dashboard; the values that must match there are called out in
# `docs/supabase-deployment.md`.

project_id = "copypaste"

[api]
enabled = true
port = 54321
# `private` is deliberately absent: the retention schema must not be reachable
# through PostgREST. Adding it here would expose the one function that can
# delete across accounts.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# PostgREST's own ceiling on a page. The client clamps to 200
# (`rest::MAX_PAGE_LIMIT`), so this only bounds anything hand-rolled.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project. `supabase db reset` builds the shadow database at
# this version, so a mismatch hides version-specific failures until deploy.
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures outbound mail (sign-up confirmations) instead of sending it.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
# One hour, matching the hosted default, so the client's proactive-refresh and
# reactive-401 paths behave locally the way they will in production. Drop it to
# a few minutes when specifically exercising refresh (manifest 05 AT-34/AT-35).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only. The hosted project should require confirmation; without it an
# unverified address can hold an account.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false
