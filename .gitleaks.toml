# Repository secret scan. Not the in-product clipboard detector.
#
# `config/gitleaks/` is a vendored rule *source*, regenerated by
# `cargo run -p copypaste-sensitive-rules -- update`; an allowlist added there
# would be destroyed by the next refresh and would silently change product
# detection. `config/sensitive-rules.toml` sets `use_global_allowlist = false`
# because port manifest 07 requires these same synthetic tokens as binding true
# positives. The product must flag them; this scan must not.

title = "CopyPaste repository scan"

[extend]
useDefault = true

# Every entry is scoped to a rule id and to the reviewed literal. None uses
# `paths`: a global allowlist that matches a path makes gitleaks skip the file
# before any rule runs ("skipping file: global allowlist"), and `condition`
# does not restrain it. Allowlisting a fixture by path would therefore stop
# scanning that file entirely, so a real key committed next to the fixture
# would never be reported.

[[allowlists]]
description = "Sensitive-detector test corpus and the manifest specifying it. Every site is inside a #[cfg(test)] module or a spec table whose subject is the pattern itself. The private-key form is a bare header with at most 12 bytes of body and no key material."
targetRules = [
    "slack-bot-token",
    "github-app-token",
    "jwt",
    "generic-api-key",
    "private-key",
]
regexes = [
    '''xoxb-17653285717-17653285718-AbCdEfGhIjKlMnOpQrStUvWx''',
    '''ghs_16C7e42F292c6912E7710c838347Ae178B4a''',
    '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ1c2VyIn0\.''',
    '''rt_PROD_abc123XYZlongval''',
    '''8f14e45fceea167a5a36dedd4bea2543''',
    '''abc123XYZlong''',
    '''aB3dE5gH7jK9''',
    '''-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----(?:\\n)?(?:MIIE[A-Za-z0-9+/]{0,12})?(?:\.\.\.|…)?["`]''',
]

[[allowlists]]
description = "Two-segment stub in the test asserting Debug for Session redacts its tokens. Not a signed JWT: it has no signature segment."
targetRules = ["generic-api-key"]
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.secret''']

[[allowlists]]
description = "Export/import e2e fixture. Deliberately not the upstream .+EXAMPLE key: the test asserts a credential smuggled in through an import is re-flagged, so the fixture has to clear the default allowlist."
targetRules = ["aws-access-token"]
regexes = ['''AKIAIOSFODNN7SMUGGLE''']

[[allowlists]]
description = "Release evidence scripts POST to the local cloud stub on 127.0.0.1. The bearer names the scenario; there is no account behind it."
targetRules = ["curl-auth-header"]
regexes = ['''native-evidence''']
