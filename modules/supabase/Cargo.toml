[package]
name = "copypaste-module-supabase"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = []
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-endpoints = ["copypaste-cloud/test-endpoints"]

[dependencies]
copypaste-module-sdk = { path = "../../crates/copypaste-module-sdk" }
copypaste-cloud = { path = "../../crates/copypaste-cloud", default-features = false }
copypaste-sync = { path = "../../crates/copypaste-sync", default-features = false }
copypaste-ipc = { path = "../../crates/copypaste-ipc" }
copypaste-clock = { path = "../../crates/copypaste-clock" }
copypaste-retry = { path = "../../crates/copypaste-retry" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
zeroize = "1"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }

[dev-dependencies]
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
