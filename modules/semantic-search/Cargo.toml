[package]
name = "copypaste-module-semantic-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Offline optional semantic search module for CopyPaste."

[workspace]
members = []
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
copypaste-module-sdk = { path = "../../crates/copypaste-module-sdk" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
